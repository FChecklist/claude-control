# VERIDIAN Grafana config -- localhost-only, native systemd --user deployment.
# Replaces the 2026-08-07 docker-compose-based veridian_grafana container
# (task-20260814-131031): same admin username/port convention reused from
# /opt/veridian/monitoring/docker-compose.yml, same standard port 3000, now
# run as a real systemd --user unit instead of a docker container so
# `systemctl --user is-active` is meaningful.
#
# SECRET REDACTED FOR THIS PUBLIC REPO: the real admin_password value lives
# ONLY in the untracked live file at /opt/veridian/monitoring/grafana/grafana.ini
# on the host (this repo copy is a template/reference, not the deployed
# config) -- never fill in a real password here.

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/

[security]
admin_user = rajat
admin_password = REDACTED-see-untracked-live-grafana.ini-on-host
allow_embedding = false

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
data = /opt/veridian/monitoring/grafana/data
logs = /opt/veridian/monitoring/grafana/logs
plugins = /opt/veridian/monitoring/grafana/plugins
provisioning = /opt/veridian/monitoring/grafana/provisioning

[plugins]
allow_loading_unsigned_plugins = frser-sqlite-datasource

[log]
mode = console file
level = info
