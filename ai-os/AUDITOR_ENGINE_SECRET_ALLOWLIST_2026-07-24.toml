title = "veridian-audit-gitleaks-config"

[extend]
useDefault = true

# VERIDIAN Phase 1 confirmed-safe false positives (see
# AUDITOR_ENGINE_TOOL_SMOKETEST_EVIDENCE_2026-07-24.yaml security domain
# custom_work_required item 1). Two categories:
#  1. Next.js build output (.next/) -- regenerated on every build, never a
#     real committed source-of-truth secret even when it briefly ends up in
#     git history.
#  2. The compliance-tracker Supabase project's anon key (decoded JWT
#     payload: {"iss":"supabase","ref":"jusqumifsmtcaujqyjuy","role":"anon",...}).
#     Supabase anon keys are designed to be public (access is gated by
#     Postgres RLS policies, not key secrecy). Matched against a literal
#     base64 substring unique to this specific key's encoded JWT payload
#     (not a generic "any JWT" or "any anon key" pattern), so this entry
#     cannot accidentally suppress a different, genuinely secret JWT.
[allowlist]
description = "VERIDIAN Phase 1 confirmed-safe false positives"
paths = [
  '''\.next/''',
]
regexTarget = "secret"
regexes = [
  '''Imp1c3F1bWlmc210Y2F1anF5anV5''',
]
