self_correction_rules:
  note: 'Added after a real mistake-pattern audit of this project''s memory
    (2026-07-26). Owner instruction: fix these "without creating any system" -- every
    rule below runs on a tool that already existed before this addendum; none was
    built for it. These enforce PROTOCOL_OWNER_AI.yaml article A6 (real completion)
    and A12 (active monitoring) mechanically rather than just asserting them.'
  rule_1_never_trust_a_success_signal:
    trigger: About to report anything as merged/done/fixed.
    action: "gh pr view --json state,mergedAt (or the real equivalent state check) run directly,
      immediately before saying so -- no exception for tier1/auto-merge/loop-wrapped operations."
    why: "Loops and merge scripts have concretely lied about success before (PR #416 reported
      merged while OPEN, 2026-07-18; a retry loop reported exit 0 after ~8 real failures,
      2026-07-21)."
    proven: "2026-07-26: caught PR #560's real merge failure this way when a shortcut check
      would have missed it."
  rule_2_never_repeat_a_memory_claim_unverified:
    trigger: About to state something is built/working/true because a memory record or an
      earlier turn said so.
    action: "Re-check with the real tool that would prove or disprove it -- grep the real file,
      query the real registry (superboss-register.py query-knowledge), read the real git log --
      before repeating it."
    why: "Three prior false 'proven'/'built' claims this project only surfaced because a
      re-check was eventually forced (2026-07-14, 2026-07-20, 2026-07-21/22)."
    proven: "2026-07-26: found a MASTER_INDEX.yaml list-vs-dict verification bug in my own
      earlier check by re-checking instead of trusting the first pass; found phase_1/phase_2's
      self-report gaps by checking real PR state instead of the task.yaml self-report."
  rule_3_never_trust_a_fix_without_confirming_live_wiring:
    trigger: Just merged or built something meant to catch/prevent/report an issue automatically.
    action: "Grep the actual deployed file (not just the PR diff) to confirm it is really
      invoked in the live path."
    why: "A fix existing in a diff is not the same as a fix running in production (the
      anti-forgetfulness logging hook itself was silently wired to the wrong event and had
      captured nothing, 2026-07-22)."
    proven: "2026-07-26: confirmed backfill_phase_self_report.py was actually called from the
      live supervisor-entrypoint.sh, not just present in the merged diff, before believing that
      fix was real."

