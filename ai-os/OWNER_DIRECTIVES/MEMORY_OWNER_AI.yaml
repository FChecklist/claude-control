  consolidation_note: 'Companion to PROTOCOL_OWNER_AI.yaml in this same directory.
    Owner requirement (2026-07-26): exactly ONE lessons/incidents memory file on the
    server. This file moves the self_correction_enforcement_2026-07-26 section
