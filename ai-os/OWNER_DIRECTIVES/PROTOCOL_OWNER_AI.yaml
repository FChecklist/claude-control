system_definition:
  rule: 'SYSTEM means the real, complete, integrated whole -- SERVER (167.233.220.35) +
    SUPABASE (Postgres, 2 projects: verdian-ai/compliance-tracker, projexa) + VERCEL
    (2 deployments: veridian-compliance-ai, projexa) + GITHUB (7 repos, primary:
    claude-control, compliance-tracker, projexa) -- not any one of them in isolation.'
  source: TASK_LIFECYCLE_STATE_MACHINE_2026-07-26.yaml meta.system_definition;
    reinforced by STANDING_OPERATING_PROTOCOL_2026-07-26.yaml article A11_system_integration.

communication_channels:
  internal_machine_language:
    rule: 'Every AI<->software, AI<->AI, and software<->software interaction is
      structured CLI args / JSON / YAML / SQL only -- never English prose, never an
      open-ended statement. All discussion between software and AI is close-ended
      in machine language only. No exception.'
    source: TASK_LIFECYCLE_STATE_MACHINE_2026-07-26.yaml meta.language_rule;
      OWNER_ENGINE_MANDATORY_GATE_2026-07-25.txt points 4,5,10-17.
  owner_facing_english:
    rule: English is reserved exclusively for the Owner-facing channel -- simple,
      1-line sentences, roughly every 10 minutes or immediately at a real decision
      point or completion, with a recommendation option when multiple options exist.
      No continuous commentary, no token waste on discussion with the Owner.
    source: OWNER_ENGINE_MANDATORY_GATE_2026-07-25.txt points 6,7,18; reinforced by
      article A5_owner_communication below.

articles:
  - id: A1_execution_location
    rule: >-
      All real execution happens only through the direct session between
      VERIDIAN-DEV (167.233.220.35) and Claude Code CLI Sonnet 5.0 at HIGH effort.
      No laptop-local resources (CPU, disk, credentials, or the laptop's own shell)
      are used to perform real work -- the laptop is a thin client only, it relays
      instructions to the server and displays results.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A1; OWNER_ENGINE_MANDATORY_GATE_2026-07-25.txt
      points 1,14.

  - id: A2_traceability
    rule: Every real Owner chat instruction is assigned a real, unique Chat Post ID
      at the moment it is received (format CHATPOST-<UTC compact timestamp>-<short
      hash>), and every artifact produced in response to it (files, registry entries,
      task dispatches) carries that Chat Post ID in its own metadata so the full
      chain from Owner words to real system change is mechanically traceable.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A2.

  - id: A3_memory_and_register_first
    rule: Every real Owner directive is saved to system memory twice, independently
      -- (a) this assistant's own local memory system (for continuity across future
      chat sessions), and (b) the server's Knowledge Engine via SUPERBOSS IN SERVER
      (scripts/superboss-register.py register-knowledge), so the record survives
      independently of any one client or session. Verbatim Owner text and this
      assistant's own paraphrase/interpretation are never conflated in the same field
      -- paraphrase is clearly labeled as paraphrase. New directive files (when a real
      new one is genuinely needed instead of an edit to this file) are registered
      before being relied upon elsewhere -- register-first, not register-eventually.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A3; TASK_LIFECYCLE_STATE_MACHINE_2026-07-26.yaml
      state S3_MEMORY_SAVE.

  - id: A4_owner_engine_gate
    rule: Raw Owner chat is never analyzed directly. It is submitted through
      OWNER_ENGINE (scripts/prompt_gateway/gateway.py via task-gateway.py submit
      --source owner) first; this assistant works from OWNER_ENGINE's real
      machine-language output, querying the software further in machine language
      before ever asking the Owner a clarifying question.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A4; OWNER_ENGINE_MANDATORY_GATE_2026-07-25.txt
      points 2,3 (the original 19-point mandate this article implements).

  - id: A5_owner_communication
    rule: Communication with the Owner is simple, 1-line English, roughly every 10
      minutes (or immediately when a real decision point or completion occurs) -- no
      continuous commentary. This assistant holds standing Owner permissions;
      wherever multiple options exist, the recommended option is the accepted default
      without requiring the Owner to explicitly select it, unless the action is
      irreversible/high-stakes enough to warrant a real pause.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A5; OWNER_ENGINE_MANDATORY_GATE_2026-07-25.txt
      points 6,7; BROWSER_NATIVE_END_USER_ARCHITECTURE_2026-07-25.txt ("YOU ARE THE
      OWNER, YOU TAKE DECISIONS, THE RECOMMENDED OPTION IS DEFAULT AND ACCEPTED").

  - id: A6_completion_discipline
    rule: Every task and every phase of every task is driven to real, verified
      completion -- not self-reported completion. The next phase auto-starts by
      default the moment the current phase's real completion is confirmed (via a
      real merged PR or equivalent verifiable evidence, never a self-report alone).
      Work does not stop until all phases and all tasks of the current initiative are
      genuinely done.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A6; WIRING_ENGINE_SOFTWARE_2026-07-24.txt
      ("don't stop ... auto-start the next phase ... don't stop till 100% completion");
      BROWSER_NATIVE_END_USER_ARCHITECTURE_2026-07-25.txt ("COMPLETE ALL PHASES ONE
      AFTER ANOTHER ... complete this 100%. no stopping.").

  - id: A7_documentation_and_sync
    rule: Complete, real documentation accompanies every phase's real deliverable.
      Every file touched is fully updated (not partially). All documents, all files,
      and all systems -- Server, GitHub, Vercel, Supabase -- are kept synchronized
      with each other; no artifact is left describing a state the real system has
      since moved past.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A7.

  - id: A8_software_execution_only
    rule: All real work is performed by software -- software services, software
      programs, software automation, or a real dispatched worker task executing real
      code. This assistant does not act as a manual AI worker (hand-typing
      implementation content directly into production files in place of dispatching
      real software/automation to do it). This assistant's own direct role is
      orchestration, verification, and judgment calls software cannot make -- not
      manual implementation labor.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A8; BROWSER_NATIVE_END_USER_ARCHITECTURE_2026-07-25.txt
      ("NO WORK TO BE DONE BY AI AS A MANUAL WORKER. ALL WORK TO BE DONE USING
      SOFTWARE, SOFTWARE PROGRAMS, SOFTWARE SYSTEMS, SCRIPTS").

  - id: A9_workflow_sequence
    rule: Every initiative follows this real sequence, in order, for every phase --
      (1) complete analysis of the real current state, (2) complete gap
      identification against that real state, (3) a complete, real, stepwise
      implementation plan, (4) real implementation of every phase in that plan, (5) a
      complete, real audit plan executed after implementation, (6) a complete plan
      for whatever real gaps that post-implementation audit finds, and (7) real
      implementation of the fixes for those audit-found gaps. No phase is considered
      done while any of these seven steps for it remains incomplete. The full
      per-task state machine implementing this sequence in real, dispatchable steps
      is in task_lifecycle_state_machine below.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A9; BROWSER_NATIVE_END_USER_ARCHITECTURE_2026-07-25.txt
      ("AFTER ONE PHASE IS OVER AUDIT IT, ANALYZE IT THAN IMPLEMENT IT THAN MOVE TO
      NEXT PHASE AUTOMATICALLY").

  - id: A10_quality_bars
    rule: Every real deliverable meets four bars before being considered done -- zero
      gaps (nothing the spec requires is missing), zero duplication (nothing is
      rebuilt that already exists), zero collision (nothing overwrites or conflicts
      with existing real work), and 100% real implementation (no partial/stubbed/
      simulated substitute for the real thing). No lying, no shortcuts, and no
      claiming incomplete work as complete.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A10; BROWSER_NATIVE_END_USER_ARCHITECTURE_2026-07-25.txt
      ("ENSURE ZERO GAPS. ENSURE ZERO DUPLICATION. ENSURE 100% IMPLEMENTATION");
      CHATGPT_AUDIT_AND_PROMPT_LIBRARY_WORKSPACE_2026-07-24.txt trailer ("no lying or
      claiming incomplete work as complete; no shortcuts").

  - id: A11_system_integration
    rule: Every real phase's work is wired completely into the whole SYSTEM (see
      system_definition), verified to be fully integrated, and confirmed to operate
      as one single integrated system rather than disconnected parts that happen to
      share a name.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A11.

  - id: A12_active_monitoring
    rule: Real software is used to monitor every task and phase's start, progress,
      completion, and issues -- not this assistant's own memory of what it
      dispatched. This assistant checks that real monitoring software on a real,
      regular cadence for as long as any task or phase is outstanding, to confirm
      phases are actually completing without silent failure, rather than assuming
      completion and moving on.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml A12.

  - id: A13_resource_and_token_discipline
    rule: Maximum real work is done via software and scripts; AI/model tokens are
      minimized and never wasted on continuous commentary, open-ended discussion, or
      re-deriving facts a real tool can just confirm. Up to 95% of real server
      resources may be used for genuine work. A real issue found along the way is
      fixed directly (without stopping to ask) using server resources only, through
      the same task-gateway.py dispatch pipeline as any other real work -- not a
      manual workaround.
    source: OWNER_ENGINE_MANDATORY_GATE_2026-07-25.txt points 8,9,19;
      WIRING_ENGINE_SOFTWARE_2026-07-24.txt trailer ("maximum work via software/scripts
      and minimum AI tokens"); CHATGPT_AUDIT_AND_PROMPT_LIBRARY_WORKSPACE_2026-07-24.txt
      trailer ("use up to 95pct server resources; fix any issue found without asking,
      using server resources only, through this same task-gateway.py pipeline").

  - id: A14_self_correction_enforcement
    rule: Three standing self-correction rules run on tools that already exist in
      this system (never trust a success signal without an independent real check;
      never repeat a memory claim without re-verifying it against the real system;
      never trust a fix without confirming it is actually wired into the live path).
      Full rule text, triggers, and the dated incidents that produced each rule are
      the subject of the companion memory file, not duplicated here -- this article
      is the pointer, MEMORY_OWNER_AI.yaml is the source of truth for the rules and
      incidents themselves.
    source: STANDING_OPERATING_PROTOCOL_2026-07-26.yaml self_correction_enforcement_2026-07-26
      (moved in full to MEMORY_OWNER_AI.yaml as part of this consolidation, since it is
      lessons/incidents content, not a standing execution rule).
    see_also: MEMORY_OWNER_AI.yaml self_correction_rules, MEMORY_OWNER_AI.yaml incidents

  - id: A15_interactive_session_write_gate
    rule: >-
      Article A8_software_execution_only ("AI agents work only through
      software, software follows process") is now backed by a real,
      technical guard on VERIDIAN-DEV (167.233.220.35), not just written
      text an interactive session can choose not to follow. rajat's shell
      profile (~/.profile, ~/.bashrc, both sourcing the deployed
      ~/.claude-interactive-session-guard.bashrc-snippet) installs real
      wrapper SCRIPTS named `gh` and `git` into a directory prepended to
      PATH ahead of the real binaries. Those scripts intercept a PR merge
      (`gh pr merge`, or the equivalent raw `gh api -X PUT|PATCH .../pulls/
      <n>/merge` call) and `git push` to a protected branch (including
      `push --all`/`--mirror`, which reach every ref -- protected branches
      included -- regardless of which branch is currently checked out),
      regardless of how many real global flags (`git -C`, `git --git-dir`,
      `gh --repo`/`-R`, etc.) precede the subcommand on the command line.
      The command is blocked with a non-zero exit and a clear "BLOCKED: ...
      must run through the dispatch pipeline" message unless ALL THREE of
      the following signals show this is a real dispatched worker/
      supervisor context: (1) the real systemd-set INVOCATION_ID
      environment variable is present; (2) this process's real,
      kernel-tracked cgroup membership (read from /proc/self/cgroup)
      actually names a veridian-worker@*/veridian-supervisor@* systemd
      unit; (3) the task_id parsed out of that unit name corresponds to a
      REAL, currently in_progress task
      (/opt/veridian/ai-os/tasks/<task_id>/task.yaml exists with
      `status: in_progress`). Every other gh/git subcommand (view, checks,
      pr list, pr comment, pr diff, run rerun, status, log, diff, push to
      a non-protected branch, `gh api` calls that aren't a merge, etc.)
      passes through to the real binary unchanged -- verification and
      status-checking work is never blocked.
    real_incident: >-
      2026-07-26: an interactive session ran `gh pr merge 78 --repo
      FChecklist/claude-control --merge --delete-branch` and a direct `git
      push` (an empty retrigger commit) to compliance-tracker's `main`
      branch by hand, after the automated pipeline's own merge/CI-trigger
      step failed -- instead of diagnosing and fixing the pipeline's real
      bug. This article and its guard are the real, technical fix for that
      gap.
    round_2_hardening: >-
      A real audit of the round-1 guard (plain `gh`/`git` bash functions
      gated on a bare INVOCATION_ID env-var read) found two real, non-obscure
      bypasses: (a) `export INVOCATION_ID=anything` alone satisfied the
      whole check, since a plain env var has no cryptographic or kernel
      binding to a genuine systemd unit; (b) `command git push origin
      master` / `command gh pr merge ...` skipped the shell functions
      entirely, since bash's `command` builtin is explicitly designed to
      ignore functions and aliases. Two more real gaps were found in scope:
      (c) only `gh pr merge` was intercepted, not the equivalent raw
      `gh api PUT|PATCH .../pulls/<n>/merge` call; (d) only an explicit push
      to a named protected branch was checked, not `git push --all`/
      `--mirror`, which reach protected branches regardless of the current
      branch. All four are closed in the implementation below and each has
      a dedicated, passing regression-test scenario (not just a prose
      assertion) -- see tests/interactive_session_guard_test.sh's
      "BYPASS VECTOR 1-4" scenarios.
    round_3_hardening: >-
      A round-3 audit, verified by direct live reproduction rather than
      review alone, found round 2's "kernel-verified cgroup" claim did not
      actually hold, plus two real git-push refspec parsing gaps: (a) the
      round-2 cgroup check did not read /proc/self/cgroup directly -- it
      read a path stored in a plain, user-writable config file
      ($guard_dir/_cgroup_path) that the installer itself wrote into its own
      install directory, so any interactive session could overwrite that
      file to point at a fake, attacker-authored cgroup and satisfy the
      check with zero kernel involvement; reproduced live with a 3-line
      shell sequence (`export INVOCATION_ID=x; echo /tmp/fake >
      ~/.claude-interactive-session-guard.d/_cgroup_path; echo
      '0::/system.slice/veridian-worker@x.service' > /tmp/fake`), no root
      needed. (b) `git push origin +master` (the standard force-push
      refspec shorthand) was not recognized as targeting `master`, because
      the destination-ref parser stripped `refs/heads/` but never stripped
      the leading `+` force-push marker, so it compared the literal string
      "+master" against the protected-branch pattern and let the push
      through; reproduced live. (c) `git push origin feature-branch master`
      (a real, valid multi-refspec single push) only had its first refspec
      (`feature-branch`) checked -- `master`, the second refspec in the same
      invocation, was never evaluated and the whole push went through
      unblocked; reproduced live. All three are closed: (a) the cgroup path
      is now hardcoded to /proc/self/cgroup unconditionally, with NO
      override of any kind -- no config file, no environment variable,
      nothing external the production code path reads. (An early round-3
      draft replaced the config file with an
      INTERACTIVE_GUARD_TEST_CGROUP_FILE environment-variable override
      instead, which is the identical bug class in different clothing -- a
      runtime signal an ordinary interactive shell can set that the
      production check trusts -- and was caught and removed before landing;
      it does not exist in the shipped guard.) (b) a leading `+` is now
      stripped from each refspec before comparison; (c) every positional
      refspec argument is now checked, not just the first, and the push is
      blocked if ANY of them resolves to a protected branch. Each has a
      dedicated, passing regression-test scenario -- see
      tests/interactive_session_guard_test.sh's "ROUND 3" scenarios.
    round_4_hardening: >-
      A round-4 audit, again verified by live reproduction, found one real
      bypass and investigated one structural concern about the cgroup-check
      premise itself. (a) both wrapper scripts detected the guarded
      subcommand by checking ONLY argv[1] literally (`[ "$1" = "push" ]`
      for git; `$1=pr $2=merge` or `$1=api` for gh) -- any invocation with
      a real, ordinary global flag before the subcommand walked straight
      past detection undetected; reproduced live with
      `git -C /tmp push origin master`,
      `git --git-dir=/tmp/.git push origin master`, and
      `gh --repo some/repo pr merge 1 --merge`, none of which are
      adversarial tricks -- `-C`, `--git-dir`, and `--repo`/`-R` are real,
      commonly-used flags confirmed against `man git` and
      `gh <cmd> --help`'s INHERITED FLAGS. Closed by replacing the
      argv[1]-only check with functions that scan the FULL argument list
      and skip every real global flag documented for the installed git
      2.43 / gh 2.45 (both `--flag value` and `--flag=value` forms, plus
      git's space-only `-C`/`-c` and gh's attached `-Rvalue` short form)
      before looking for the actual subcommand token. (b) a live test of
      whether an ordinary interactive process can run `systemd-run --user
      --unit=veridian-worker@<fake>.service --scope <command>` to obtain a
      genuinely kernel-tracked cgroup + INVOCATION_ID that would satisfy
      the round-3 cgroup check found that this SPECIFIC attempt is
      currently rejected by systemd on VERIDIAN-DEV ("was already loaded or
      has a fragment file"), because the real veridian-worker@.service /
      veridian-supervisor@.service template unit files are installed in
      ~/.config/systemd/user/ and systemd refuses to create a transient
      unit whose name collides with an existing one (confirmed this is a
      name-collision effect, not systemd-run being broken here, by
      succeeding with an unrelated `--unit=` name). This is real evidence,
      but it is a side effect of what happens to be installed on this
      machine, not a fundamental property of cgroups/systemd-run -- the
      same-account limitation already means an interactive session could
      plausibly delete/rename its own copy of those unit files and remove
      this collision protection, so it is NOT relied upon as the fix. The
      actual fix is a third, independent signal added regardless: the
      task_id parsed from a matching cgroup unit name must correspond to a
      REAL, currently in_progress task
      (/opt/veridian/ai-os/tasks/<task_id>/task.yaml exists with
      `status: in_progress`) -- a `systemd-run`-forged instance name has no
      such entry, closing the gap regardless of how a matching-but-fake
      cgroup name might be produced. (a) has dedicated, passing
      regression-test scenarios; the task cross-reference mitigation for
      (b) has a dedicated regression scenario simulating a forged-but-
      pattern-matching cgroup with no corresponding real task (the live
      systemd-run collision itself is not re-run in the automated suite,
      since it mutates real systemd unit state) -- see
      tests/interactive_session_guard_test.sh's "ROUND 4" scenarios.
    implementation:
      deployed_at: "/home/rajat/.claude-interactive-session-guard.bashrc-snippet
        on VERIDIAN-DEV, sourced from both ~/.bashrc (interactive non-login
        shells) and ~/.profile (login shells, interactive or not -- added
        because ~/.bashrc's own top-of-file interactive-only check skips
        login-but-non-interactive shells such as `bash -lc '...'`). Every
        time it is sourced it rewrites the wrapper scripts it installs into
        ~/.claude-interactive-session-guard.d/ and prepends that directory
        to PATH (idempotent -- checked before prepending, and `hash -r` is
        run afterward so bash's command-location cache can't serve a stale,
        pre-guard path). As of round 3 there is no cgroup-path config file
        written into that directory at all -- the cgroup check reads
        /proc/self/cgroup directly, hardcoded."
      committed_copy: ai-os/OWNER_DIRECTIVES/interactive-session-guard.bashrc-snippet
        (this exact repo, for auditability -- kept byte-identical to the
        deployed copy).
      mechanism_summary: >-
        (1) Real, kernel-verified context check, THREE signals all
        required: INVOCATION_ID present AND /proc/self/cgroup -- read
        directly, hardcoded, no file-based indirection -- names a
        veridian-worker@*/veridian-supervisor@* unit AND [round 4] the
        task_id parsed from that unit name has a real, in_progress
        /opt/veridian/ai-os/tasks/<task_id>/task.yaml; none alone is
        trusted. (2) PATH-based wrapper scripts, not shell functions --
        placed in a directory prepended to PATH, so `command git`/
        `command gh` (which bypass functions/aliases but not PATH search)
        still resolve to the guard. (3) gh-merge detection extended to
        `gh api -X PUT|PATCH .../pulls/<n>/merge` in addition to
        `gh pr merge`. (4) git-push detection extended to `push
        --all`/`--mirror` in addition to an explicit push naming a protected
        branch. (5) [round 3] every positional refspec argument of a `git
        push` is checked (not just the first), and a leading `+` force-push
        marker is stripped from each before comparison against the
        protected-branch pattern. (6) [round 4] subcommand detection scans
        the FULL argv for both git and gh, skipping every real global flag
        for the installed git/gh version, so a global flag before the
        subcommand (`git -C`, `git --git-dir`, `gh --repo`/`-R`) can no
        longer walk past detection.
      test: tests/interactive_session_guard_test.sh (sources the real
        committed snippet against faked gh/git binaries; scenarios covering
        block/pass-through for gh pr merge, gh api merge calls, git push to
        master/main vs. a feature branch, git push --all/--mirror,
        `command`-prefixed invocations of both, the
        spoofed-INVOCATION_ID-alone case, the round-3 config-file cgroup
        bypass (now closed), `git push origin +master`, multi-refspec
        `git push origin feature-branch master`, [round 4] global-flag-
        prefixed invocations (`git -C`, `git --git-dir=`, `gh --repo`/`-R`
        in space/`=`/attached forms), and [round 4] a forged-but-pattern-
        matching cgroup naming a task_id with no corresponding real,
        in_progress task -- in both interactive and systemd-simulated
        contexts). Also runnable via
        `python3 -m pytest tests/ -k write_gate -v`
        (tests/write_gate_test.py wraps this shell suite as a subprocess).
      known_limitations: >-
        (1) Same-account limitation (unchanged from round 1): this guard
        cannot distinguish the Owner's own interactive SSH session from an
        AI session typing by hand -- both share the same rajat account and
        the same shell profile, so both get blocked identically. It is
        scoped to the AI session's own discipline, not a security boundary
        against the Owner. (2) Residual PATH-search bypass (disclosed since
        round 2): the wrapper-script mechanism only intercepts commands that
        go through a normal PATH search. An absolute-path invocation of the
        real binary (e.g. `/usr/bin/git push origin master`, `/usr/bin/gh pr
        merge ...`) or `command -p git`/`command -p gh` (bash's `-p` flag
        explicitly searches a fixed default system PATH, not the shell's
        guard-prepended $PATH) still reaches the real binary directly. Both
        require the caller to already know or go find the real absolute path
        rather than just typing the ordinary command -- a real but modest
        deterrent, not a hard technical stop. Fully closing this would mean
        replacing the real system binaries or adding an OS-level exec hook,
        which is out of scope for a per-user shell-profile guard; left for a
        future round if the Owner decides the operational cost is worth it.
        (3) Cgroup check has zero runtime override (round 3, corrected): the
        cgroup check reads /proc/self/cgroup directly and unconditionally in
        every code path -- no config file, no environment variable, nothing
        external the production code path reads to redirect this check.
        _interactive_guard_cgroup_path() in _lib.sh takes no input and
        always returns the literal string "/proc/self/cgroup". This closes
        both the round-2 bug (a plain file, $guard_dir/_cgroup_path, sitting
        in the guard's own install directory, always present and writable
        with no special knowledge required) and an early round-3 draft's
        attempt to "fix" it with an INTERACTIVE_GUARD_TEST_CGROUP_FILE
        environment-variable override -- the same bug class in different
        clothing, caught and removed before landing. Neither exists in the
        shipped guard. tests/interactive_session_guard_test.sh proves this
        two ways against the real, unmodified, shipped snippet: writing a
        fake matching-worker cgroup into the old $guard_dir/_cgroup_path
        file has zero effect, and setting INTERACTIVE_GUARD_TEST_CGROUP_FILE
        also has zero effect. The one residual, explicitly narrow test-only
        seam is that the test suite, to simulate a genuinely matching worker
        cgroup for its own positive-path scenarios (impossible to produce
        for real without root/namespace privileges), sources a throwaway
        disk-scratch COPY of this file's source text with the hardcoded
        /proc/self/cgroup line replaced by a fixture path -- i.e. it edits a
        copy of the guard's own source, never the deployed/committed file,
        and the production code path itself never reads any file or
        environment variable to make this decision. A real interactive
        shell can never reach this seam because it only ever sources the
        genuine, unmodified, committed snippet. (4) [round 4, new] Detection
        is a finite, version-tied global-flag allowlist:
        _interactive_guard_git_find_subcommand()/
        _interactive_guard_gh_strip_globals() in _lib.sh recognize the real
        global-flag sets of the git 2.43 / gh 2.45 confirmed live on
        VERIDIAN-DEV. A future git/gh upgrade adding a new global flag not
        in these lists would leave the *detection* unable to see past it --
        but the wrapper always execs the untouched original argv either
        way, and the real binary itself rejects flags it doesn't recognize,
        so this degrades to "no worse than before round 4", not a new
        silent bypass; there is no automatic staleness detection for this
        today. (5) [round 4, new] Task cross-reference has zero runtime
        override, same pattern as the cgroup check:
        _interactive_guard_tasks_dir() is hardcoded to
        "/opt/veridian/ai-os/tasks" with no config file or environment
        variable, for the identical reason the cgroup path has none --
        letting an interactive shell redirect this check would let it point
        at a directory of its own choosing with a forged task.yaml. (6)
        [round 4, new, honestly disclosed] The systemd-run impersonation
        question is NOT claimed fully closed: live testing found
        `systemd-run --user --unit=veridian-worker@<fake>.service` is
        currently rejected by systemd on VERIDIAN-DEV because it collides
        with the real installed template unit files -- but this is
        deployment-specific (what happens to be installed on this machine),
        not a fundamental property of cgroups/systemd-run, and the
        same-account limitation above means an interactive session could
        plausibly remove that collision protection by deleting/renaming its
        own copy of those unit files. What actually closes the gap
        (regardless of how a matching-but-fake cgroup name might be
        produced) is signal 3, the live task cross-reference -- a
        `systemd-run`-forged instance name has no corresponding real,
        in_progress task directory.
    source: This task's own real deliverable (server-side ~/.bashrc /
      ~/.profile-sourced snippet change + committed snippet + test),
      directly implementing A8_software_execution_only's standing rule with
      real enforcement, hardened in round 2 against four real bypasses, in
      round 3 against three more (a false "kernel-verified" cgroup claim and
      two git-push refspec parsing gaps), and in round 4 against an
      argv-position detection bypass plus a task-registry cross-reference
      added to reduce reliance on the cgroup-name-pattern check alone -- all
      found and verified by fresh, live-reproduced audits.
    see_also: ai-os/OWNER_DIRECTIVES/interactive-session-guard.bashrc-snippet,
      tests/interactive_session_guard_test.sh, tests/write_gate_test.py

  - id: A16_hold_for_owner_signoff
    rule: >-
      A dispatch prompt that must never be auto-merged declares this with a
      real, machine-readable marker line -- `HOLD_FOR_OWNER_SIGNOFF: true` --
      inside its EXPECTED_OUTPUT or CONSTRAINTS section, never with prose
      alone. scripts/tight_task_validation.py's extract_hold_for_owner_signoff()
      extracts this marker at dispatch time; scripts/task-gateway.py's
      cmd_start() threads it through to scripts/veridian-task.py's cmd_create()
      (--hold-for-owner-signoff), which writes hold_for_owner_signoff: true
      into the task's task.yaml. scripts/supervisor-entrypoint.sh's
      merge-decision block reads this field FIRST -- before risk-tier.py's
      tier classification or the Superboss's AI review verdict are even
      considered -- and if true, unconditionally skips auto-merge, posts a
      PR comment stating the task is held for Owner sign-off, checkpoints
      the task as awaiting_human_approval, and notifies the Owner. This
      makes "hold for sign-off" a real, enforced software behavior, not
      inert prose an AI agent or reviewer could silently fail to honor.
    real_incident: >-
      2026-07-26: PR563's corrective task was dispatched with an explicit
      prompt-level instruction ("must be held for Owner sign-off, do not
      merge under any circumstance"), but that natural-language constraint
      had zero effect on the actual merge decision -- nothing in
      supervisor-entrypoint.sh's pipeline ever read prompt-level prose, only
      risk-tier.py's deterministic tier plus the AI reviewer's verdict. The
      task auto-merged anyway (as a separate, near-empty PR); a human had to
      notice and manually hold it after the fact. This article and its
      HOLD_FOR_OWNER_SIGNOFF mechanism are the real, technical fix for that
      gap, closed in the same session (task-20260726-091933, building on an
      earlier attempt at the same fix, task-20260726-083946).
    source: This consolidation task's own real-incident fix -- not carried
      forward from any prior standing-directive file, since the gap it
      closes was only discovered and fixed in this same 2026-07-26 session.

  - id: A16_ddl_authorization_gate
    rule: >-
      Supabase schema changes (and any other live DDL) are tier2-by-definition --
      always held for human sign-off, never auto-merged. That rule is enforced at TWO
      points, not one: at PR-merge time (S9_AUDITED/S10b_HELD_FOR_SIGNOFF below), and
      -- as of this article -- at dispatch time, before a worker task is ever created.
      Real incident, 2026-07-26: task-20260726-071400-migration-drift-audit-and-reconciliation's
      own dispatch prompt's SCOPE section told the worker to call Supabase MCP's
      apply_migration tool directly against the production project (pcrjmlpuqsbocqfwoxod),
      and the worker executed live DROP TABLE/CREATE TABLE/ALTER TABLE/CREATE INDEX
      statements entirely before any PR/CI/human review happened. The worker did exactly
      what its prompt authorized -- the real gap was that nothing in the dispatch
      pipeline checked what a dispatch prompt itself is allowed to authorize. Fixed by
      scripts/ddl_authorization_check.py, chained into scripts/task-gateway.py's
      cmd_start() immediately after tight_task_validation.py (same run()/json.loads()/
      fail() rejection pattern): any prompt-file referencing a DDL-capable Supabase MCP
      tool (apply_migration, execute_sql, merge_branch), or a DDL keyword -- widened
      2026-07-26 past the original six to also cover CREATE UNIQUE INDEX, DROP INDEX,
      CREATE/DROP POLICY, CREATE/DROP TRIGGER, ADD/DROP COLUMN, ADD CONSTRAINT,
      CREATE/DROP TYPE, CREATE SCHEMA, CREATE EXTENSION, CREATE SEQUENCE, all
      case-insensitive and scanned across multi-line/multi-statement SQL blocks -- is
      dispatch-blocked unless the prompt-file also contains a line literally matching
      `PRE-APPROVED-LIVE-DDL: <real citation>`. As of the same 2026-07-26 tightening
      the citation itself must match a real reference pattern (a KE-<date>-<time>-<hex>
      decision-log ID, an OWNER_DECISIONS_NEEDED_<date>.yaml#<id> reference, or a dated
      free-text note of meaningful length), not just be any non-empty, non-placeholder
      string -- a bare `PRE-APPROVED-LIVE-DDL: yes` no longer passes. Plain SELECT-only
      SQL never triggers this gate.
      Known limitation (accepted, not solved): this is a DISPATCH-TIME scan of the
      prompt-file's text, not a RUNTIME interceptor of the actual MCP tool call. A
      worker whose prompt says nothing about DDL but which decides mid-task to call
      apply_migration/execute_sql/merge_branch anyway is NOT caught by this gate --
      this session's agent framework has no mechanism to intercept a live MCP tool call
      while a worker is running, only to vet the prompt before dispatch. See
      scripts/ddl_authorization_check.py's own docstring for the full statement of this
      limitation; closing it would need a runtime tool-call interceptor, a materially
      larger piece of infrastructure than a prompt-text scan, and is not built here.
    source: Real incident task-20260726-071400-migration-drift-audit-and-reconciliation
      (2026-07-26); closed by task-20260726-082342-add-ddl-pre-flight-authorization-gate-to.

task_lifecycle_state_machine:
  note: Real closed finite-state machine implementing A9_workflow_sequence as
    actual dispatchable steps, folded here verbatim from
    TASK_LIFECYCLE_STATE_MACHINE_2026-07-26.yaml (deleted as a standalone file in this
    consolidation -- no other real file cites it by exact path, so nothing else needs
    to keep pointing at the old filename; see source_inventory).
  integration_note_2026-07-26: >-
    task-20260726-092433 closed the one remaining manual hand-off in this
    machine: S0_RAW_RECEIVED through S5_DISPATCH previously required this
    assistant to manually read OWNER_ENGINE's classified output (S1_GATED)
    and hand-construct the S4_SPEC/S5_DISPATCH task-gateway.py calls itself.
    OWNER_ENGINE (gateway.py --mode owner-dispatch) now performs that
    classification-to-dispatch step as one real software call for the
    task-dispatch/status-query/completion-query cases (see S1_GATED's
    branch_C and S1b_AUTO_DISPATCHED below) -- this assistant's own
    S4_SPEC/S5_DISPATCH steps remain the real path only for a message that
    is not yet a complete, tightened task spec. Also fixed in the same
    task: task-gateway.py's cmd_start now calls credit-accountant.py
    propose immediately after veridian-task.py create succeeds (previously
    never called at all, so WORKER_ENTRYPOINT's own later `report
    --increment 1` always failed with "no matching approved plan").
  engines:
    - id: TASK_GATEWAY
      path: /opt/veridian/scripts/task-gateway.py
      commands: [submit, start, log, close, status]
    - id: OWNER_ENGINE
      path: /opt/veridian/scripts/prompt_gateway/gateway.py
      commands: ["--mode stdin --json-only", "--mode owner-dispatch"]
      commands_note: >-
        task-20260726-092433 added --mode owner-dispatch: the single, real
        software entrypoint that classifies a raw Owner message AND, when
        that classification is a task-dispatch/status-query/completion-
        query request, calls TASK_GATEWAY's submit/start/status directly
        (gateway.py's route_and_dispatch()/dispatch_to_task_lifecycle()) --
        no AI turn or human reads OWNER_ENGINE's classified output and
        hand-constructs the task-gateway.py command in between. --mode
        stdin (still used BY TASK_GATEWAY's own run_owner_engine_gate(),
        see below) never calls into TASK_GATEWAY -- only --mode
        owner-dispatch does, so the two integration points cannot recurse.
      sub_engines:
        - /opt/veridian/scripts/prompt_gateway/engine/id_generator.py
        - /opt/veridian/scripts/prompt_gateway/engine/classifier.py
        - /opt/veridian/scripts/prompt_gateway/engine/prompt_engine.py
        - /opt/veridian/scripts/prompt_gateway/engine/context_engine.py
        - /opt/veridian/scripts/prompt_gateway/engine/snip_engine.py
        - /opt/veridian/scripts/prompt_gateway/engine/document_engine.py
        - /opt/veridian/scripts/prompt_gateway/query.py
    - id: TIGHT_TASK_VALIDATOR
      path: /opt/veridian/scripts/tight_task_validation.py
    - id: DDL_AUTHORIZATION_CHECK
      path: /opt/veridian/scripts/ddl_authorization_check.py
      note: "Runs immediately after TIGHT_TASK_VALIDATOR, before VERIDIAN_TASK_CLI create --
        see A16_ddl_authorization_gate above."
    - id: VERIDIAN_TASK_CLI
      path: /opt/veridian/scripts/veridian-task.py
      commands: [create, checkpoint, status]
    - id: WORKER_ENTRYPOINT
      path: /opt/veridian/scripts/worker-entrypoint.sh
      unit: veridian-worker@<task_id>.service
    - id: SUPERVISOR_ENGINE
      path: /opt/veridian/scripts/supervisor-entrypoint.sh
      unit: veridian-supervisor@<task_id>.service
      sub_engines:
        - /opt/veridian/scripts/risk-tier.py
        - /opt/veridian/scripts/backfill_phase_self_report.py
    - id: SUPERVISOR_SWEEP
      path: /opt/veridian/scripts/supervisor-sweep.sh
      cron: "*/15 * * * *"
    - id: AUTO_PHASE_CONTINUATION_ENGINE
      path: /opt/veridian/scripts/auto_phase_continuation.py
      cron: "*/30 * * * *"
    - id: KNOWLEDGE_ENGINE
      path: /opt/veridian/scripts/superboss-register.py
      commands: [register-knowledge, query-knowledge, list-capabilities, lookup-capability]
      store: /opt/veridian/ai-os/memory/superboss-register.sqlite
    - id: WIRING_ENGINE
      path: /opt/veridian/scripts/generate_wiring_registry.py
      output: /opt/veridian/ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json
      cron: "0 */6 * * *"
    - id: AUDITOR_ENGINE
      path: ai-os/AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml (real audit-run scripts it dispatched)
    - id: TESTING_ENGINE
      path: ai-os/TESTING_ENGINE_PHASE_PLAN_2026-07-24.yaml (route-test-autogeneration, distributed-trace, replay)
    - id: TERMINOLOGY_GUARDRAIL_ENGINE
      path: ai-os/TERMINOLOGY_GUARDRAIL_2026-07-24.py
    - id: CAPABILITY_REGISTRY_ENGINE
      table: capability_registry (in superboss-register.sqlite)
    - id: POLICY_RULE_DECISION_ENGINE
      path: 20_ENGINES_10_GATEWAYS_PHASE_PLAN phase_2 real deliverable
    - id: GATEWAY_G05_AI
      role: "sole real boundary all AI/model calls route through (provider/model resolution, policy, audit)"
    - id: GATEWAY_G09_OBSERVABILITY_AUDIT
      role: "real boundary/loop surfacing observability + audit events"
  states:
    - id: S0_RAW_RECEIVED
      trigger: Owner sends a message in chat
      action: "python3 scripts/prompt_gateway/gateway.py --mode owner-dispatch (preferred,
        task-20260726-092433: single real entrypoint -- classifies AND, for a
        task-dispatch/status-query/completion-query message, calls TASK_GATEWAY directly,
        see S1_GATED branch_C) ; OR python3 scripts/task-gateway.py submit --text \"<raw>\"
        --source owner --session-id <id> (still the real path for a message that is not yet
        a complete, tightened task spec -- see S1_GATED branch_B / S4_SPEC)"
      engine: OWNER_ENGINE (owner-dispatch calls TASK_GATEWAY itself) OR TASK_GATEWAY -> OWNER_ENGINE
        (internal gate via run_owner_engine_gate) -- either order, no English step between
      writes: [sqlite instructions.raw_text (gated machine output only), sqlite instructions.metadata_json (raw text, audit only)]
      next: S1_GATED
    - id: S1_GATED
      condition: "owner_engine_gate.applied == true"
      branch_A: "owner_engine_gate == null OR needs_owner_clarification == true -> S1a_CLARIFY"
      branch_B: "classification is not a recognized task-lifecycle request (or is a task idea
        that is not yet a complete spec) -> S2_DUP_CHECK"
      branch_C: "S0 used --mode owner-dispatch AND gateway.py's own
        determine_lifecycle_route() returned action submit/start/status -> S1b_AUTO_DISPATCHED
        (TASK_GATEWAY has already been called for real -- do not also manually construct
        the same call)"
    - id: S1a_CLARIFY
      action: "python3 scripts/prompt_gateway/query.py --chat-id <id> --q NEEDS_OWNER_CLARIFICATION"
      on_INSUFFICIENT_INFO: OWNER_REPORT (1-line English question, the ONLY permitted English
        output in this entire state machine besides OWNER_REPORT itself)
      next: S0_RAW_RECEIVED (re-submit after Owner answers)
    - id: S1b_AUTO_DISPATCHED
      note: >-
        task-20260726-092433. gateway.py's --mode owner-dispatch already ran
        the real task-gateway.py submit/start/status call described by S2-S5
        below in a single software step (dispatch_to_task_lifecycle()); this
        state is where that already-real result is read, not re-executed.
      action: "read the lifecycle_dispatch key of gateway.py's own JSON output --
        {action: submit, result: <task-gateway.py submit's real JSON>} or
        {action: start, submit_result, result: <task-gateway.py start's real JSON>} or
        {action: status, result: <task-gateway.py status's real JSON>}"
      branch_A: "action == status -> report the real status to the Owner (see
        process_2_status_asked) ; TERMINAL_CLOSED for this message"
      branch_B: "action == submit -> S2_DUP_CHECK (submit's own dedup/search/capability
        results are already in result -- do not re-run S2's lookups, just read them)"
      branch_C: "action == start -> S6_IN_PROGRESS (task_id is in result.parsed.task_id;
        S5_DISPATCH's own two-call sequence already ran for real)"
    - id: S2_DUP_CHECK
      action: "grep/query ai-os/MASTER_INDEX.yaml + python3 scripts/superboss-register.py
        list-capabilities + ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json"
      engine: KNOWLEDGE_ENGINE, WIRING_ENGINE
      branch_A: "real match found -> S2a_CITE_EXISTING (no new task, cite existing artifact to Owner)"
      branch_B: "no match -> S3_MEMORY_SAVE"
    - id: S3_MEMORY_SAVE
      action: "write real content into ai-os/OWNER_DIRECTIVES/PROTOCOL_OWNER_AI.yaml or
        MEMORY_OWNER_AI.yaml (the two canonical files -- a brand-new dated file is no longer
        created here as of this consolidation) ; python3 scripts/superboss-register.py
        register-knowledge --path <path> --tags <chat_post_id>,<topic>"
      engine: KNOWLEDGE_ENGINE
      parallel: "local memory file (this assistant's own persistent store) written in the same step"
      next: S4_SPEC
    - id: S4_SPEC
      action: "write watertight prompt.txt (OBJECTIVE/SCOPE/KNOWN_CONTEXT/SUCCESS_CRITERIA/
        EXPECTED_OUTPUT/CONSTRAINTS/COMPLEXITY_TIER) -- every SUCCESS_CRITERIA line a real
        runnable shell command"
      engine: "TIGHT_TASK_VALIDATOR, DDL_AUTHORIZATION_CHECK (both validate before dispatch is
        allowed -- DDL_AUTHORIZATION_CHECK blocks any prompt authorizing live DDL/apply_migration
        with no PRE-APPROVED-LIVE-DDL: citation)"
      branch_A: "rejected -> fix wording (or add a real Owner citation) -> retry S4_SPEC"
      branch_B: "accepted -> S5_DISPATCH"
    - id: S5_DISPATCH
      action: "python3 scripts/task-gateway.py submit --text \"$(cat prompt.txt)\" --source owner
        --session-id <id> ; python3 scripts/task-gateway.py start --instruction-id <ins_id>
        --title <title> --repo <target_repo> --prompt-file prompt.txt"
      engine: TASK_GATEWAY
      writes: [/opt/veridian/ai-os/tasks/<task_id>/task.yaml (status: in_progress)]
      starts: "systemctl --user start veridian-worker@<task_id>.service"
      engine_started: WORKER_ENTRYPOINT
      next: S6_IN_PROGRESS
    - id: S6_IN_PROGRESS
      action: "worker executes real code changes against SYSTEM (real files in claude-control/
        compliance-tracker/projexa checkouts)"
      checkpoint: "python3 scripts/veridian-task.py checkpoint <task_id> --status <status> --note <machine-note>
        every 5 min (automatic, worker-entrypoint.sh's own loop)"
      next: S7_PUSHED
    - id: S7_PUSHED
      action: "git commit + git push (real branch worker/<task_id>) ; gh pr create --repo <target_repo>"
      system_touch: GITHUB (branch + PR created)
      next: S8_PENDING_REVIEW
    - id: S8_PENDING_REVIEW
      action: "systemctl --user start veridian-supervisor@<task_id>.service (or picked up by
        SUPERVISOR_SWEEP within 15 min if the direct trigger was missed)"
      engine: SUPERVISOR_ENGINE
      sub_action: "risk-tier.py classifies tier1/tier2 ; Claude-driven real diff review ; posts
        structured 'AUDIT: PASS/FAIL' PR comment (8 fields, machine-parseable)"
      next: S9_AUDITED
    - id: S9_AUDITED
      branch_A: "AUDIT: FAIL -> S9a_CORRECTIVE"
      branch_B: "AUDIT: PASS, tier1 -> S10_AUTO_MERGE"
      branch_C: "AUDIT: PASS, tier2 -> S10b_HELD_FOR_SIGNOFF"
    - id: S9a_CORRECTIVE
      action: "gh api repos/<owner>/<repo>/issues/<pr>/comments --jq '.[].body' (read real findings)
        -> fix -> git commit + push to the SAME branch (never a new PR)"
      next: S8_PENDING_REVIEW (re-audit)
    - id: S10_AUTO_MERGE
      action: "gh pr merge <n> --repo <repo> --merge --delete-branch"
      condition_race_fix: "if audit-check CI job fails with 'No structured audit verdict found'
        (posted before the comment), supervisor-entrypoint.sh's AUDIT-CHECK-RERUN-BLOCK
        auto-retriggers it -- gh run rerun <run_id> --repo <repo> --failed"
      branch_A: "merge succeeds (real gh pr view confirms mergedAt != null) -> S11_MERGED"
      branch_B: "merge fails (real conflict or transient 5xx) -> S10a_CONFLICT_RESOLVE"
    - id: S10b_HELD_FOR_SIGNOFF
      action: "Owner-rights-delegated default -- this assistant verifies real CI + real audit
        text, then performs S10_AUTO_MERGE on the Owner's standing behalf unless the action is
        irreversible/high-stakes enough to warrant a real pause"
      next: S10_AUTO_MERGE
    - id: S10a_CONFLICT_RESOLVE
      action: "git clone -> git merge origin/master -> resolve (union-merge shared registry
        files: ai-os/MASTER_INDEX.yaml, ai-os/OWNER_DECISIONS_NEEDED_2026-07-23.yaml) -> verify
        (yaml.safe_load + entry-count check) -> commit -> push -> retry S10_AUTO_MERGE"
      next: S10_AUTO_MERGE
    - id: S11_MERGED
      system_touch: "GITHUB: PR state=MERGED. VERCEL: auto-deploy triggers on merge to main
        (no manual step -- already wired via Vercel GitHub App)."
      action: "python3 scripts/backfill_phase_self_report.py --task-id <task_id> (auto-invoked
        by SUPERVISOR_ENGINE immediately after real merge confirmation)"
      writes: "ai-os/<INITIATIVE>_PHASE_PLAN_<date>.yaml phase entry: status=done,
        completed_by_task=<task_id>, evidence=<real PR url + mergedAt>"
      next: S12_SUPABASE_SYNC_CHECK
    - id: S12_SUPABASE_SYNC_CHECK
      condition: "diff includes drizzle/*.sql"
      branch_A: "yes -> real command 'bun run db:migrate' (drizzle-kit migrate) must be run
        against the real DATABASE_URL before the merged feature is live -- this is a REAL,
        currently NOT-fully-automated gap: migrations do not auto-apply on merge. This
        assistant runs it directly as part of closing S12, or if genuinely destructive/
        high-risk, surfaces it as the one real Owner-facing exception in S16."
      branch_B: "no -> skip, next state directly"
      next: S13_PHASE_CHECK
    - id: S13_PHASE_CHECK
      action: "python3 scripts/auto_phase_continuation.py --dry-run --limit 0"
      engine: AUTO_PHASE_CONTINUATION_ENGINE
      branch_A: "next_phase != null -> S5_DISPATCH (recurse, target_repo read from phase's own
        target_repo field, no manual repo selection)"
      branch_B: "next_phase == null AND done_phases == all real phases in plan -> S14_INITIATIVE_COMPLETE"
    - id: S14_INITIATIVE_COMPLETE
      action: "python3 scripts/generate_wiring_registry.py (re-run for real, fresh coverage
        numbers) ; update ai-os/MASTER_INDEX.yaml registries.<initiative> ;
        python3 scripts/superboss-register.py register-knowledge (final artifact)"
      engine: WIRING_ENGINE, KNOWLEDGE_ENGINE
      next: S15_SYSTEM_SYNC_VERIFY
    - id: S15_SYSTEM_SYNC_VERIFY
      action: "verify all 4 SYSTEM components agree: GITHUB (gh pr list --state open, must be
        empty for this initiative) + VERCEL (gh pr view --json statusCheckRollup, Vercel=Ready)
        + SUPABASE (real query confirms new columns/tables exist) + SERVER (task.yaml status +
        phase-plan status both show done)"
      next: S16_OWNER_REPORT
    - id: S16_OWNER_REPORT
      action: "1-line English summary of real state (the ONLY English-language state in this
        entire machine)"
      engine: (none -- this assistant directly)
      next: TERMINAL_CLOSED
    - id: TERMINAL_CLOSED
      final: true

owner_ai_runbook:
  note: Real runbook -- exact steps, exact existing tool per step, folded here verbatim
    from OWNER_ASSISTANT_RUNBOOK_2026-07-26.yaml (deleted as a standalone file in this
    consolidation; no real file cited it by exact path). Every step names a real
    script/command that already exists and is already running in production. Nothing
    new is built to produce this runbook.
  process_1_new_task_given:
    - step: Route the raw chat through OWNER_ENGINE -- never read/act on raw text directly.
      tool: "python3 scripts/prompt_gateway/gateway.py via task-gateway.py submit --source owner"
    - step: If OWNER_ENGINE's own output says it can't classify confidently, query the software
        before asking the Owner anything.
      tool: scripts/prompt_gateway/query.py --q NEEDS_OWNER_CLARIFICATION
    - step: Check whether this already exists anywhere before building anything.
      tool: "ai-os/MASTER_INDEX.yaml, python3 scripts/superboss-register.py list-capabilities,
        ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json"
    - step: Save the real directive twice, independently, tagged with a Chat Post ID.
      tool: "local memory file + python3 scripts/superboss-register.py register-knowledge"
    - step: Write one watertight task prompt (OBJECTIVE/SCOPE/KNOWN_CONTEXT/SUCCESS_CRITERIA/
        EXPECTED_OUTPUT/CONSTRAINTS/COMPLEXITY_TIER) -- every SUCCESS_CRITERIA line a real runnable
        command.
      tool: scripts/tight_task_validation.py (the real gate that rejects a bad prompt before dispatch)
    - step: Dispatch it for real.
      tool: python3 scripts/task-gateway.py submit then start
    - step: If it is a multi-phase initiative, its phase-plan file matches auto_phase_continuation.py's
        real schema so later phases pick themselves up.
      tool: "ai-os/*_PHASE_PLAN_*.yaml matching PLAN_GLOBS in scripts/auto_phase_continuation.py"
  process_2_status_asked:
    - step: "task-20260726-092433: when the Owner's own message names the task_id and asks a
        status/completion question in one line, route it through the single entrypoint --
        it calls task-gateway.py status for real and returns systemd_active + the last
        checkpoint note in one JSON call, no separate manual steps needed."
      tool: "echo \"<owner message>\" | python3 scripts/prompt_gateway/gateway.py --mode owner-dispatch"
    - step: Read the real, current status field for every task in flight -- not memory of what was
        dispatched. (Still the real path when a task_id was not named in the Owner's own message,
        or for a full sweep across multiple tasks at once.)
      tool: "grep '^status:' /opt/veridian/ai-os/tasks/<id>/task.yaml"
    - step: Never accept self-reported 'completed' as real completion.
      tool: "gh pr view <n> --repo <owner>/<repo> --json state,mergedAt"
    - step: If blocked, read the real reason before reporting anything.
      tool: task.yaml checkpoint notes + review.json + supervisor.log
    - step: Report in 1 line, real facts only -- what merged, what's still running, what's blocked
        and why.
      tool: (this assistant's own reporting discipline, no software needed for this one step)
  process_3_complete_task_and_phases:
    - step: On real merge confirmation, the phase's own status/completed_by_task/evidence fields
        get written back automatically -- no manual backfill.
      tool: scripts/backfill_phase_self_report.py (auto-invoked by supervisor-entrypoint.sh, fixed
        2026-07-26 PR #76)
    - step: The next real dispatchable phase is found and dispatched to its correct real repo
        automatically.
      tool: "python3 scripts/auto_phase_continuation.py (cron every 30 min, or --limit 1 to force
        one tick now) -- target_repo-aware dispatch, fixed 2026-07-26"
    - step: If the required audit-check CI job races the real AUDIT comment, it re-runs itself
        automatically.
      tool: "audit-check-rerun block in scripts/supervisor-entrypoint.sh, fixed 2026-07-26 PR #76"
    - step: If a real AUDIT FAIL lands, read the real findings in full, then push a real corrective
        fix to the SAME branch/PR -- never a disconnected new one.
      tool: "gh api repos/<owner>/<repo>/issues/<pr>/comments, then a dispatched fix task targeting
        the existing branch"
    - step: Repeat until a fresh dry-run shows every phase in done_phases, confirmed against real
        merged PRs, not self-reports.
      tool: python3 scripts/auto_phase_continuation.py --dry-run --limit 0
    - step: Close out -- register the real completion and sync every touched document.
      tool: "ai-os/MASTER_INDEX.yaml + python3 scripts/superboss-register.py register-knowledge"

