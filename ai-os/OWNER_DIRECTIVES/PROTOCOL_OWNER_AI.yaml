enforcement:
  mechanism: >-
    scripts/check_single_protocol_file.py -- greps ai-os/OWNER_DIRECTIVES/ for
    more than one file matching the real "protocol document" signature (document_class
    == protocol, or a top-level articles list, or meta.status == NON_NEGOTIABLE) and
    more than one matching the "memory document" signature (document_class == memory,
    or a top-level incidents or lessons key), exiting non-zero with the exact duplicate
    filenames if either count is not exactly 1.
  wired_into: scripts/preflight-guard.py check_single_protocol_file() -- runs before
    every real task dispatch, same enforcement point as check_crontab_unauthorized_change.
