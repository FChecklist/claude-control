  precedent: 'Same method as the 3 prior Phase 0 tasks this session: ai-os/20_ENGINES_10_GATEWAYS_PHASE_PLAN_2026-07-24.yaml,
    ai-os/AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml, and the self-sustaining-system-engine work (Knowledge
    Engine Phase 2) -- real investigation before build, a concrete dependency mechanism per edge, not a
    conceptual arrow.'
  scope_of_this_document: 'Phase 0 output only, per this task''s own CONSTRAINTS: this file plans route test
    auto-generation, distributed trace verification wiring, route replay storage+diff, and dependency graph
    validation -- it does not implement any of them. ai-os/ROUTE_REGISTRY_SCHEMA_2026-07-24.yaml and
