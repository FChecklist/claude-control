  - from: "20_ENGINES_10_GATEWAYS_PHASE_PLAN_2026-07-24.yaml phase_1_capability_registry_live_wiring"
    to: phase_1_route_test_autogeneration
    mechanism: "Hard external mechanism dependency -- Phase 1 needs a live table with a real insert/webhook
      event to trigger route generation from; today's static YAML has no such event."
