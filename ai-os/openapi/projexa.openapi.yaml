          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createSalaryComponent
      summary: Create a salary component
      tags: [payroll]
      description: Real handler src/app/api/payroll/salary-components/route.ts POST, proxies to upstream POST /payroll/salary-components.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Created (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/salary-structures:
    get:
      operationId: listSalaryStructures
      summary: List salary structures
      tags: [payroll]
      description: Real handler src/app/api/payroll/salary-structures/route.ts GET, proxies to upstream GET /payroll/salary-structures.
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createSalaryStructure
      summary: Create a salary structure
      tags: [payroll]
      description: Real handler src/app/api/payroll/salary-structures/route.ts POST, proxies to upstream POST /payroll/salary-structures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Created (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/statutory-rules:
    get:
      operationId: listStatutoryRules
      summary: List statutory payroll rules
      tags: [payroll]
      description: Real handler src/app/api/payroll/statutory-rules/route.ts GET, proxies to upstream GET /payroll/statutory-rules.
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createStatutoryRule
      summary: Create a statutory payroll rule
      tags: [payroll]
      description: Real handler src/app/api/payroll/statutory-rules/route.ts POST, proxies to upstream POST /payroll/statutory-rules.
      requestBody:
        required: true
        content:
