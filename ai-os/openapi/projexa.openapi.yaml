  /payroll/employees/{id}/income-tax-slab:
    post:
      operationId: assignEmployeeIncomeTaxSlab
      summary: Assign an income-tax slab to an employee
      tags: [payroll]
      description: Real handler src/app/api/payroll/employees/[id]/income-tax-slab/route.ts POST, proxies to upstream POST /payroll/employees/{id}/income-tax-slab.
