openapi: 3.1.0
info:
  title: projexa API -- Payroll domain
  version: "1.0.0"
  description: >-
    Real, hand-authored OpenAPI 3.1 contract for projexa's Payroll feature. Every
    path/method below is derived directly from the real Next.js route handlers under
    src/app/api/payroll/**/route.ts -- confirmed by reading each file, not invented.

    Real architectural finding worth recording here: every one of these 12 route
    handlers is a thin authenticated proxy -- requireAuth() then callVeridian(...)
    (or callVeridianBinary for the one PDF-streaming route) against an upstream
    VERIDIAN payroll backend (see src/lib/veridian-client.ts). projexa's own Next.js
    layer does not itself contain the payroll business logic or a drizzle table for
    these resources; response bodies below are documented as the real upstream JSON
    shape observed via callVeridian's pass-through (NextResponse.json(data)), not
    projexa-owned schemas.

    Scope note (honest, not padded): projexa's real app/api tree has 51+ top-level
    route.ts handlers (910-scale when counted the same way as compliance-tracker's
    own app/api tree). This document covers the payroll sub-tree (12 real route
    files) as the first representative, fully-real OpenAPI contract for this repo --
    same bounded-subset discipline as compliance-tracker.openapi.yaml in this same
    directory.
  contact:
    name: VERIDIAN Platform Team
    email: raajat.agarwal@gmail.com
  license:
    name: Proprietary
servers:
  - url: https://projexa.internal/api
    description: Production (real base path -- Next.js app router under src/app/api)
  - url: http://localhost:3000/api
    description: Local dev server
tags:
  - name: payroll
    description: Payroll runs, payslips, salary structure, and statutory configuration
security:
  - supabaseSessionCookie: []
paths:
  /payroll/runs:
    get:
      operationId: listPayrollRuns
      summary: List payroll runs for the caller's organisation
      tags: [payroll]
      description: Real handler src/app/api/payroll/runs/route.ts GET, proxies to upstream GET /payroll/runs via callVeridian().
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createPayrollRun
      summary: Create a payroll run
      tags: [payroll]
      description: Real handler src/app/api/payroll/runs/route.ts POST, proxies to upstream POST /payroll/runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Created (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/runs/{id}/process:
    post:
      operationId: processPayrollRun
      summary: Process a payroll run
      tags: [payroll]
      description: Real handler src/app/api/payroll/runs/[id]/process/route.ts POST, proxies to upstream POST /payroll/runs/{id}/process.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/runs/{id}/payslips:
    get:
      operationId: listRunPayslips
      summary: List payslips generated by a payroll run
      tags: [payroll]
      description: Real handler src/app/api/payroll/runs/[id]/payslips/route.ts GET, proxies to upstream GET /payroll/runs/{id}/payslips.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/payslips/{id}/finalize:
    post:
      operationId: finalizePayslip
      summary: Finalize a payslip
      tags: [payroll]
      description: Real handler src/app/api/payroll/payslips/[id]/finalize/route.ts POST, proxies to upstream POST /payroll/payslips/{id}/finalize.
      parameters:
        - $ref: "#/components/parameters/PayslipId"
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/payslips/{id}/pdf:
    get:
      operationId: downloadPayslipPdf
      summary: Download a payslip as a PDF
      tags: [payroll]
      description: >-
        Real handler src/app/api/payroll/payslips/[id]/pdf/route.ts GET, streams a
        binary response via callVeridianBinary() (not callVeridian()) -- the one
        binary-download route in this domain, per this file's own Priority-15
        comment.
      parameters:
        - $ref: "#/components/parameters/PayslipId"
      responses:
        "200":
          description: OK -- binary PDF, Content-Disposition attachment
          content:
            application/pdf:
              schema: { type: string, contentEncoding: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/payslips/{id}/tds:
    post:
      operationId: updatePayslipTds
      summary: Update TDS (tax-deducted-at-source) figures on a payslip
      tags: [payroll]
      description: Real handler src/app/api/payroll/payslips/[id]/tds/route.ts POST, proxies to upstream POST /payroll/payslips/{id}/tds.
      parameters:
        - $ref: "#/components/parameters/PayslipId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK (real upstream JSON shape, pass-through)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /payroll/salary-components:
    get:
      operationId: listSalaryComponents
      summary: List salary components
      tags: [payroll]
      description: Real handler src/app/api/payroll/salary-components/route.ts GET, proxies to upstream GET /payroll/salary-components.
      responses:
