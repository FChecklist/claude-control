        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
components:
  securitySchemes:
    supabaseSessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: Real auth mechanism -- every route in this document calls requireAuth() from src/lib/supabase/auth-guard.ts.
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Upstream VERIDIAN payroll-run id
    PayslipId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Upstream VERIDIAN payslip id
    EmployeeId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Upstream VERIDIAN employee id
  responses:
    Unauthorized:
      description: No valid Supabase session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamError:
      description: >-
        Upstream VERIDIAN backend call failed or is unreachable -- real 502
        fallback every handler in this domain returns when the error is not a
        VeridianApiError with its own status (see src/lib/veridian-client.ts).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
