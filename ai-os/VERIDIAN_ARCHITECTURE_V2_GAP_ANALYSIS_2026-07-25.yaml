meta:
  title: VERIDIAN_Architecture_v2.0.docx -- Real Gap Analysis Against Current Real System State
  created: '2026-07-25'
  produced_by_task: task-20260725-112909-veridian-architecture-v2-task2-phase0-ga
  precedent_task: "task-20260725-104606-owner-engine-document-accuracy-convergen (PR #69,
    merged) -- extracted the document's real full text to
    ai-os/owner-attachments/VERIDIAN_Architecture_v2.0_extracted.txt (564 lines) and proved
    OWNER_ENGINE reproduces it with 0.0% real gap (165/165 gold content items covered). This
    task reads that already-extracted, already-verified-accurate text in full (done, not
    re-summarized here) and gap-checks its 108 real itemized requirements below against the
    current real system state -- the document's own accuracy was never in question; whether
    its CONTENT is already built is this task's question."
  document_self_description: 'The document is explicitly NOT a spec of the current VERIDIAN
    AI OS (this ops/orchestration system). Its own Executive Summary (extracted text line 12-15)
    frames it as a "browser-first Prompt Intelligence Platform" -- an end-user-facing product
    that runs LLM inference natively inside a web browser tab via WebGPU/WebNN/window.ai, with
    its own 74-engine prompt lifecycle-management architecture, a 41-stage compiler pipeline,
    a 10-level (L0-L9) browser+server cache hierarchy, DSPy-based prompt compilation, and a
    4-layer defense-in-depth security model. "VERIDIAN" here is a product name shared with this
    ops system''s own name, not evidence the same system is being described -- confirmed by
    reading the document''s Part III references (WebLLM, WebNN, Transformers.js, DSPy, NeMo
    Guardrails -- all client-side/ML-product technologies with zero presence anywhere in this
    session''s own orchestration codebase, verified below) against what this ops system and its
    2 real product repos (compliance-tracker, projexa) actually run (Next.js/TypeScript +
    drizzle-orm/Postgres server-rendered SaaS apps, plus this repo''s own stdlib-only Python
    cron/dispatch scripts) -- no overlap in the underlying technology stack beyond the shared
    "prompt"/"engine" vocabulary.'
  headline_finding: 'Of 105 itemized real requirements, 85 (81.0%) are not_implemented, 20
    (19.0%) are partially_implemented via real but narrow/differently-scoped prior art, and 0
    (0%) are already_implemented as this document specifies them. This is an honest count, not
    a manufactured one -- see per-item evidence below. The document describes what is, in
    effect, a new, third kind of software this system has never built: neither the compliance-
    tracker/projexa business-SaaS product line nor this ai-os orchestration system''s own
    prompt-dispatch tooling (scripts/prompt_gateway/) match its browser-native local-inference
    product surface. The 8 partial items are real, narrowly-scoped prior art this plan must
    extend rather than duplicate -- listed in known_partial_prior_art below and cited per-item.'
  known_partial_prior_art:
    - id: prompt_gateway
      path: scripts/prompt_gateway/ (gateway.py, engine/{classifier,prompt_engine,context_engine,snip_engine}.py)
      registry: registries.prompt_gateway (MASTER_INDEX.yaml)
      real_capability: 'Server-side (not browser), stdlib-only Python, keyword/regex-based (not
        embedding/DSPy-based). Classifies raw owner chat text into one of 6 categories with a
        confidence score, strips noise (13.2% char reduction / 66.7% token reduction on its own
        documented real run), retrieves matching snippets, and prunes session context -- all as
        a pre-processing FILTER upstream of scripts/task-gateway.py, never a prompt registry,
        compiler, or execution engine in the document''s sense.'
      caveat: 'Itself explicitly documents (ai-os/PROMPT_GATEWAY_2026-07-25.yaml
        owner_engine_spec_not_implemented) that it implements only a slice of a DIFFERENT,
        separate "19-engine OWNER_ENGINE YAML spec" the Owner described in chat -- not this
        document, and not fully even that spec (Temporal/OPA/Qdrant/local-model-hosting
        explicitly out of scope there too). Two distinct unbuilt specs exist in this system''s
        history; this gap analysis is only about VERIDIAN_Architecture_v2.0.docx.'
    - id: knowledge_engine
      path: scripts/superboss-register.py (knowledge_engine table, register-knowledge/query-knowledge/list-knowledge)
      registry: registries.system_index (MASTER_INDEX.yaml), KE- id namespace
      real_capability: 'Real, live, server-side SQLite+FTS5 structured knowledge store with
        relationships, tags, and drift verification (verify-knowledge). Functionally the closest
        real analog to the document''s "server knowledge base" half of L9 Knowledge Cache Engine
        and Knowledge Sync Engine -- but has no browser-side component, no embedding/similarity
        search, and is not a prompt-specific cache.'
    - id: litert_spike
      path: 'repos/compliance-tracker/src/app/litert-spike/ + litert-spike-embeddings/ (page.tsx,
        worker-src/inference-worker.ts, types.ts)'
      registry: not yet in MASTER_INDEX.yaml (confirmed absent by grep -- itself a small
        registration gap, noted in phase_1 of the new phase plan)
      real_capability: 'Real, working browser-side WebGPU/WASM ML inference prototype using
        Google LiteRT (not WebLLM), with a real webgpu-with-wasm-fallback code path
        (Accel = "webgpu" | "wasm" in types.ts; try/catch fallback in inference-worker.ts). This
        is the ONLY real browser-native local-inference code anywhere in the 2 real product repos
        -- confirmed by repo-wide grep for webllm/webgpu/webnn/transformers.js/dspy/onnx across
        compliance-tracker and projexa. It is a spike (proof-of-concept under an app-router debug
        route), not a production engine: no model catalog, no streaming, no JSON mode, no NPU/
        Built-in-AI tiers, no pipeline, no cache hierarchy around it.'
    - id: llm_client
      path: repos/compliance-tracker/src/lib/llm-client.ts
      real_capability: 'Real, server-side (not browser-tiered) LLM call wrapper with
        estimateCostUsd()/estimateCacheSavingsUsd() cost-estimation functions and callLLM/
        callLLMJson/callLLMVision entrypoints. Functionally the closest real analog to the
        document''s Cost Estimation pipeline stage and Server Escalation Engine (Tier 5) target
        -- but is a single flat call path, not a 5-tier browser-to-server routing/fallback system.'
    - id: permission_service
      path: repos/compliance-tracker/src/lib/services/permission-service.ts
      real_capability: 'Real, generic org/user RBAC service already used across compliance-tracker.
        Architecturally reusable for the document''s Permission Engine (RBAC for prompt access/
        edit/approve/deploy) but not wired to any prompt-lifecycle object today, because no prompt
        registry exists for it to protect.'
    - id: engines_gateways_architecture_pattern
      path: ai-os/20_ENGINES_10_GATEWAYS_PHASE_PLAN_2026-07-24.yaml + ai-os/CAPABILITY_REGISTRY_SCHEMA_2026-07-24.yaml
      real_capability: 'Real, live, mechanically-verified 20-engine/10-gateway architecture
        (Intent, Context, CapabilityRegistry, Planning, Policy, Rule, Decision, Workflow,
        Automation, Integration, Document, Notification, Data, Metadata, Knowledge, Learning,
        UIComposition, Analytics, Audit, Observability + gateways G01-G10) for BUSINESS-PROCESS
        TASK AUTOMATION in compliance-tracker/projexa -- a genuinely different subject matter
        than this document''s prompt-lifecycle engines despite 9 literal name collisions (Audit,
        Analytics, Workflow, Policy, Rule/Business Rule, Notification, Data, Knowledge, Governance-
        adjacent). NOT a functional match for any single document item (confirmed per-item below,
        never assumed from the name alone, per this task''s own zero-duplication CONSTRAINT) --
        but its engine/gateway/capability-registry SEPARATION PATTERN and its
        lookup-before-dispatch convention (scripts/superboss-register.py capability_registry) is
        the pattern this plan''s phases reuse rather than reinventing a parallel structure, most
        directly for the Gateway Integration Engine and Capability Engine items below.'
  itemization_method: 'Granularity matches this document''s own structural units: each of the 74
    named engines in the Complete Engine Catalog (2.1) is one item; the Improved Prompt Compiler
    Pipeline (2.2) is itemized at its own 8 named layer-groupings (which the document itself
    groups its 41 stages into, e.g. "Stage 3: Context Assembly Layer (Stages 8-12)"), not all 41
    individually, to avoid 41 near-duplicate one-line items the document itself does not treat as
    independently separable; the Cache Architecture (2.3) is itemized at all 10 real cache levels
    (L0-L9) since each has a distinct technology/capacity/eviction contract; the Technology Stack
    (2.4) is itemized at its 5 named sub-stacks; the Performance Budget Framework (2.5) and
    Metadata Schema (2.6) are each one cross-cutting item (a schema/budget-table requirement, not
    an engine); the YCML Specification Catalog (2.7) is one item (documentation format 1:1 with
    the engines already itemized, not double-counted); the Defense-in-Depth Architecture (2.8) is
    one item (already covered engine-by-engine via items 26-27 in the catalog; itemized separately
    here only for its cross-cutting 4-layer ENFORCEMENT requirement, distinct from the engines
    that implement each layer); Governance and Compliance (2.9) is 2 items (lifecycle state machine,
    GitOps workflow). Total: 74 + 8 + 10 + 5 + 1 + 1 + 1 + 1 + 2 = 103, plus 2 real
    scope-disambiguation findings this gap-check itself surfaced (browser-vs-server target-repo
    decision, litert-spike own missing MASTER_INDEX.yaml registration) = 105. Part I of the document (1.1-1.6, the document''s
    OWN gap analysis of its predecessor v1 spec) is NOT itemized as a requirement of the CURRENT
    system -- it is the document''s internal rationale for why v2 differs from v1, already fully
    captured by itemizing v2''s own catalog/pipeline/cache/stack sections below.'

# ============================================================================
# ITEMS -- Part II, Section 2.1: Complete Engine Catalog (74 engines, 8 domains)
# ============================================================================
items:

  # -- Prompt Core Engines (12) --
  - id: engine-prompt-registry
    domain: prompt_core
    name: Prompt Registry Engine
    requirement: Master registry of every prompt across all lifecycle states, unique ID, indexing, discovery.
    verdict: not_implemented
    evidence: 'No prompt registry exists in any repo. scripts/prompt_gateway/ has no registry table
      (only a per-invocation VD- id counter, ai-os/PROMPT_GATEWAY_2026-07-25.yaml vd_id_namespace
      -- explicitly "NEVER a task id, a knowledge-engine row id" and scoped to raw-chat pre-processing
      records only, not compiled/versioned prompts). Confirmed by grep: no "prompt_registry" table
      in ai-os/DATABASE_CATALOG.json (444 tables catalogued, none named prompt*).'

  - id: engine-prompt-version
    domain: prompt_core
    name: Prompt Version Engine
    requirement: Semantic versioning (MAJOR.MINOR.PATCH), full diff history, immutable snapshots, rollback.
    verdict: not_implemented
    evidence: No prompt versioning mechanism exists. Git itself provides diff/rollback for files
      generally, but nothing implements prompt-object-specific semantic versioning.

  - id: engine-prompt-lifecycle
    domain: prompt_core
    name: Prompt Lifecycle Engine
    requirement: State machine (Draft/Review/Staging/Production/Deprecated) with approval gates.
    verdict: not_implemented
    evidence: No such state machine exists for prompts. compliance-tracker has unrelated approval-workflow-service.ts
      for business approvals (different domain object entirely).

  - id: engine-prompt-compiler
    domain: prompt_core
    name: Prompt Compiler Engine
    requirement: Natural language intent to optimized machine prompt via DSPy-style declarative compilation.
    verdict: partially_implemented
    evidence: 'scripts/prompt_gateway/engine/prompt_engine.py performs template-based construction
      of a compressed machine_prompt from classified+noise-stripped input (real, documented output:
      "[VERIDIAN:VD-...][CAT:CODE|INTENT:FIX] CODE_FIX:issue=...:target=..."). Not DSPy-based
      (no signatures/optimizers/BootstrapFewShot/MIPROv2), not registry-integrated, server-side only.'
    known_partial_prior_art_ref: prompt_gateway

  - id: engine-prompt-optimizer
    domain: prompt_core
    name: Prompt Optimizer Engine
    requirement: Automatic token reduction, instruction refinement, structure optimization, metric-guided.
    verdict: not_implemented
    evidence: prompt_gateway's noise-reduction is a fixed regex-strip, not metric-guided optimization
      against a defined quality signal (no eval loop, no metric target).

  - id: engine-prompt-compression
    domain: prompt_core
    name: Prompt Compression Engine
    requirement: Lossless and lossy compression for reduced token count while preserving semantic intent.
    verdict: partially_implemented
    evidence: 'prompt_gateway''s real documented run achieved 66.7% token reduction / 13.2% char
      reduction on one sample input (ai-os/PROMPT_GATEWAY_2026-07-25.yaml end_to_end_proof). Real,
      but a single fixed heuristic, not a formal lossless/lossy dual-mode compressor with a
      reversibility guarantee.'
    known_partial_prior_art_ref: prompt_gateway

  - id: engine-prompt-expansion
    domain: prompt_core
    name: Prompt Expansion Engine
    requirement: Expand compressed prompts, restore hidden defaults, hydrate templates with full context.
    verdict: not_implemented
    evidence: No inverse-of-compression expansion mechanism exists; prompt_gateway is one-directional
      (compress only, never decompress/expand).

  - id: engine-prompt-validation
    domain: prompt_core
    name: Prompt Validation Engine
    requirement: Schema completeness check, required field validation, structural integrity verification.
    verdict: not_implemented
    evidence: No prompt schema exists to validate against (see engine-prompt-registry -- nothing to validate).

  - id: engine-prompt-testing
    domain: prompt_core
    name: Prompt Testing Engine
    requirement: Automated test execution -- unit, regression, adversarial, shadow testing of prompts.
    verdict: not_implemented
    evidence: 'registries.testing_engine_irvf (ai-os/TESTING_ENGINE_PHASE_PLAN_2026-07-24.yaml) is
      a real, live route/API test-generation-and-replay engine for compliance-tracker''s HTTP routes
      -- confirmed by reading its own scope (route auto-generation on capability creation, distributed
      trace verification, route replay/diff) to be about API ROUTE testing, not prompt testing. Not
      a functional match; no prompt-specific test engine exists.'

  - id: engine-prompt-benchmark
    domain: prompt_core
    name: Prompt Benchmark Engine
    requirement: Measure speed, accuracy, cost, quality against standardized benchmark datasets.
    verdict: not_implemented
    evidence: No benchmark dataset or harness for prompts exists in any repo.

  - id: engine-prompt-portability
    domain: prompt_core
    name: Prompt Portability Engine
    requirement: Cross-model prompt adaptation across OpenAI, Anthropic, Google, and local models.
    verdict: not_implemented
    evidence: llm-client.ts (repos/compliance-tracker/src/lib/llm-client.ts) calls a single configured
      model per request; no cross-provider adaptation layer exists.

  - id: engine-prompt-ab
    domain: prompt_core
    name: Prompt A/B Engine
    requirement: Multi-armed bandit experimentation, traffic splitting, statistical significance, auto-promotion.
    verdict: not_implemented
    evidence: No experimentation framework for prompts exists anywhere in the codebase.

  # -- Intelligence and Matching Engines (10) --
  - id: engine-prompt-ranking
    domain: intelligence_matching
    name: Prompt Ranking Engine
    requirement: Best-prompt selection via weighted scoring across quality/cost/latency/freshness.
    verdict: not_implemented
    evidence: No prompt scoring/ranking mechanism exists.

  - id: engine-prompt-recommendation
    domain: intelligence_matching
    name: Prompt Recommendation Engine
    requirement: Suggest related prompts/templates/optimizations based on usage patterns.
    verdict: not_implemented
    evidence: No usage-pattern analysis or recommendation mechanism exists for prompts.

  - id: engine-prompt-similarity
    domain: intelligence_matching
    name: Prompt Similarity Engine
    requirement: Semantic matching via local embeddings for duplicate detection and clustering.
    verdict: not_implemented
    evidence: No embedding generation or similarity search exists anywhere in either product repo
      or this ops system (confirmed by the same repo-wide grep that found zero transformers.js/
      onnx/embedding-model references outside litert-spike-embeddings' own tokenizer scaffold,
      which computes no similarity index).

  - id: engine-intent
    domain: intelligence_matching
    name: Intent Engine
    requirement: Multi-level intent extraction (primary, secondary, implicit) from natural language.
    verdict: partially_implemented
    evidence: 'scripts/prompt_gateway/engine/classifier.py performs single-level keyword-ratio
      intent classification into one of 6 categories (CODE/ANALYSIS/OPS/QUERY/TASK/GENERAL) plus
      a sub-intent tag (e.g. FIX) -- real and documented (confidence 0.2514 on its own sample run)
      but single-level only, no primary/secondary/implicit decomposition, no ML model (pure keyword
      ratio).'
    known_partial_prior_art_ref: prompt_gateway

  - id: engine-entity
    domain: intelligence_matching
    name: Entity Engine
    requirement: Named entity recognition and extraction including domain-specific entity types.
    verdict: not_implemented
    evidence: No NER capability exists in prompt_gateway or elsewhere; its classifier does keyword
      matching only, not entity extraction.

  - id: engine-variable
    domain: intelligence_matching
    name: Variable Engine
    requirement: Variable identification, type inference, default resolution, runtime binding.
    verdict: not_implemented
    evidence: No variable-detection/type-inference mechanism exists for prompts.

  - id: engine-context
    domain: intelligence_matching
    name: Context Engine
    requirement: Dynamic context construction combining user context, session history, business context.
    verdict: partially_implemented
    evidence: 'scripts/prompt_gateway/engine/context_engine.py does real session-context assembly
      and pruning (documented real run: "Context: 1 msgs, ~20 tokens after prune") plus
      snippet-based context retrieval (snip_engine.py, 6 seeded snippets). Real but narrow: no
      business-context source, no multi-source merge, server-side flat-file store only.'
    known_partial_prior_art_ref: prompt_gateway

  - id: engine-workflow-intel
    domain: intelligence_matching
    name: Workflow Engine (prompt-lifecycle sense)
    requirement: Workflow mapping, step orchestration, dependency resolution for multi-step prompts.
    verdict: not_implemented
    evidence: 'The existing "Workflow Engine" (engine 8 of 20_ENGINES_10_GATEWAYS_PHASE_PLAN_2026-07-24.yaml,
      exists_as task-execution-engine.ts) orchestrates business TASK workflows in compliance-tracker,
      not multi-step PROMPT workflows -- confirmed different subject by reading its own gateway-inventory
      description. No functional match for prompt-step orchestration exists.'

  - id: engine-capability-intel
    domain: intelligence_matching
    name: Capability Engine (prompt-lifecycle sense)
    requirement: Required software capability assessment matching prompt needs to available tools.
    verdict: not_implemented
    evidence: 'The existing Capability Registry Engine (ai-os/CAPABILITY_REGISTRY_SCHEMA_2026-07-24.yaml,
      live table via scripts/superboss-register.py register-capability/lookup-capability) matches
      TASK DISPATCH requests to available automation capabilities (5+ live rows, e.g. gratuity
      calculation) -- a real, live, different-domain system. Reusable PATTERN for this item (see
      phase_9 of the new phase plan), but not itself a match: it has no notion of a "prompt" object
      to assess capability needs for.'

  - id: engine-confidence
    domain: intelligence_matching
    name: Confidence Engine
    requirement: Multi-signal confidence scoring combining cache match, intent clarity, model readiness.
    verdict: partially_implemented
    evidence: 'classifier.py emits a single confidence float (0.2514 in its documented run) from
      keyword-ratio scoring alone -- one signal, not the multi-signal (cache/intent/context/model)
      composite the document specifies.'
    known_partial_prior_art_ref: prompt_gateway

  # -- Business and Policy Engines (8) --
  - id: engine-business-rule
    domain: business_policy
    name: Business Rule Engine (prompt-lifecycle sense)
    requirement: Business logic evaluation, rule matching, constraint enforcement for prompts.
    verdict: not_implemented
    evidence: 'The existing Rule Engine (engine 6 of 20_ENGINES_10_GATEWAYS, exists_as
      guardrail-registrations.ts assertBusinessRulesBeforeExecution()) enforces business rules
      before TASK dispatch execution -- confirmed real and live per WIRING_ENGINE_PHASE_PLAN_2026-07-25.yaml
      phase 1 evidence, but scoped to compliance-tracker business-domain rules (GSTIN/PAN/gratuity
      calc etc.), never prompt content. No functional match for prompt-rule evaluation.'

  - id: engine-dependency
    domain: business_policy
    name: Dependency Engine
    requirement: Required module identification and dependency graph management for prompts.
    verdict: not_implemented
    evidence: 'ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json is a real dependency/relationship graph,
      but across engines/gateways/tables/functions of THIS ops system and compliance-tracker''s
      task-dispatch pipeline -- confirmed by its own schema (entity_type in {engine, gateway,
      table, function, route}) to carry no "prompt" entity type. No prompt-dependency graph exists.'

  - id: engine-permission
    domain: business_policy
    name: Permission Engine
    requirement: RBAC for prompt access, edit, approve, and deploy operations.
    verdict: partially_implemented
    evidence: 'repos/compliance-tracker/src/lib/services/permission-service.ts is a real, live,
      generic org/user RBAC service used across the product today. Architecturally reusable (same
      library, same role model) but not wired to any prompt-lifecycle object, because no prompt
      registry/lifecycle exists yet for it to gate (see engine-prompt-registry, engine-prompt-lifecycle).'
    known_partial_prior_art_ref: permission_service

  - id: engine-policy
    domain: business_policy
    name: Policy Engine (prompt-lifecycle sense)
    requirement: Company-wide policy enforcement -- content policies, brand voice, compliance rules for prompts.
    verdict: not_implemented
    evidence: 'The existing Policy Engine (engine 5 of 20_ENGINES_10_GATEWAYS, enforcePolicy() in
      task-execution-engine.ts) enforces policy only on the LLM-package-dispatch path
      (executePackageDispatch(), per WIRING_ENGINE_PHASE_PLAN_2026-07-25.yaml phase 1''s own confirmed
      finding) -- not a content-policy/brand-voice check on prompt text itself. No functional match.'

  - id: engine-compliance
    domain: business_policy
    name: Compliance Engine (prompt-lifecycle sense)
    requirement: GDPR, HIPAA, SOC 2 compliance management for prompt content, eval datasets, audit logs.
    verdict: not_implemented
    evidence: 'IMPORTANT NAMING TRAP, explicitly checked and rejected: compliance-tracker (the
      product itself) manages GDPR/HIPAA/SOC2 compliance as its CORE BUSINESS DOMAIN -- but for its
      CLIENTS'' business operations (the product being sold), not for prompt content/eval-datasets/
      audit-logs belonging to a prompt intelligence platform. Confirmed by reading its own module
      list (ai-os/CONSTITUTION.yaml-referenced modules) -- no module manages compliance OF prompts.
      Real gap, distinct from the product''s existing compliance-tracking business logic.'

  - id: engine-governance
    domain: business_policy
    name: Governance Engine (prompt-lifecycle sense)
    requirement: Ownership tracking, stewardship assignment, cross-team prompt coordination.
    verdict: not_implemented
    evidence: 'ai-os/AI_GOVERNANCE_REVIEW_2026-07-24.yaml and GOVERNANCE_PHASE15_CLOSEOUT_2026-07-24.yaml
      govern THIS ai-os orchestration system''s own AI-agent behavior (governance OF the AI, not
      governance of a prompt-product''s prompt assets) -- confirmed by reading their own scope. No
      functional match for prompt-ownership/stewardship tracking.'

  - id: engine-audit
    domain: business_policy
    name: Audit Engine (prompt-lifecycle sense)
    requirement: Complete, append-only history of every prompt change, access, and execution event.
    verdict: not_implemented
    evidence: 'The existing Audit Engine (engine 19 of 20_ENGINES_10_GATEWAYS) and knowledge_engine''s
      own append-only KE- record history are both real, live, generic audit-log MECHANISMS this
      plan''s phases should reuse (per zero-duplication CONSTRAINT) rather than build a 3rd audit
      log from scratch -- but neither currently records any prompt-object change/access/execution
      event, because no prompt registry exists yet to generate those events. Real gap for the
      specific requirement; reusable mechanism noted for the phase plan.'

  - id: engine-cost-optimization
    domain: business_policy
    name: Cost Optimization Engine
    requirement: Per-prompt cost tracking, budget guardrails, cost-reduction recommendations.
    verdict: partially_implemented
    evidence: 'llm-client.ts''s estimateCostUsd()/estimateCacheSavingsUsd() (repos/compliance-tracker/src/lib/llm-client.ts:212,229)
      are real, live per-CALL cost estimation functions. registries.credit_spend_governance
      (this ops system''s own session/task cost tracking, scripts/cost_reconciliation.py,
      scripts/cost_usage_60min.py) is a real, separate cost-governance mechanism, but for THIS
      ops system''s own AI-agent spend, not per-prompt product cost. Neither implements
      budget guardrails or cost-reduction recommendations for a prompt registry (which does not exist).'
    known_partial_prior_art_ref: llm_client

  # -- Security and Quality Engines (6) --
  - id: engine-defense-in-depth
    domain: security_quality
    name: Defense-in-Depth Engine
    requirement: Coordinates multi-layer security -- input sanitization, prompt hardening, output filtering, runtime guardrails.
    verdict: not_implemented
    evidence: No multi-layer prompt-security coordination mechanism exists anywhere.

  - id: engine-prompt-security
    domain: security_quality
    name: Prompt Security Engine
    requirement: Prompt injection detection, jailbreak prevention, instruction leakage protection.
    verdict: not_implemented
    evidence: No injection/jailbreak detection mechanism exists for prompts in any repo (confirmed
      by grep for prompt-guard/rebuff/injection-classifier patterns, all absent outside this document
      and the security-audit-tooling below, which targets application code, not prompt content).

  - id: engine-red-team
    domain: security_quality
    name: Red Team Engine
    requirement: Automated adversarial testing using tools like Garak and PyRIT.
    verdict: not_implemented
    evidence: 'registries.auditor_engine and registries.security_audit_implementation_plan are real,
      live security-scanning pipelines (gitleaks/trivy/checkov against compliance-tracker''s source
      code, per AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phase 1 evidence) -- a real, adjacent
      security-tooling investment, but scanning APPLICATION CODE for secrets/CVEs/misconfig, not
      red-teaming PROMPTS for adversarial jailbreaks. Neither Garak nor PyRIT is installed anywhere
      (confirmed absent from package.json/requirements.txt across all repos).'

  - id: engine-quality
    domain: security_quality
    name: Quality Engine
    requirement: Accuracy scoring, hallucination detection, output quality assessment.
    verdict: not_implemented
    evidence: No LLM-output quality/hallucination scoring mechanism exists anywhere.

  - id: engine-telemetry
    domain: security_quality
    name: Telemetry Engine
    requirement: Performance metrics collection, latency tracking, resource utilization monitoring for prompts.
    verdict: not_implemented
    evidence: 'registries.sentinel_health / sentinel_violations (this ops system''s own health
      monitoring) and testing_engine_irvf''s distributed-trace-verification wiring are real telemetry
      mechanisms for THIS ops system''s task dispatch and compliance-tracker''s API routes,
      respectively -- neither instruments a prompt-execution pipeline, which does not exist.'

  - id: engine-analytics-prompt
    domain: security_quality
    name: Analytics Engine (prompt-lifecycle sense)
