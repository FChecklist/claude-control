critical_finding_this_phase: |
  ai-os/memory/superboss-register.sqlite (the canonical metadata store per STANDING_DIRECTIVE.yaml
  metadata_store) was found silently corrupted (PRAGMA integrity_check: "database disk image is malformed")
  since 2026-07-22T12:20:01 -- confirmed root cause: file was exactly one 4096-byte page short of its own
  header-declared page count (a truncated write). This had been silently failing session_bootstrap.py (the
  mandatory first command of every task), superboss-register.py check-duplicate/log-work (rule_7/rule_8
  compliance for EVERY actor server-wide), and the veridian_self_check.py (15-min) and file_inventory.py
  (20-min) crons for ~17.5 hours with ZERO ATTENTION.md escalation, because the failure occurred before those
  scripts reached their own alerting code (which itself depended on writing to the same broken DB) -- a
  chicken-and-egg gap in the escalation design itself, not just one bad file. This very likely explains why
  this task's own prior 11 invocations made no progress (session_bootstrap.py, the mandatory first step, would
  have crashed every time).
  Fix applied and verified this phase: 3 independent data recovery attempts were tried and failed (page-padding;
  real sqlite3 CLI .recover/.dump -- this Ubuntu build lacks the dbpage vtab; apsw built from source -- build
  failed) before concluding recovery was not feasible with available tools. Corrupt original quarantined (2
  backups under /opt/veridian/backups/sqlite-recovery-2026-07-23/ plus an in-place rename to
  ai-os/memory/superboss-register.sqlite.CORRUPTED-2026-07-22-quarantined), DB reinitialized via the real
  superboss-register.py init schema (not guessed), and the escalation gap itself was closed by adding
  check_db_integrity_and_backup() to scripts/health-check-15min.py -- runs every 15min via the EXISTING cron,
  reuses the EXISTING anomalies -> ATTENTION.md -> notify-owner.py path (zero new mechanisms), and adds the
  first-ever daily backup of both sqlite DBs (14-day retention; confirmed no backup of either DB existed
  anywhere on the server before this). Verified via postflight_audit_gate.py, AUD-20260723-055909-480161,
  verdict DONE, work_item WRK-20260723-055927-8289 (real audit-gated close-out, not self-certified, per
  STANDING_DIRECTIVE rule_8), and independently re-confirmed clean by the parts-14-31/36-41 research pass run
  in parallel during this same phase (which had started before the fix landed and correctly reported the DB as
  corrupted at that point).
  This finding also surfaced a second real, pre-existing capability the task's own SCOPE did not anticipate:
  /opt/veridian/repos/compliance-tracker's "Universal Metadata Registry" (asset-registry-service.ts +
  platform_assets/entity_relationships tables) is a real, tested, running tagging/relationship subsystem --
  narrower than Parts 14-22/23 ask for (covers 4 object types by its own documented scope, not "every object"),
  but a genuine partial implementation the roadmap should extend rather than duplicate.
