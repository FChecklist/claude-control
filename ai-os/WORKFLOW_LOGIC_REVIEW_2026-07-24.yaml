meta:
  title: VERIDIAN Workflow Business-Logic-Correctness AI Review (Phase 5)
  created: '2026-07-24'
  produced_by_task: task-20260724-144915-phase5-remaining-ai-review-lane-read-onl
  precedent: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phase-5 scope: 'workflow domain -- business-logic-
    correctness judgment (the transition-legality slice is software, see Phase 6)'. Same structure as
    ai-os/ENTERPRISE_ARCHITECTURE_DRIFT_REVIEW_2026-07-24.yaml (Phase 4's own AI Review pass) -- real
    judgment content produced by this task, not generated by a tool. 0 pre-existing audit_findings rows in
    domain=workflow (confirmed via live query) -- Phase 6 (not yet built) will add the deterministic
    status-enum transition-validator (the legality slice, e.g. 'is X->Y an allowed transition'); this
    review deliberately does NOT re-do that -- it judges whether the RIGHT side effects fire on a real
    transition, atomicity of concurrent business-critical writes, and consistency of business-rule
    enforcement across similar code paths, none of which a transition-legality validator can see."
  method: "Direct read of real approval/procurement/construction-field-workflow service files in
    compliance-tracker and the corresponding client-side route handlers in projexa, tracing each real
    status-transition function's actual side effects (DB writes, notifications, audit logging) against
    what the surrounding code's own comments/business rules claim should happen."

repos:
  compliance-tracker:
    workflow_findings:
      - id: WF-AI-001
        severity: medium
        title: "Lost-update race condition in multi-approver quorum counting"
        finding: "decideApprovalStep (approval-workflow-service.ts, lines 320-378) opens its own
          independent db.transaction per call, but the quorum counter is read-then-written in application
          code rather than atomically in SQL: `const newCount = step.approvalsReceived + 1` followed by an
          update, with no SELECT ... FOR UPDATE and no unique constraint on
          approvalWorkflowStepApprovals(stepInstanceId, approvedById) in schema.ts (lines 6596-6603). This
          matters because the same file's enforceFourEyesFloor (lines 63-72) forces requiredApprovals >= 2
          for any step matching a high-impact category -- i.e. this is the exact multi-approver code path
          the four-eyes control depends on. Two qualifying approvers deciding concurrently on a 2-of-2 step
          can both read approvalsReceived=0, both compute newCount=1, and the second commit overwrites the
          first's counter -- both approval rows get inserted (decision history looks correct) but the
          step's counter never reaches quorum, silently stalling a four-eyes-mandated approval indefinitely.
          No test in approval-workflow-service.test.ts exercises concurrent decisions."
        recommendation: "Increment approvalsReceived atomically in SQL (sql`approvals_received + 1`) or
          take a row lock (FOR UPDATE) before computing newCount."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/services/approval-workflow-service.ts (decideApprovalStep, lines 320-378; enforceFourEyesFloor, lines 63-72), src/lib/db/schema.ts (lines 6596-6603)"
      - id: WF-AI-002
        severity: medium
        title: "Reverse-auction bid/leader update is not atomic, contradicting its own code comment"
        finding: "submitAuctionBid's header comment (erp-procurement-workflow-service.ts, lines 356-360)
          states the auction's currentLowestBid/currentLeaderSupplierId 'are updated atomically with the
          bid insert'. The actual implementation (lines 429-452) does three separate, un-transacted rawDb
          round trips: read the auction, compare bidAmount against the stale currentLowestBid, insert the
          bid, then update the auction row -- with no db.transaction wrapper and no row lock around the
          read-compare-write. Two suppliers bidding concurrently below the same stale currentLowestBid can
          both pass the undercut check, both get inserted as valid bids, and whichever update commits last
          determines the recorded leader/lowest bid -- potentially recording a higher bid as the 'current
          lowest', directly contradicting the business rule this function exists to enforce."
        recommendation: "Wrap the read, undercut-check, bid insert, and auction update in a single
          transaction with SELECT ... FOR UPDATE on the auction row (or a conditional UPDATE ... WHERE
          current_lowest_bid > $bidAmount guard) so the check and write are atomic."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/services/erp-procurement-workflow-service.ts (submitAuctionBid, lines 356-360, 429-452)"
      - id: WF-AI-003
        severity: low
        title: "Construction field workflow (RFI/Submittal/Punch List) status transitions write no audit log, inconsistent with the rest of the codebase's approval workflows"
        finding: "None of the five status-transition functions in construction-field-workflow-service.ts
          (answerRfi, closeRfi, reviewSubmittal, markPunchListItemReadyForReview,
          verifyPunchListItemClosed -- lines 46-169) call logActivity, even though logActivity is imported
          and called on essentially every status change in the sibling files approval-workflow-service.ts
          (e.g. line 380) and erp-procurement-workflow-service.ts (lines 94, 121, 128, 138, 185, 197).
          construction-field-workflow-service.ts does not import logActivity at all. Concretely,
          verifyPunchListItemClosed (lines 152-169) -- which enforces a genuine business rule (blocking
          self-approval via isSelfApproval) -- still leaves zero audit trail of who verified the closure
          and when, beyond the row's own verifiedById/verifiedAt columns, unlike every comparably
          significant approval-style decision elsewhere in this codebase."
        recommendation: "Add logActivity calls to these five transitions (e.g.
          construction_submittal.reviewed, construction_punch_list_item.verified_closed) matching the
          established convention in approval-workflow-service.ts and erp-procurement-workflow-service.ts."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/services/construction-field-workflow-service.ts (lines 46-169)"

  projexa:
    workflow_findings:
      - id: WF-AI-004
        severity: low
        title: "Punch-list status transitions fire no notification, unlike punch-list creation and submittal review"
        finding: "POST /api/punch-list (creation, punch-list/route.ts line 26) calls notifyOrgMembers(...)
          after a successful create, and PATCH /api/submittals/[id] calls notifyOrgMembers(...) when
          body.action === \"review\" (submittals/[id]/route.ts line 16). But PATCH /api/punch-list/[id]/route.ts
          -- the endpoint the UI uses for the 'ready for review' and 'verified closed' status transitions
          -- only proxies to callVeridian and never imports or calls notifyOrgMembers. Org members are
          notified when a punch-list item is created, but not when it is marked ready for review or
          verified/closed -- arguably the more actionable transitions, and inconsistent with how the
          sibling submittal-review flow was wired."
        recommendation: "Call notifyOrgMembers with a new buildPunchListStatusChangedNotification builder
          (mirroring buildSubmittalStatusChangedNotification) from the punch-list PATCH handler."
        remediation_type: ai_escalation_required
        artifact_path: "src/app/api/punch-list/[id]/route.ts (lines 7-18), src/app/api/punch-list/route.ts (lines 19-32), src/app/api/submittals/[id]/route.ts (lines 8-22)"

  veda-advisors:
    workflow_findings: []
    note: "No real multi-step business workflow (approval/status-transition logic) exists in this repo to
      review -- confirmed via search for workflow/status/approval/transition-named files; only the static
      marketing site + /stage0 intake form (already covered under the ux domain review). Recorded as a
      real 0, not a silent skip."

cross_repo_summary:
  real_findings_count: 4
  severity_breakdown: {medium: 2, low: 2, info: 0}
  headline: "Both real medium-severity findings are the same class of defect in different features: a
    multi-step business-critical write (approval quorum counting; reverse-auction bid/leader tracking) that
    the code's own comments or an adjacent control (four-eyes enforcement) assume is atomic, but is
    actually a read-then-write race across un-locked, sometimes un-transacted, calls. Both low-severity
    findings are the same class in a different dimension: a status-transition code path that skips a
    side effect (audit logging; notification) its own codebase's sibling code paths already establish as
    the convention for comparable transitions. This is exactly the 'right side effects, atomicity, and
    cross-path consistency' judgment a deterministic transition-legality validator (Phase 6) structurally
    cannot perform."
