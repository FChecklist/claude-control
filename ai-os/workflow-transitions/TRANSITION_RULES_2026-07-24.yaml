  - id: erp_rfq_reverse_auction_status
    table: erpRfqReverseAuctions
    column: status
    file: src/lib/services/erp-procurement-workflow-service.ts
    declared_values: [scheduled, active, closed]
    not_a_pg_enum: "Plain text column (schema.ts:7149), no pgEnum/CHECK constraint -- value set is
      comment-documented only. Included here because it is a real status-driven workflow regardless of the
      column's own declared-type looseness."
    allowed_edges:
      - [scheduled, active]
      - [active, closed]
    writers:
      - function: createReverseAuction
        to: active
        write_line: 367
        required_from: null
        guard_style: none
        is_create: true
        note: "INSERT, not UPDATE -- deliberately bypasses the column's own 'scheduled' default to create
          auctions already-active. Not a transition (no prior row), so not flagged even though guard_style
          is none -- exempted the same way error_path writers are."
      - function: closeReverseAuction
        to: closed
        write_line: 391
        required_from: [active]
        guard_style: exclude
        guard_quote: 'if (auction.status === "closed") throw new ServiceError("Auction is already closed", 409)'
        guard_line: 388
        note: "Exclude-style guard only blocks re-closing an already-closed auction -- it does not
          positively require current status be 'active' (a hypothetical 'scheduled' auction, unreachable
          today since createReverseAuction always inserts 'active' directly, could still be closed
          directly if that ever changed). Treated as a PASS per guard_styles.exclude above, same as the gst
          cancel/confirm guards."

  - id: construction_rfi_status
    table: constructionRfis
    column: status
    file: src/lib/services/construction-field-workflow-service.ts
    declared_values: [open, answered, closed]
    allowed_edges:
