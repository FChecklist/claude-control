        note: "Declared (schema.ts:7026) but never written anywhere in src/."
      - value: converted
        note: "Declared (schema.ts:7026) but never written anywhere in src/."
    allowed_edges:
      - [draft, approved]
      - [draft, submitted]
      - [submitted, approved]
    writers:
      - function: submitPurchaseRequisition
        to: approved
        write_line: 120
        required_from: [draft]
        guard_style: require_from
        guard_quote: 'if (req.status !== "draft") throw new ServiceError("Only draft requisitions can be submitted", 409)'
        guard_line: 108
      - function: submitPurchaseRequisition
        to: submitted
        write_line: 127
        required_from: [draft]
        guard_style: require_from
        guard_quote: 'if (req.status !== "draft") throw new ServiceError("Only draft requisitions can be submitted", 409)'
        guard_line: 108
      - function: markPurchaseRequisitionApprovedFromApproval
        to: approved
        write_line: 137
        required_from: [submitted]
        guard_style: none
        note: "No status precondition found -- this is the approval-workflow completion callback (fired once
          an approval_workflow_instance reaches 'approved'), so in the current single-call-site reality it
