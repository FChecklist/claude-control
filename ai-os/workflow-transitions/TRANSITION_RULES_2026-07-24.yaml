        to: "(caller-supplied, constrained to the VALID array)"
        write_line: 104
        required_from: [pending]
        guard_style: none
        note: "The write's TARGET value is guarded (must be one of the 4 non-pending values, lines 93-94),
          but current status is never checked -- an already-'approved' or already-'rejected' submittal can
          be re-reviewed and flipped to any other value, with no record that it was overriding a prior
          decision rather than making the first one."

