        write_line: 50
        required_from: [open]
        guard_style: none
        note: "No precondition found -- an already-'closed' RFI can be re-answered (also resets
          ballInCourt to 'contractor'), silently reopening a closed item with no status change back to
          'open' recorded."
      - function: closeRfi
        to: closed
        write_line: 59
        required_from: [answered]
        guard_style: none
        note: "No precondition found -- an RFI still 'open' (never answered) can be closed directly,
          skipping the answered state the ball-in-court model assumes."

