        note: "No precondition found -- an item already 'ready_for_review' or 'verified_closed' can be
          marked ready_for_review again."
      - function: verifyPunchListItemClosed
        to: verified_closed
        write_line: 164
        required_from: [ready_for_review]
        guard_style: none
        note: "HIGHEST-VALUE finding in this file: the function's own preceding comment (lines 139-142/
          156-158) describes a field-crew-marks-done-then-separate-person-verifies sequence, and the
          self-approval guard (isSelfApproval, lines 159-161) enforces WHO can verify -- but nothing
