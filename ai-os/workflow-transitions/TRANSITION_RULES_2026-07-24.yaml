meta:
  title: VERIDIAN Workflow Status-Enum Transition-Legality Rules
  created: '2026-07-24'
  produced_by_task: task-20260724-185151-phase6-workflow-transition-validator-ai
  precedent: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phases[6].scope: 'workflow domain -- build the custom
    status-enum transition-validator script (software-only slice)'. Same hand-authored-rule-file +
    static-re-verification pattern as ai-os/dependency-cruiser/*.config.cjs (Phase 4) -- this file encodes
    WHAT the legal transition graph is (business-rule judgment, authored once from a live read of the real
    code), ai-os-scripts/audit_pipeline_workflow_transitions.py re-verifies live, every run, whether each
    writer's own current guard code actually enforces it (deterministic, zero AI in the run loop)."
  method: "Every enum/table/writer/line-number/guard-quote below was gathered via a live, read-only source
    read of compliance-tracker's src/lib/db/schema.ts + the 4 real workflow service files (not guessed,
    not copied from WORKFLOW_LOGIC_REVIEW_2026-07-24.yaml's own prose, which covers a DIFFERENT slice of
    the same functions -- side-effect/atomicity judgment, not transition legality; see
    not_duplicating_phase5 below). projexa has zero local status-bearing tables (confirmed: its own
    src/lib/db/schema.ts header comment states construction-domain data lives entirely in
    compliance-tracker; projexa's punch-list/submittal/RFI routes are thin callVeridian() proxies with no
    local write) -- this file is compliance-tracker-only, a real, honestly-documented scope boundary, not
    an oversight."
  not_duplicating_phase5: "ai-os/WORKFLOW_LOGIC_REVIEW_2026-07-24.yaml (Phase 5 AI Review) already judged
    WF-AI-001 (approval quorum counter race) and WF-AI-002 (auction bid/leader non-atomicity) -- both are
    'right side effects / atomicity of a LEGAL transition' judgment calls a transition-legality validator
    structurally cannot make. This file's findings are the opposite failure mode: a status write with NO
    static guard restricting which CURRENT status it may fire from at all, independent of atomicity. Zero
    overlap in the underlying code lines: WF-AI-001/002 are about approval-workflow-service.ts's counter
    write and erp-procurement-workflow-service.ts's un-transacted bid/leader write, neither of which this
    file's writers list includes (this file's approval_workflow_instance_status writers are
    decideApprovalStep's *status* write and advanceWorkflow, not the approvalsReceived counter or the bid
    insert)."
  guard_styles:
    require_from: "Guard throws unless current status IS one of required_from -- the strict, correct
      pattern (e.g. 'if (step.status !== \"pending\") throw')."
    exclude: "Guard throws only if current status IS a specific named value (usually the write's own
      target, an idempotency/re-entrancy guard) -- weaker than require_from (does not positively confirm
      the transition's real origin state, only blocks re-firing into the same terminal state), but real
      protection, not absent. Treated as a PASS by the validator (not flagged) -- same reasoning
      closeReverseAuction and gst import batch's cancel/confirm guards already apply consistently."
    none: "No live guard text found in the function body preceding the write -- flagged as a real
      software_fixable finding: the write is reachable from ANY current status, not just the declared
      allowed_edges' real from-state(s)."
  error_path_exemption: "A writer inside a catch block transitioning to a genuine terminal error state
    (e.g. gst_import_batch_status -> 'failed') is marked error_path: true and exempted from the
    guard-required check -- a catch handler firing regardless of which partial state preceded the error is
    the correct, standard pattern, not a legality bug."

enums:
  - id: approval_workflow_step_status
    table: approvalWorkflowStepInstances
    column: status
    file: src/lib/services/approval-workflow-service.ts
    declared_values: [pending, approved, rejected, skipped]
    unreachable_declared_values:
      - value: skipped
        note: "Declared (schema.ts:6538) but never written -- non-applicable steps are filtered out of
          applicableSteps before any step-instance row is even inserted (lines 176-192), not marked
          skipped after the fact."
    allowed_edges:
      - [pending, approved]
      - [pending, rejected]
    writers:
      - function: decideApprovalStep
        to: rejected
        write_line: 364
        required_from: [pending]
        guard_style: require_from
        guard_quote: 'if (step.status !== "pending") throw new ServiceError("This step has already been decided", 409)'
        guard_line: 332
      - function: decideApprovalStep
        to: approved
        write_line: 370
        required_from: [pending]
        guard_style: require_from
        guard_quote: 'if (step.status !== "pending") throw new ServiceError("This step has already been decided", 409)'
        guard_line: 332

  - id: approval_workflow_instance_status
    table: approvalWorkflowInstances
    column: status
    file: src/lib/services/approval-workflow-service.ts
    declared_values: [pending, approved, rejected, cancelled]
    unreachable_declared_values:
      - value: cancelled
        note: "Declared (schema.ts:6537) but never written anywhere in src/."
    allowed_edges:
      - [pending, approved]
      - [pending, rejected]
    writers:
      - function: decideApprovalStep
        to: rejected
        write_line: 365
        required_from: [pending]
        guard_style: require_from
        guard_quote: 'if (step.status !== "pending") throw new ServiceError("This step has already been decided", 409)'
        guard_line: 332
        note: "Guard is on the STEP's own status, not this instance row's status directly -- accepted as
          equivalent because decideApprovalStep only ever reaches this write while its own step is still
          pending, and a step belongs to exactly one instance. Real, but a narrower protection than a
          direct instance.status check would be -- documented, not silently treated as identical."
      - function: advanceWorkflow
        to: approved
        write_line: 291
        required_from: [pending]
        guard_style: none
        note: "No status precondition of any kind found on the instance row before this write -- correctness
          depends entirely on the caller (decideApprovalStep) only invoking advanceWorkflow when it has
          just determined no pending step remains. A second, independent code path calling advanceWorkflow
          in the future would have no structural protection against re-approving an already-rejected or
          already-approved instance."

  - id: erp_requisition_status
