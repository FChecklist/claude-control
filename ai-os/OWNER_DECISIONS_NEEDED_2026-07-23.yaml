  what: "This phase built the non-cron half of item 36: generate_task_checklist.py and
    generate_quick_reference.py now also write their generated output to real files under
    ai-os/generated/ (in addition to their existing stdout print), and generate-system-diagram.py
    was re-verified to already write a real file (ai-os/SYSTEM_DIAGRAM.md) -- so all 3 scripts now
    produce real, persisted, auto-generated output when run. What remains is making them run
    automatically instead of requiring a human/AI to remember to invoke them, e.g. a new crontab
    entry such as '0 */6 * * * /opt/veridian/scripts/run-logged.sh \"generate-task-checklist\"
    /usr/bin/python3 /opt/veridian/scripts/generate_task_checklist.py
    /opt/veridian/ai-os/MASTER_INDEX.yaml >> /opt/veridian/ai-os/logs/generate-task-checklist-cron.log
    2>&1' (mirroring the existing system-sync.py 6-hourly cadence), plus similar entries for the
    other 2 scripts."
  needed_action: "An Owner decision to authorize (or decline) adding these 3 new crontab entries.
    If authorized, a future task adds them exactly as above (or with the Owner's preferred
    schedule) and confirms via `crontab -l`."
  why_not_done_automatically: "AI_ENGINEERING_POLICY.yaml automation_scope_boundary.standing_exceptions.
    genuinely_irreversible_actions explicitly lists crontab modifications as a standing exception
    requiring Owner confirmation before execution, 'never silently automated through, regardless of
    any other directive's 100% automation framing' -- re-read live before this phase started and
    confirmed still current policy."
  status: awaiting_owner_decision

