- id: auth-log-group-permission
  raised_by_task: task-20260723-120458-gap-closing-phase5-network-security-perm
  raised_ts: '2026-07-23T12:20:00+00:00'
  title: Grant the cron/worker user read access to /var/log/auth.log for item 21 (ssh_login_anomaly_detection)
  what: '/var/log/auth.log is owned syslog:adm, mode 0640. The account every cron job and worker unit
    on this server runs as (rajat -- groups: rajat, sudo, docker; confirmed via `id`) is NOT in the adm
    group, so scripts/security-check.py (built this phase) cannot read auth.log and its SSH new-source-IP
    / failed-then-success-burst detection has no live data -- it fails open (reports the permission error,
    exits 0, still runs its other check) rather than crashing, but item 21 stays PARTIAL rather than DONE
    until this is fixed.'
  needed_action: sudo usermod -a -G adm rajat (or equivalent -- e.g. an ACL grant scoped to just this
    file if group-wide adm access is undesirable). This is a system/security permission change (broadens
    what a non-root account can read), so it was not made automatically -- it needs an explicit Owner
    decision, not an AI agent's judgment call, per this session's own 'affects shared systems / hard to
    reverse actions need confirmation' operating rule.
  why_not_done_automatically: Requires sudo, which this task's shell session does not have a password
    for (sudo -n failed with 'a password is required'), and changing account group membership is exactly
    the kind of shared-infrastructure/permission change that should go through the Owner, not get silently
    applied by an autonomous agent.
  status: awaiting_owner_decision
