meta:
  title: VERIDIAN Bounded-Context Map + Layer-Boundary Map (Phase 4 shared prerequisite artifact)
  created: '2026-07-24'
  produced_by_task: task-20260724-135839-phase4-architecture-judgment-domains-dep
  precedent: AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phases[4] -- "Author the bounded-context map and
    layer-boundary map (does not exist today) as the shared prerequisite artifact for all 3 architecture
    domains" -- this file is that artifact. Consumed by ai-os/dependency-cruiser/*.config.cjs (ddd,
    clean-architecture, enterprise-architecture rule sets) and by the enterprise-architecture AI Review
    drift-check (ai-os/ENTERPRISE_ARCHITECTURE_DRIFT_REVIEW_2026-07-24.yaml).
  method: 'Read real folder trees directly (find/ls against /opt/veridian/repos/{compliance-tracker,projexa,
    veda-advisors}/src), not invented or assumed. All bounded-context and layer names below are literal
    real folder names or literal groupings of real folder names -- zero placeholder/example content.'
  business_capability_map_note: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml's business-capability domain row
    (target_phase: Phase 5, AI Review) is explicitly co-scheduled into Phase 4 by phase 4's own
    dependency_mechanism note ('Phase 4 cannot start its bounded-context authoring until ... a first-pass
    capability map' -- resolved by running that AI Review pass EARLY, within this dispatch, not waiting for
    the separately-numbered Phase 5). The business_capability_map block per repo below IS that first-pass AI
    Review output -- real judgment content produced by this task, not a placeholder. Phase 5's own dispatch
    (per plan) covers only the REMAINING AI Review domains (ddd semantics, ux content, workflow logic,
    ai-governance judgment); business-capability itself is closed by this artifact."
  constitution_yaml_note: "The plan's ddd/business-capability rows both anticipate cross-referencing
    compliance-tracker's own CONSTITUTION.yaml module list. Checked directly this task
    (find /opt/veridian/repos/compliance-tracker -maxdepth 1 -iname 'CONSTITUTION*'): zero matches. No such
    file exists in compliance-tracker today -- a real, confirmed gap against the plan's own assumption, not
    silently worked around. The business_capability_map below is instead grounded directly in
    compliance-tracker's real src/app/(app)/<context>/ and src/app/api/<context>/ route-group folder names,
    which is the closest real, live equivalent artifact actually present in the repo."
  scope_discipline: "Same discipline Phase 2 used for OpenAPI docs (a bounded, representative slice, not
    exhaustive coverage claimed): compliance-tracker alone has 35+ real top-level route-group folders under
    src/app/(app)/ -- enumerating a hand-curated bounded-context list for every one of them is out of scope
    for one phase. Instead: (1) the business_capability_map groups ALL real observed route-group folders
    (exhaustive at the grouping level, real content, not a subset) since that grouping is cheap and honest
    to produce from a live directory listing; (2) the dependency-cruiser ddd-bounded-context rule (see
    ai-os/dependency-cruiser/ddd-bounded-context.config.cjs) is written GENERICALLY using dependency-cruiser's
    own from-path-capture-group / to-path-$1-backreference feature, so it enforces the bounded-context
    boundary between EVERY real context folder pair automatically -- it does not require hand-enumerating
    context names at all, and therefore has real, full (not sampled) coverage despite the map itself
    documenting groupings at a coarser level for human readability."

repos:
  compliance-tracker:
    stack: "Next.js/TypeScript, src/app (routes) + src/lib (application/infra code), @/* -> ./src/* tsconfig
      alias (confirmed identical across all 3 repos)."
    business_capability_map:
      standard_cited: "APQC Process Classification Framework (PCF) + TOGAF 10 Business Architecture (ADM
        Phase B) -- per this plan's own business-capability domain row."
      capabilities:
        - name: Board & Corporate Governance
          route_groups: [board-evaluation, cap-table, statutory-registers, secretarial-audit, departments]
        - name: Risk, Compliance & Fraud
          route_groups: [risks, fraud-cases, vendor-risk, contract-compliance, rbi, posh]
        - name: Legal & Litigation
          route_groups: [legal-matters, legal-opinions, litigation]
        - name: HR & Workforce Development
          route_groups: [training, leave-holiday, rewards]
        - name: IT Resilience
          route_groups: [it-dr]
        - name: Meetings, Tasks & Service Ops
          route_groups: [veri-meetings, veri-todo, tickets, voice-tickets, approvals]
        - name: AI Observability & Platform Ops
          route_groups: [ai-observability, orchestra, prompt-eval, capability-improvements, connectors,
            veri-ai]
        - name: ESG & Master Data Quality
          route_groups: [esg, mdm-quality]
        - name: Project & Vendor Delivery
          route_groups: [pms, task-duplicates]
        - name: Knowledge Management
          route_groups: [knowledge-base]
      not_covered: "Route-group folders not yet assigned a named capability above (real, honestly listed
        rather than silently dropped) -- fde, client-portal-adjacent app/(app) folders not enumerated by this
        pass, and any folder created after this task's own directory read. Extending this map to 100% route
        coverage is real follow-up work, not claimed done here."
    bounded_contexts:
      generic_rule_basis: "src/app/(app)/<context>/ and src/app/api/<context>/ -- each first path segment
        after the route-group root is treated as one bounded context by the dependency-cruiser rule (see
        ddd-bounded-context.config.cjs). src/app/api/v1/<sub>/ is treated as ONE context ('v1') by this
        first-pass rule, not decomposed into its own sub-contexts (brain, compliance, connectors,
        construction, documents, erp, notices, platform, pms, projexa, tasks) -- documented simplification,
        real follow-up work for a future phase, not claimed as fully decomposed here."
      representative_examples: [veri-meetings, training, risks, board-evaluation, pms]
    layer_boundary_map:
      interface: {glob: "^src/app/", note: "Next.js route handlers (app/api/**/route.ts) + pages (outermost
        ring -- framework/delivery-mechanism layer)."}
      application: {glob: "^src/lib/(services|engines|ai-router|ai-team|cs|gst|loops|monitors|explainability|ingest|tds)/",
        note: "Business/application logic -- real folders confirmed via src/lib listing."}
      data: {glob: "^src/lib/(schemas/|schemas\\.ts$|db/|db\\.ts$)", note: "Domain schema/persistence-model
        layer (drizzle schema + zod schemas)."}
      technology: {glob: "^src/lib/(supabase|webhooks|pdf|openapi|queries)/", note: "Infrastructure/drivers --
        external I/O and framework-adjacent plumbing."}
      shared: {glob: "^src/lib/(errors|prompt-cache)/", note: "Cross-cutting, no directional ordering
        enforced -- may be imported by any layer."}

  projexa:
    stack: "Next.js/TypeScript, src/app + src/lib, same @/* -> ./src/* alias. src/lib is materially thinner
      than compliance-tracker's (confirmed via live listing: only db/, services/, supabase/ subfolders plus
      a handful of top-level .ts utility files) -- a real, honest structural difference, not treated as
      equivalent in scale."
    business_capability_map:
      standard_cited: "APQC PCF + TOGAF 10 Business Architecture (ADM Phase B)."
      capabilities:
        - name: Finance & Accounting
          route_groups: [ar-aging, credit-notes, currencies, fiscal-years, profit-and-loss,
            profit-and-loss-by-project, trial-balance, cost-centers, sales-invoices]
        - name: CRM & Sales
          route_groups: [leads, opportunities, sales-pipeline, customers, conversations, discuss]
        - name: HR & Workforce
          route_groups: [employees, recruitment, labour-roster, timesheets, org-members]
        - name: Project & Construction Delivery
          route_groups: [change-orders, design-materials, ffe, floor-plans, mood-boards, punch-list,
            schedule, scope, submittals]
        - name: Procurement & Vendors
          route_groups: [purchase-orders, vendors, vendor-risk, products, permits]
        - name: Risk & Compliance
          route_groups: [audit-findings, risks, fraud-cases, access-review]
        - name: Knowledge & Collaboration
          route_groups: [knowledge-base, wiki, notifications, search, kpis]
      not_covered: "Same discipline as compliance-tracker -- route-groups not yet assigned are real, honestly
        unlisted, not silently folded into an existing bucket."
    bounded_contexts:
      generic_rule_basis: "Same generic src/app/(app)/<context>/ + src/app/api/<context>/ rule as
        compliance-tracker -- confirmed projexa also uses the (app) route-group convention (30+ real
        contexts under src/app/(app)/, e.g. accounting, budgets, change-orders, copilot, customers,
        dashboard, ... payroll, procurement, purchase-orders, quotations, recruitment, reports)."
      representative_examples: [payroll, customers, purchase-orders, timesheets]
    layer_boundary_map:
      interface: {glob: "^src/app/", note: "Same convention as compliance-tracker."}
      application: {glob: "^src/lib/services/", note: "Only 2 real service files exist today
        (contact-service.ts, notification-service.ts, search-service.ts) -- a materially thinner
        application layer than compliance-tracker's, honestly reflected rather than padded."}
      data: {glob: "^src/lib/db/", note: "src/lib/db/index.ts + src/lib/db/schema.ts (drizzle)."}
      technology: {glob: "^src/lib/supabase/", note: "auth-guard.ts, client.ts, get-claims-with-retry.ts,
        server.ts."}
      shared: {glob: "^src/lib/(currency|utils|project-selection|use-autogrow-textarea|veridian-client)\\.ts$",
        note: "Flat top-level utility files, no dedicated shared/ folder exists -- named explicitly rather
        than globbed loosely."}

  veda-advisors:
    stack: "Next.js/TypeScript, src/app + src/lib, same @/* -> ./src/* alias. Excluded from the PART6 7-repo
      observability layer per the plan's own meta.named_7_repos_for_part6 note, but explicitly IN SCOPE for
      this domain/tool inventory per that same note -- included here for that reason."
    business_capability_map:
      standard_cited: "APQC PCF + TOGAF 10 Business Architecture (ADM Phase B)."
      capabilities:
        - name: Founders Program
          route_groups: [founders]
        - name: India Market Vertical
          route_groups: [india]
        - name: Stage0 Cohort
          route_groups: [stage0]
        - name: Student Community
          route_groups: [students]
        - name: Veda Advisory API
          route_groups: [api/veda]
      not_covered: "None -- veda-advisors' real src/app tree is small enough (4 page sections + 1 api
        context, confirmed via live listing) that this is genuinely exhaustive, unlike the other 2 repos."
    bounded_contexts:
      generic_rule_basis: "veda-advisors does NOT use the (app) route-group convention -- its real page
        sections (founders, india, stage0, students) sit directly under src/app/. The ddd-bounded-context
        rule's from/to path pattern is written to tolerate an OPTIONAL '(app)/' segment
        (`^src/app/(?!api/)(?:\\(app\\)/)?([^/]+)/`) specifically so the SAME generic rule file, unmodified,
        covers this repo's different real folder shape rather than needing a separate veda-advisors-only
        rule file."
      representative_examples: [founders, students, api/veda]
    layer_boundary_map:
      interface: {glob: "^src/app/", note: "Same convention."}
      application: {glob: "^src/lib/services/", note: "Does not exist today (confirmed via live listing:
        src/lib contains only db.ts and utils.ts) -- an honest zero, not a placeholder folder."}
      data: {glob: "^src/lib/db\\.ts$", note: "Single-file db layer (drizzle client init), not a folder --
        real structural difference from the other 2 repos' src/lib/db/ directories."}
      technology: {glob: "^src/lib/(supabase|webhooks|pdf|openapi|queries)/", note: "Does not exist today --
        veda-advisors has no dedicated infrastructure folder beyond db.ts; honestly zero-matched by this
        layer's glob rather than invented."}
      shared: {glob: "^src/lib/utils\\.ts$", note: "Single shared utility file."}
