# ============================================================================
# CONSTRAINTS-mandated honest 19-point breakdown.
# code_enforced = a real, testable code path exists and was exercised above.
# discipline_only = no code path exists or can exist from within this task's
# scope; compliance depends on the AI/session choosing to follow the rule.
# Per this task's own CONSTRAINTS: any point with no code path behind it goes
# in discipline_only, full stop, regardless of centrality to the goal.
# ============================================================================
nineteen_point_breakdown:
  items:
  - point: 1
    text: "by default all work happening only through direct session between VERIDIAN-DEV (167.233.220.35) ... Claude Code CLI SONNET 5.0 HIGH subscription"
    classification: discipline_only
    reason: "Which session/host/subscription an AI agent runs under is an operating-environment fact this task's code cannot detect or gate -- no interception point exists inside task-gateway.py or gateway.py for 'which session issued this process'."
  - point: 2
    text: "AI will not analyze any chat given by owner in raw format ... goes to OWNER_ENGINE software ... AI will only work on that output prompt"
    classification: code_enforced
    reason: "run_owner_engine_gate() in scripts/task-gateway.py cmd_submit, real-tested above. Caveat: enforced AT the task-gateway.py submit boundary specifically -- it cannot prevent an AI from having already read raw text pasted directly into its own conversation context before ever calling submit; that upstream boundary is outside any code this task can reach."
  - point: 3
    text: "all chats given by owner will directly go to OWNER_ENGINE software ... output in .yaml/machine language ... AI can query software in machine language, get response, decide. Only if software not able to tell, ask OWNER"
    classification: code_enforced
    reason: "Gate (point 2) + scripts/prompt_gateway/query.py + the NEEDS_OWNER_CLARIFICATION decision procedure together implement this mechanically end to end, real-tested above."
  - point: 4
    text: "All discussions between software and AI is in machine language only. No english, no prose, no open ended statement."
    classification: code_enforced_partial
    reason: "ai-os/OWNER_ENGINE_MACHINE_LANGUAGE_CONTRACT_2026-07-25.yaml + query.py (built to it) + the lookup-capability retrofit are real, proven proof-of-concept enforcement. NOT applied to the dozens of other existing AI<->software subprocess calls across this codebase (task-gateway.py's own log-instruction/check-duplicate/search/query-knowledge calls, automation_rule_engine.py, auto_phase_continuation.py, etc.) -- those still return ad hoc JSON, some with free-text `reason`/`guidance` string fields. Full-codebase retrofit is a real, separate, unscoped follow-on."
  - point: 5
    text: "All discussion between software and AI to be close ended in machine language only."
    classification: code_enforced_partial
    reason: "Same as point 4 -- same schema, same proof-of-concept scope, same gap."
  - point: 6
    text: "AI will chat with OWNER in simple 1 line sentences only in english. AI will give options with a recommendation option."
    classification: discipline_only
    reason: "No code mechanism can constrain what an AI model chooses to write to the Owner in a conversational turn. The one concrete artifact this task produces toward it is the drafted, tested owner_trigger_phrase above, but the general rule ('always 1-line, always give a recommended option') is a practiced discipline, not something this codebase enforces."
  - point: 7
    text: "AI will not waste tokens in continuous commentary and discussion with the OWNER"
    classification: discipline_only
    reason: "Behavioral discipline, no code gate possible from this task's scope."
  - point: 8
    text: "AI will have specific analysis in machine language only and not waste tokens."
    classification: discipline_only
    reason: "gateway.py's real, measured token-reduction stats (e.g. 35.7%/74.1% in the tests above) are available for an AI to consult, but nothing forces the AI's own subsequent analysis to be machine-language-only or token-frugal -- that remains a practiced discipline."
  - point: 9
    text: "AI will have specific close ended input and close ended output in machine language only and not waste tokens."
    classification: discipline_only
    reason: "Same as point 8."
  - point: 10
    text: "AI will send input to its ai model only through close ended input in machine language."
    classification: discipline_only
    reason: "No interception point exists between 'the AI' and 'its own ai model' that this task's scope (task-gateway.py, gateway.py, query.py) can reach or gate -- that boundary lives inside the Claude Code harness itself, out of reach."
  - point: 11
    text: "AI will receive output for its ai model only through close ended output in machine language."
    classification: discipline_only
    reason: "Same as point 10."
  - point: 12
    text: "AI will send input to any ai model only through close ended input in machine language."
    classification: discipline_only
    reason: "Same as point 10 -- no AI-to-external-model call site exists in this task's scope to gate."
  - point: 13
    text: "AI will receive output for any ai model only through close ended output in machine language."
    classification: discipline_only
    reason: "Same as point 12."
  - point: 14
    text: "AI will send input to any software only through close ended input in machine language."
    classification: code_enforced_partial
    reason: "Same proof-of-concept scope as point 4/5: query.py's request handling + the lookup-capability retrofit's request_envelope are real code-enforced examples; not global."
  - point: 15
    text: "AI will receive output for any software only through close ended output in machine language."
    classification: code_enforced_partial
    reason: "Same proof-of-concept scope as point 14 -- query.py's response envelope + the retrofit's response_envelope."
  - point: 16
    text: "AI to AI discussion is only through close ended input and output in machine language."
    classification: discipline_only
    reason: "No AI-to-AI call site was built or retrofitted by this task -- there is no real multi-agent-to-agent machine channel in this codebase today to gate. Aspirational until such a channel exists."
  - point: 17
    text: "Software to AI input or output is only through close ended input and output in machine language."
    classification: code_enforced_partial
    reason: "Same proof-of-concept scope as points 14/15 -- this is the same requirement restated from software's side."
  - point: 18
    text: "ONLY with the OWNER the discussion is in ENGLISH. In simple 1 line sentences."
    classification: discipline_only
    reason: "No code mechanism enforces the language or line-count of what an AI writes to the Owner; same limitation as point 6."
  - point: 19
    text: "TOKEN OPTIMIZATION and TOKEN SAVING is important."
    classification: code_enforced_partial
    reason: "The OWNER_ENGINE gate itself achieves real, measured token reduction for the processing pipeline (35.7%-92.9% observed across real tests this task and the prior gateway.py integration ran). Broader 'AI-wide token discipline' beyond this specific pipeline remains a practiced behavior, not something code enforces."
  summary_counts:
    code_enforced: 2   # points 2, 3
    code_enforced_partial: 6  # points 4, 5, 14, 15, 17, 19
    discipline_only: 11  # points 1, 6, 7, 8, 9, 10, 11, 12, 13, 16, 18

