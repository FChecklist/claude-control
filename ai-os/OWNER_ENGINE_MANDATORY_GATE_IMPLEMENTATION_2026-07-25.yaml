# ============================================================================
# WHAT SHIPPED
# ============================================================================
what_shipped:
  - item: "Mandatory gate wiring in scripts/task-gateway.py cmd_submit"
    detail: >
      run_owner_engine_gate(text, session_id) pipes raw --text through
      scripts/prompt_gateway/gateway.py (--mode stdin --json-only --output <tmp>)
      whenever --source owner. This is the real default behavior, not an opt-in
      flag: there is no code path in cmd_submit where --source owner text
      reaches keyword extraction / log-instruction / check-duplicate / search /
      query-knowledge / lookup-capability unprocessed. gateway.py's
      final_output becomes `effective_text`, which is what every one of those
      calls actually receives. --source ai_agent is untouched (that text was
      never a raw owner chat, so gating it would just be reprocessing
      already-machine-directed instructions).
    raw_text_disposition: >
      The true raw owner text is not discarded -- it is preserved in
      log-instruction's --metadata (owner_engine_raw_text field) for audit,
      but the `instructions.raw_text` sqlite COLUMN itself now stores the
      gated machine-language output, i.e. it is NOT what search/classification/
      dispatch operate on.
  - item: "scripts/prompt_gateway/query.py -- machine-language query interface"
    detail: >
      New CLI: `python3 query.py --chat-id <VD-id> --q <QUERY_CODE>`. Reads the
      chat record gateway.py already saved to disk (CHATS_DIR/<chat_id>.json)
      -- zero raw-text reprocessing, zero free-prose output. 9 query codes:
      GET_CATEGORY, GET_INTENT, GET_CONFIDENCE, GET_ENTITIES, GET_MACHINE_PROMPT,
      GET_SNIPPETS, GET_TOKEN_REDUCTION_PCT, IS_CONFIDENT, NEEDS_OWNER_CLARIFICATION.
      Every response is {chat_id, query, status, answer, reason_code} --
      status is always OK / INSUFFICIENT_INFO / NOT_FOUND / ERROR.
  - item: "step_3 decision procedure -- concrete, executable, not prose"
    detail: >
      LOW_CONFIDENCE_THRESHOLD = 0.15 (ChatClassifier's own GENERAL-fallback
      confidence is a fixed 0.1; 0.15 conservatively also catches weak
      non-fallback scores) and UNKNOWN_INTENT = "UNKNOWN" (ChatClassifier's own
      literal fallback value) are the two real signals. NEEDS_OWNER_CLARIFICATION
      returns needs_owner_clarification=true iff confidence < 0.15 OR intent ==
      "UNKNOWN", with `reasons` listing which. This is the ONLY code path in
      the system that decides "software could not tell -> ask the Owner" --
      see real_test_evidence.query_interface_test below for a real run
      returning true.
  - item: "ai-os/OWNER_ENGINE_MACHINE_LANGUAGE_CONTRACT_2026-07-25.yaml"
    detail: >
      Request/response envelope schema for AI<->software (and future AI<->AI)
      machine-language calls. Proven usable by 2 real call sites: query.py
      (built to it from scratch) and task-gateway.py's retrofitted
      lookup-capability call (see next item). NOT retrofitted across the rest
      of the codebase -- named explicitly as a gap in
      not_mechanically_enforced_or_partial below, not silently claimed done.
  - item: "Retrofit: task-gateway.py's lookup-capability call site"
    detail: >
      call_machine_contract() wraps the pre-existing (task-20260724-083420)
      `superboss-register.py lookup-capability` subprocess call in the new
      envelope. The underlying command and superboss-register.py's own
      implementation are byte-for-byte unchanged -- only how task-gateway.py
      constructs the request and normalizes the response changed. Both status
      branches (OK when a capability matches, INSUFFICIENT_INFO when
      found=false) are real-tested below.

