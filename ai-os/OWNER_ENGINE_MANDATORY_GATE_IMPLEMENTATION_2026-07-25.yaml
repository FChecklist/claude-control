known_preexisting_issue_not_introduced_by_this_task:
  description: >
    extract_keywords_mechanical()'s quoted-string regex (re.findall(r"'([^']+)'", text)) matches
    everything BETWEEN any two apostrophes in the text, not just genuine quoted spans. Raw owner
    text containing contractions ("it's", "you're") triggers this and produces one long garbled
    "keyword". Confirmed pre-existing and independent of this task's changes (same regex, same
    behavior, on either raw or gated text -- this task only changed WHICH text string that
    pre-existing function receives, not the function itself). Left unfixed: out of this task's
    scope (SCOPE items 1-7 do not include fixing task-gateway.py's keyword extraction), noted
    here honestly rather than silently working around it.

