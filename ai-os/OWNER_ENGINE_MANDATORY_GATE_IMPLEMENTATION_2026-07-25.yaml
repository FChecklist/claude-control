    also_tested: "GET_CATEGORY -> status INSUFFICIENT_INFO (confidence 0.1286 < 0.15); GET_ENTITIES -> status OK, answer []; GET_CATEGORY against a nonexistent chat_id VD-NOPE -> status NOT_FOUND, reason_code CHAT_ID_NOT_FOUND, exit code 1."
