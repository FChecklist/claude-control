gateways:
  gateway_naming_gap_resolved:
    resolution: "CLOSED by phase gateway_definition_and_inventory, not by asking the Owner a fresh question
      in chat (this session is non-interactive/auto-dispatched) -- per this task's own OBJECTIVE text ('the
      Owner (or the original, uncondensed INS-20260724-053123-0e5a instruction text)'), the second option
      was checked first: the instructions table in ai-os/memory/superboss-register.sqlite (scripts/
      superboss-register.py's own live DB) still holds INS-20260724-053123-0e5a's full raw_text verbatim --
      it was never lost from the system, only from this initiative's own condensed SPEC text that Phase 0
      was dispatched with. Recovered via: python3 -c \"import sqlite3; c=sqlite3.connect('ai-os/memory/
      superboss-register.sqlite'); print(c.execute(\\\"SELECT raw_text FROM instructions WHERE
      instruction_id='INS-20260724-053123-0e5a\\\").fetchone()[0])\"."
    canonical_10_gateway_list_verbatim_from_original_instruction: "10 gateways wrap all 20 engines: G01
      Owner, G02 Engineering, G03 Organization, G04 UserChannel, G05 AI, G06 BusinessServices, G07
      DataKnowledge, G08 Integration, G09 ObservabilityAudit, G10 Infrastructure -- no component talks to
      another except through a gateway. Every gateway runs the same fixed pipeline: Authenticate->Authorize
      ->Validate->Normalize->LoadOrgContext->LoadUserContext->LoadMetadata->CapabilityLookup->PolicyEval->
      RuleEval->Decision->Execute->GenerateEvents->UpdateKnowledge->WriteAuditLog->WriteMetrics->Return."
