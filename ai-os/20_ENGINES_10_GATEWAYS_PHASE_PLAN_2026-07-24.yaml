# ============================================================================
# PHASES -- one phase per closed theme, not one phase per engine (all 20 are
# partial-with-real-prior-art, so the efficient unit of work is "unify /
# extend the real thing that exists", not "build from zero").
# ============================================================================
phases:
  - id: phase_1_capability_registry_live_wiring
    closes_engines: [3]
    closes_capability_registry_gap: true
    objective: "Wire CAPABILITY_REGISTRY_SCHEMA_2026-07-24.yaml live: a real table (extends
      ai-os/memory/superboss-register.sqlite alongside knowledge_engine, or a new Postgres table in
      compliance-tracker reusing embeddings/capability-registry-service.ts's existing indexCapability()),
      a populate script seeded from capability-tree-service.ts's real CapabilityNode tree, and
      lookupCapability() implemented per the lookup_contract -- then wire task-gateway.py (or whichever
      caller is about to construct an LLM prompt) to call it first."
    depends_on: []
    real_mechanism_reused: "capability-registry-service.ts's indexCapability()/findSimilar(),
      capability-tree-service.ts's CapabilityNode tree, scripts/superboss-register.py's
      register-knowledge/query-knowledge CLI pattern."
    status: done
    status_detail:
      produced_by_task: task-20260724-083420-phase1-capability-registry-live-wiring
      completed_on: '2026-07-24'
      what_shipped:
        - "Real 8th table `capability_registry` added to scripts/superboss-register.py's init_db() (same
          FTS5 + AFTER INSERT/UPDATE/DELETE sync-trigger + write-lock convention as the existing
          knowledge_engine table, not a new pattern) -- columns match
          capability_record_schema field-for-field (inputs/business_rules/workflow/automation/documents/
          reports/apis/ui_screens/permissions/ai_required/confidence/version/owner)."
        - "register-capability / lookup-capability / list-capabilities CLI subcommands added.
          register-capability upserts ON CONFLICT(capability_name), same living-catalog convention as
          index_add. lookup-capability implements lookup_contract.function_signature's first two
          resolution_order stages (exact capability_name match, then domain-scoped FTS keyword match) --
          the third stage (embedding similarity via capability-registry-service.ts's findSimilar()) is
          honestly reported as embedding_fallback_available=false, not faked, since that function lives in
          compliance-tracker's own TypeScript runtime and is not reachable from this Python CLI; a caller
          needing that stage calls findSimilar() directly, composing with this table rather than being
          replaced by it."
        - "ai-os-scripts/populate_capability_registry.py: reads CAPABILITY_REGISTRY_SCHEMA_2026-07-24.yaml's
          5 real, already-verified populated_capabilities rows (verified once already by
          generate_capability_registry_candidates.py against the live filesystem) and registers each via
          register-capability. Run for real against the live DB
          (/opt/veridian/ai-os/memory/superboss-register.sqlite): 5/5 registered, 0 failed."
        - "scripts/task-gateway.py's cmd_submit (the real entrypoint every task hits before AI-worker
          dispatch) now calls lookup-capability alongside its existing check-duplicate/search/
          query-knowledge calls, and surfaces capability_matches +
          capability_deterministic_path_available in its output -- the literal mechanism the Owner's
          'most engines already exist, don't duplicate with AI' instruction needed to become structurally
          enforced rather than merely documented. Live-verified: `task-gateway.py submit --text
          'need to calculate GST rate split for an interstate invoice'` on the real live DB returns
          capability_deterministic_path_available=true, capability_matches=[gst_calculation_engine]."
      real_evidence:
        - "python3 scripts/superboss-register.py init against the live DB: {\"ok\": true, \"db\":
          \"/opt/veridian/ai-os/memory/superboss-register.sqlite\"} (additive only -- pre-existing tables'
          row counts unchanged: instructions=269, work_items=80, actions=1482, knowledge_engine=46)."
        - "python3 ai-os-scripts/populate_capability_registry.py: {\"schema_rows_found\": 5,
