# ============================================================================
engine_inventory:
  - engine_no: 1
    engine_name: "Intent Engine"
    purpose: "Classify what the user/system wants to do before routing to a capability."
    exists_as:
      - repos/compliance-tracker/src/components/veri-chat/IntentCommandPalette.tsx
      - repos/compliance-tracker/src/lib/browser-intent-cache.ts
      - repos/compliance-tracker/src/components/veri-chat/ChainSelector.tsx
    verified_on_disk: true
    coverage: partial
    gap_description: "Recalls/restores a user's own past mode-pill+chain-path selections (recency/frequency ranked, IndexedDB + server-side chain-usage-ranking.ts) -- this IS real intent capture for VeriComposer, but it is recall-of-past-choice, not general free-text NLU intent classification for a new, never-seen request."
  - engine_no: 2
    engine_name: "Context Engine"
    purpose: "Carry request/session/org context through a call chain so downstream engines don't re-derive it."
    exists_as:
      - repos/compliance-tracker/src/lib/services/context.ts
      - repos/compliance-tracker/src/lib/ai-team/roster.ts
    verified_on_disk: true
    coverage: partial
    gap_description: "ServiceContext/ReadContext (orgId + actor) is real, enforced, typed context-threading for every service call -- but it is request-scoped tenant/actor context, not conversational/session memory across turns (that half is closer to Knowledge Engine's artifact relationships, see Engine 15)."
  - engine_no: 3
    engine_name: "Capability Registry Engine"
    purpose: "Single lookup a caller checks before ever considering an AI call: does a capability already exist, what are its inputs/rules/workflow/apis/permissions/confidence."
    exists_as:
      - repos/compliance-tracker/src/lib/services/capability-registry-service.ts
      - repos/compliance-tracker/src/app/api/capability-registry
      - repos/compliance-tracker/src/app/(app)/capability-registry
      - repos/compliance-tracker/src/lib/loops/capability-index-freshness-audit.ts
    verified_on_disk: true
    coverage: partial
    gap_description: "Real, live, embedding-based duplicate/similarity index (Wave 43) over 5 entity types (worker_agent, automation_rule, module, prompt_pattern, dynamic_chain) with a recurring freshness-audit loop -- this answers 'does something similar already exist' via vector search. It does NOT carry the PART4 field set (business_rules/workflow/automation/documents/reports/apis/ui_screens/permissions/ai_required/confidence/version/owner) as structured columns -- that richer schema is this task's own deliverable (CAPABILITY_REGISTRY_SCHEMA_2026-07-24.yaml), designed to sit ON TOP of indexCapability()/findSimilar() as the embedding layer underneath, not replace it. This is the single most important finding of this inventory: the 'most important missing piece' PART4 warned about is 60% already built under a different name, and the real gap is schema richness, not existence."
  - engine_no: 4
    engine_name: "Planning Engine"
    purpose: "Turn an objective into a bounded, sequenced, validated plan before execution."
    exists_as:
      - repos/compliance-tracker/src/lib/task-tightening.ts
      - repos/compliance-tracker/src/lib/services/dynamic-chain-directory-service.ts
    verified_on_disk: true
    coverage: partial
    gap_description: "task-tightening.ts enforces a mandatory objective/scope/success-criteria envelope before any AI Workforce dispatch (rejects a loose free-text brief); dynamic-chain-directory-service.ts does keyword-ranked chain-path recommendation. Neither generates a novel multi-step plan/DAG from a goal -- both validate or recommend from an already-known, finite set of paths."
  - engine_no: 5
    engine_name: "Policy Engine"
    purpose: "Gate actions against standing policy before they execute."
    exists_as:
      - scripts/preflight-guard.py
      - ai-os/OWNER_DECISIONS_NEEDED_2026-07-23.yaml
      - repos/compliance-tracker/src/lib/policy-enforcement-engine.ts
    verified_on_disk: true
    coverage: partial
    gap_description: "preflight-guard.py gates server-side task dispatch (resource/crontab/scope checks); policy-enforcement-engine.ts is a deterministic pre-LLM-call gate (personal-use/prompt-injection/out-of-domain categories) in compliance-tracker. Both are real, enforced gates -- but two separate policy engines with no shared schema or single point of truth, and neither covers the other's domain (server ops vs in-app LLM calls)."
  - engine_no: 6
    engine_name: "Rule Engine"
    purpose: "Evaluate named business rules against inputs/outputs deterministically."
    exists_as:
