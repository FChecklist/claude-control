        every AI task dispatched server-side, cron-invoked, referenced throughout this session's own
        KNOWN_CONTEXT as partial Workflow Engine (8) + Automation Engine (9)."
      superseded_finding: "Now that the real 10-gateway list is known (G01-G10 above), this phase's own
        investigation (see gateway_inventory below) confirmed task-gateway.py is NOT a match for any of
        G01-G10 -- it is a task/workflow lifecycle CLI (submit/start/log/close), architecturally distinct
