    verified_on_disk: true
    coverage: partial
    gap_description: "Real PDF generation, a standalone Python doc-processing microservice, and an LLM-Vision-based OCR/extraction service (document-extraction-service.ts) all exist and are live. document-processing-engine.ts itself is thin (barcode-decode contract + exact-hash dedup only) -- most of the real work lives in the two files it explicitly defers to."
  - engine_no: 12
