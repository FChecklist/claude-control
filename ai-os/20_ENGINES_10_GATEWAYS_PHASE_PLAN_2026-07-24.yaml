      - repos/compliance-tracker/src/lib/guardrail-registrations.ts
      - repos/compliance-tracker/src/lib/business-rule-validator.ts
    verified_on_disk: true
    coverage: partial
    gap_description: "Wave 157 guardrail-engine.ts is a real, generic, opt-in rule framework (input/process/output/logic phases per capability-tree leaf) wired as a genuine pre-execution gate via assertBusinessRulesBeforeExecution(). Starts EMPTY by design -- only a handful of leaves are actually registered today (GST rate bounds, EMI/loan bounds, gratuity/commission bounds), so the engine exists and is real, but coverage across the ~100 real capability-tree leaves is shallow."
  - engine_no: 7
