  - from: Capability Registry Engine (3)
    to: Rule Engine (6)
    mechanism: "planned -- capability_record_schema.business_rules field populated directly from
      guardrail-registrations.ts lookups by leaf_key, no new rule-storage mechanism needed."
    status: planned
  - from: Capability Registry Engine (3)
    to: Decision Engine (7)
    mechanism: "planned -- ai_required + confidence fields inform risk-tier.py's routing decision (AI vs
      deterministic path) once Phase 2 wires risk-tier.py to query the registry via the same
      query-knowledge-style CLI pattern scripts/superboss-register.py already establishes."
    status: planned
  - from: Workflow Engine (8)
    to: Automation Engine (9)
    mechanism: "live -- scripts/task-gateway.py's close step already triggers/feeds
      automation-progress-audit.ts's recurring health loop over automation_rule capability rows."
    status: live
  - from: Metadata Engine (14)
    to: Knowledge Engine (15)
    mechanism: "live -- knowledge_engine (ai-os/memory/superboss-register.sqlite) IS the queryable half of
      the Metadata Engine; MASTER_INDEX.yaml's registries: section is the hand-edited half. Same table,
      already shared."
    status: live
  - from: Document Engine (11)
    to: Notification Engine (12)
    mechanism: "planned -- doc-processing completion (services/doc-processing) should call
      scripts/notify-owner.py or the in-app app/api/notifications route on failure; no such call site
      exists today (confirmed absent by grep)."
    status: planned
  - from: Integration Engine (10)
    to: Automation Engine (9)
    mechanism: "planned -- an inbound webhook receiver (new, does not exist today) would call
      scripts/task-gateway.py submit for the matching automation_rule capability row; today only outbound
      webhook-deliver.ts exists, so this edge has no real mechanism yet."
    status: planned
  - from: Audit Engine (19) / Observability Engine (20)
    to: all engines above
    mechanism: "external dependency -- ai-os/AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml's own phases (not
      re-planned here) will eventually instrument every engine above via its PART6 OpenTelemetry/pgAudit
      layer. Not built by any phase in this document."
