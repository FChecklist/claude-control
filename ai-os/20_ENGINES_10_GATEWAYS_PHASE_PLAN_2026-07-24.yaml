      - repos/compliance-tracker/src/lib/webhooks
      - repos/compliance-tracker/src/lib/monitors/webhook-delivery-outcome-monitor.ts
    verified_on_disk: true
    coverage: partial
    gap_description: "Real outbound webhook delivery + a recurring delivery-outcome monitor exist. No inbound connector/iPaaS framework -- confirmed zero n8n/Kong/similar dependency in any of the 3 repos (same package.json read AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml already did for its own tool inventory, reused here rather than re-run)."
  - engine_no: 11
    engine_name: "Document Engine"
    purpose: "Generate, extract, and process documents (PDF/OCR/templates)."
