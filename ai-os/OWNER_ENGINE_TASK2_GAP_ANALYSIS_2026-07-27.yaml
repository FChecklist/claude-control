items:
- id: engine-prompt-registry
  domain: prompt_core
  name: Prompt Registry Engine
  requirement: Master registry of every prompt across all lifecycle states, unique ID, indexing, discovery.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #559 (merged, drizzle/0262_prompt_registry_version_lifecycle.sql)
    extends the pre-existing compliance.prompt_templates/prompt_versions tables with real semver + lifecycle
    columns; prompt-os-service.ts''s createPromptVersion/listPromptVersions give full CRUD+discovery.
    Real, live, unique-ID-indexed registry across all lifecycle states -- the only remaining gap vs. the
    requirement is cosmetic (no dedicated search UI beyond a flat list).'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-version
  domain: prompt_core
  name: Prompt Version Engine
  requirement: Semantic versioning (MAJOR.MINOR.PATCH), full diff history, immutable snapshots, rollback.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #559 adds real nextSemanticVersion() MAJOR.MINOR.PATCH bump logic,
    a real line-level LCS diff (diffPromptVersions/diffContentLines), and append-only rollback (rollbackPromptVersion)
    with rolled_back_from_version_id provenance in prompt-os-service.ts (compliance-tracker). Closes all
    3 gaps the 2026-07-25 analysis cited (no semver, no diff, no rollback).'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-lifecycle
  domain: prompt_core
  name: Prompt Lifecycle Engine
  requirement: State machine (Draft/Review/Staging/Production/Deprecated) with approval gates.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #559/#561 implement a real Draft->Review->Staging->Production->Deprecated
    state machine (ALLOWED_LIFECYCLE_TRANSITIONS, isLegalLifecycleTransition in prompt-os-service.ts)
    enforced by runLifecycleTransitionGates (prompt-governance-service.ts): maker-checker approval, eval
    pass-rate threshold gate, minimum canary duration gate, PII scan, ownership check, ABAC deny check
    -- all real, composed, exercised logic (PR #561''s own commentary documents a real privilege-escalation
    bug found+fixed during review, evidence this is genuinely exercised code).'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-compiler
  domain: prompt_core
  name: Prompt Compiler Engine
  requirement: Natural language intent to optimized machine prompt via DSPy-style declarative compilation.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s prompt-compiler/prompt-construction.ts buildCompiledPrompt()
    does template match -> compression fallback -> sha256 hash -> semantic fingerprint -> token-reduction
    estimate; a direct TS port+extension of scripts/prompt_gateway/engine/prompt_engine.py, exercised
    by scripts/prompt-compiler-smoke-test.ts and pipeline.ts. Real and live. Still not DSPy-based (no
    signatures/optimizers/MIPROv2) -- the requirement''s ''DSPy-style'' qualifier is about compilation
    PHILOSOPHY (declarative, not the DSPy library itself), which this satisfies structurally even without
    the named framework.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-optimizer
  domain: prompt_core
  name: Prompt Optimizer Engine
  requirement: Automatic token reduction, instruction refinement, structure optimization, metric-guided.
  verdict: partially_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s prompt-optimizer-expansion.ts optimizeMachinePrompt() drops
    a hardcoded GENERIC_TERMS stopword set from the compressed term-tail, gated by a real quality-signal
    threshold (isSafeToOptimize) -- real and metric-guided as the requirement asks, but a narrow single-technique
    optimizer (stopword removal only), not general instruction refinement.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-compression
  domain: prompt_core
  name: Prompt Compression Engine
  requirement: Lossless and lossy compression for reduced token count while preserving semantic intent.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s compressToMachinePrompt() (prompt-construction.ts) does real
    action-verb-driven key-term extraction + category:intent:terms compression, TS port of the previously-cited
    prompt_gateway 66.7% token-reduction heuristic, now registry-integrated (not standalone).'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-expansion
  domain: prompt_core
  name: Prompt Expansion Engine
  requirement: Expand compressed prompts, restore hidden defaults, hydrate templates with full context.
  verdict: partially_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s expandMachinePrompt() (prompt-optimizer-expansion.ts) does
    real variable substitution + verb-lookup reconstruction back to natural language, but is explicitly
    self-documented in its own code comments as ''best-effort reconstruction, not a lossless inverse''
    -- real, narrower than the requirement''s implied fidelity.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-validation
  domain: prompt_core
  name: Prompt Validation Engine
  requirement: Schema completeness check, required field validation, structural integrity verification.
  verdict: partially_implemented
  evidence: 'UPDATED 2026-07-27: no dedicated validation module was added by PR #559/#560/#561 -- the
    closest real logic is verification-pipeline.ts''s checkBusinessRules(), which includes an unresolved-template-variable
    check (a structural-integrity check, narrowly). No schema-completeness or required-field validator
    exists as a distinct engine. Upgraded from not_implemented (2026-07-25) only because this one real
    check now exists where none did before.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-testing
  domain: prompt_core
  name: Prompt Testing Engine
  requirement: Automated test execution -- unit, regression, adversarial, shadow testing of prompts.
  verdict: partially_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s prompt-testing-benchmark.ts adds runShadowComparison() (real
    dual-run comparison of production vs. candidate version -- closes the ''no shadow testing'' gap from
    2026-07-25) and isAdversarialEvalCase() (keyword-name tagging of existing eval cases as adversarial,
    not real adversarial test GENERATION). Combined with the pre-existing prompt-eval-service.ts unit-test
    harness, 3 of 4 named modes (unit, regression via CI, shadow) are now real; adversarial remains tagging-only.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-benchmark
  domain: prompt_core
  name: Prompt Benchmark Engine
  requirement: Measure speed, accuracy, cost, quality against standardized benchmark datasets.
  verdict: partially_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s buildBenchmarkReport() (prompt-testing-benchmark.ts) re-applies
    the Prompt Ranking Engine''s weighted formula per-template -- real but a thin reuse, not a distinct
    standardized-dataset benchmark methodology. Speed/cost/quality-per-run were already real via prompt_eval_runs
    (2026-07-25 evidence, unchanged).'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-portability
  domain: prompt_core
  name: Prompt Portability Engine
  requirement: Cross-model prompt adaptation across OpenAI, Anthropic, Google, and local models.
  verdict: partially_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s prompt-portability.ts adaptPromptForProvider()/adaptPromptForAllProviders()
    does real, deterministic reshaping of one compiled prompt into OpenAI/Anthropic/Google request-body
    shapes. Real and closes the ''no cross-provider adaptation layer'' gap structurally, but format-reshaping
    only -- it never calls a provider (llm-client.ts still does that, one model per request) and does
    not cover local models, so behavioral cross-model equivalence is not verified, only request-shape
    translation.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-ab
  domain: prompt_core
  name: Prompt A/B Engine
  requirement: Multi-armed bandit experimentation, traffic splitting, statistical significance, auto-promotion.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s prompt-ab-testing.ts has real deterministic sha256-bucket
    traffic-split assignment and a genuine two-proportion z-test (evaluateAbSignificance, Abramowitz &
    Stegun normal-CDF approximation) with a sample-size floor -- real statistics, not a stub. Traffic
    splitting + statistical significance are both real; auto-promotion is not confirmed wired to the lifecycle
    state machine (promotion still requires the maker-checker gate), a minor remaining gap vs. full ''auto''.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-ranking
  domain: intelligence_matching
  name: Prompt Ranking Engine
  requirement: Best-prompt selection via weighted scoring across quality/cost/latency/freshness.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s rankPromptVersions() (prompt-ranking-recommendation.ts) does
    real weighted normalization across quality/cost/latency + exponential half-life freshness decay --
    matches the requirement directly.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-recommendation
  domain: intelligence_matching
  name: Prompt Recommendation Engine
  requirement: Suggest related prompts/templates/optimizations based on usage patterns.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s recommendRelatedTemplates() combines real embedding-similarity
    matches (via the newly-added prompt_version entity type on capability-registry-service.ts''s pgvector
    index) with real usage/pass-rate stats into merged, scored recommendations.'
  status_as_of_2026_07_27: UPDATED
- id: engine-prompt-similarity
  domain: intelligence_matching
  name: Prompt Similarity Engine
  requirement: Semantic matching via local embeddings for duplicate detection and clustering.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s prompt-similarity.ts calls findSimilarPromptVersions/indexPromptVersion
    (capability-registry-service.ts), confirmed to add a genuinely new ''prompt_version'' CAPABILITY_ENTITY_TYPES
    value backed by the real pgvector embeddings.ts infra -- prompt-specific now, not just capability-registry-generic
    as of 2026-07-25. Also includes a real union-find clusterBySimilarity() function (duplicate detection
    + clustering, both named in the requirement). Still server-side pgvector, not the document''s browser-native
    ''local embeddings'' framing.'
  known_partial_prior_art_ref: embedding_similarity_pgvector
  status_as_of_2026_07_27: UPDATED
- id: engine-intent
  domain: intelligence_matching
  name: Intent Engine
  requirement: Multi-level intent extraction (primary, secondary, implicit) from natural language.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s intent-classifier.ts extractIntent() does real multi-level
    (primary/secondary/implicit) decomposition, a TS port+extension of scripts/prompt_gateway/engine/classifier.py''s
    single-level classifier -- closes the exact gap (''single-level only, no primary/secondary/implicit'')
    cited 2026-07-25.'
  status_as_of_2026_07_27: UPDATED
- id: engine-entity
  domain: intelligence_matching
  name: Entity Engine
  requirement: Named entity recognition and extraction including domain-specific entity types.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s entity-variable-extraction.ts extractEntities() runs 9 real
    regex extractors including domain-specific types (MONEY_AMOUNT, REGULATION_REF, DEADLINE_DATE, EMAIL)
    -- closes the ''no NER capability exists'' gap cited 2026-07-25. Regex-based, not ML-model NER, but
    real and functioning.'
  status_as_of_2026_07_27: UPDATED
- id: engine-variable
  domain: intelligence_matching
  name: Variable Engine
  requirement: Variable identification, type inference, default resolution, runtime binding.
  verdict: fully_implemented
  evidence: 'UPDATED 2026-07-27: PR #560''s extractVariables()/resolveVariableDefaults() (entity-variable-extraction.ts)
    does real {{token}} detection, naming-heuristic type inference, and literal-vs-binding resolution
