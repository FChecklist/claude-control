module_boundary_sources:
  compliance-tracker:
    source: compliance.module_registry
    source_detail: >
      A real Postgres table (drizzle/0017_wave20_module_registry_and_product_branches.sql
      onward, "module reusability") that the product itself already uses at
      runtime (src/lib/services/module-registry-service.ts) to gate which
      modules a product branch has enabled. Not an invented taxonomy -- this
      is the repo's own module concept, checked for first per KNOWN_CONTEXT
      before deriving anything mechanically. Extracted by parsing the real
      INSERT INTO compliance.module_registry statements across ~30
      drizzle/*.sql migration files (never hand-typed), deduped by
      module_key. 110 real modules found.
    fallback_used: false
  projexa:
    source: src/app/api/<x>/ directory structure
    source_detail: >
      No module_registry-equivalent table exists in this repo (checked live:
      no `module_registry`/`moduleRegistry` hit anywhere under drizzle/ or
      src/, and neither PROJEXA_GAP_ANALYSIS.md nor PROJEXA_TASK_GOVERNANCE.md
      names an explicit module taxonomy beyond prose). Falls back to the
      KNOWN_CONTEXT-sanctioned mechanical derivation: each top-level
      src/app/api/<x>/ directory is one real module boundary. 79 real
      directories found.
    fallback_used: true

file_discovery_method: >
  Per module, scripts/module_gap_audit_lib.py unions two real, mechanical
  signals over `git ls-files`: (1) a filename-substring match (the same
  technique generate_chatgpt_audit_request.py's original DOMAIN_KEYWORDS
  search already used), and (2) a `git grep -lI` content match for the
  module's snake_case, kebab-case, and camelCase identifier variants (needed
  because compliance-tracker's module_key/table_name are DB identifiers that
  show up as camelCase in TS source, e.g. board_meetings -> boardMeetings --
  a filename-only match misses these entirely). SQL matches are narrowed to
  the module_registry seed migration plus the migration that actually
  CREATEs the module's table (checked live per file) -- otherwise a table
  name appearing in one unrelated ALTER/seed/comment line elsewhere would
  pull that whole unrelated migration's business logic in as noise. A single
  monolithic shared file (verified case: src/lib/db/schema.ts, 10709 lines --
  defines every table in the app, not just one module's) is excluded from
  auto-discovery above a fixed size ceiling (1500 lines / 60000 bytes) so one
  module's request isn't dominated by hundreds of unrelated tables; it
  remains available via --files if the Owner wants it explicitly. Never a
  hand-typed file list, never a fabricated path -- a module with zero real
  matches falls back to real repo-overview docs (PLATFORM_STRATEGY.md etc.,
  existence-checked) with used_fallback_docs: true, exactly like the
  original domain mode.

batching_and_chunking_rule: >
  Reference ceiling per single request, per KNOWN_CONTEXT: ~400 lines /
  ~20KB combined pasted content (same order of magnitude as the working
  Security request, 19574 bytes). scripts/module_gap_audit_lib.py's
  pack_into_chunks() greedily packs a module's real files (in deterministic
  sorted order) into request-sized chunks bounded by this ceiling -- whole
  files only, NEVER split or truncated mid-file. When adding the next file
  would exceed either bound, the current chunk closes and a new numbered
  part begins (Module-<repo>-<module>-request-<ts>-partNofM.txt; the
  -partNofM suffix is omitted when a module fits in a single request). A
  single file that alone exceeds the ceiling still gets its own solo chunk,
  in full -- SCOPE item 2 forbids silent truncation, not an oversized
  outlier chunk. This is the exact same function used both to actually
  generate request files and to compute
  MODULE_GAP_AUDIT_MODULE_LIST's chunk_count_for_full_coverage per module,
  so the "real total request-file count" below is not a separate estimate --
  it is the real output of the real chunking code, summed.

