owner_procedure: >
  Identical, simple procedure already proven for the Security domain --
  nothing new to learn, just a --module flag instead of --domain:
  1. Open a request file under /opt/veridian/chatgpt-audit/_pending_requests/
     (e.g. Module-compliance-tracker-erp_cash_management-request-<ts>.txt).
  2. Copy everything below its '===== COPY BELOW THIS LINE =====' marker
     into a new, free ChatGPT or Z.AI web chat session (no API key needed).
  3. Save the model's full response (YAML only) to a file.
  4. Run: python3 scripts/ingest_chatgpt_audit_response.py --module <module_key>
     --repo <repo> --file <response-file>
     (this validates the record against CHATGPT_AUDIT_RECORD_SCHEMA, allocates
     a real audit_id, writes it under /opt/veridian/chatgpt-audit/Modules/,
     and refreshes the master catalogue -- exactly the same mechanism that
     already produced AUDIT-000008/9/10 for the Security domain).
  5. To generate the next module's request(s), run:
     python3 scripts/generate_chatgpt_audit_request.py --module <module_key>
     --repo <compliance-tracker|projexa>
     (pick any module_key from ai-os/MODULE_GAP_AUDIT_MODULE_LIST_2026-07-25.yaml's
     repos.<repo>.modules[] -- every module in that list is real and ready to
     generate on demand; this task deliberately did not pre-generate all
     1195 request files, per CONSTRAINTS).

honest_scope_statement: >
