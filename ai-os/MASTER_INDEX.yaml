- id: worker_fleet_rca_fix_2026_07_20
  type: rca_and_permanent_fix
  scope: Root-causes and permanently fixes the 47-failed-unit/71.9%-task- failure-rate
    incident surfaced by registries.auto_execution_wrapper's first real health-check-15min.py
    run. Not the same incident as RCA_OVERNIGHT_DISPATCH_FAILURE_2026-07-20.md (that
    RCA is about the dispatch LOOP not firing overnight due to a laptop-bound Claude
    Desktop scheduled task; this RCA is about dispatched tasks failing downstream
    once running). Both concern the same overnight window, different mechanisms, cross-referenced
    here to prevent conflation.
  root_cause_1: OpenRouter account genuinely exhausted (total_credits=$40, total_usage=$40.07+,
    confirmed via OpenRouter's own /api/v1/credits endpoint -- ground truth, not this
    proxy's internal tracker). preflight-guard.py's existing check_proxy_health()
    only tracked the LOCAL proxy's own cumulative spend counter, which had drifted
    out of sync with the real account. Every worker's cheap 5-token canary call kept
    passing preflight (cheap enough to still succeed near-zero balance); the real
    task prompt (up to 64000 max_tokens) then hit a live OpenRouter 402, which systemd
    retried 3x per unit into a permanent failed state -- across at least 47 units.
  root_cause_1_deeper_bug: '`claude -p --output-format json` returns process exit
    code 0 even when the underlying API call failed (error captured only inside the
    JSON payload as is_error:true / api_error_status:402). This silently bypassed
    worker-entrypoint.sh''s entire `if [ "$EXIT_CODE" -ne 0 ]` failure path -- no
    failure signature was ever recorded, so preflight-guard.py''s own circuit breaker
    (2 identical signatures trips it) had zero data to trip on despite 3 real, identical
    failures per unit. Confirmed directly: .failure_signatures.json did not exist
    for a sample failed task.'
  root_cause_2: 'A genuinely SEPARATE, second root cause found for 2 of the 47 units
    (deliberately not assumed to share root_cause_1 -- verified via recover-failed-workers.py
    reading each unit''s real result.json before touching it): these 2 legitimately
    hit the Claude CLI''s own --max-budget-usd $10 per-task cap (terminal_reason:budget_exhausted,
    real ~$10.05-10.32 costs, 42-55 real turns) -- a guardrail working as designed,
    but worker-entrypoint.sh fell through to the same generic retry-storm path as
    any other failure instead of a clean hard-stop.'
  fix_1: 'preflight-guard.py: new check_openrouter_balance() function queries https://openrouter.ai/api/v1/credits
    directly (ground truth, cannot drift). Fails OPEN on any network/parse error on
    the check itself (never blocks real work over a check hiccup); fails CLOSED (hard
    stop, no API call made) if real remaining balance < $0.10. Ops-layer twin of the
    app-layer checkOpenRouterBalance() in cost-policy.ts. Wired into main() between
    check_proxy_health() and canary_call().'
  fix_2: 'worker-entrypoint.sh: (a) added "openrouter_balance_exhausted" to the hard-stop
    (non-retryable) reason list; (b) added an API_IS_ERROR detection block right after
    the main claude -p invocation that reads $MAIN_OUT''s own is_error field and forces
    EXIT_CODE=1 when true despite the process''s own exit 0, closing the deeper bug
    above; (c) enhanced record_failure_signature() to also hash result.json''s real
    API error text, not just worker.log (which is empty for this failure class); (d)
    added a second, distinct hard-stop block detecting subtype==error_max_budget_usd
    / terminal_reason==budget_exhausted in $MAIN_OUT, routing to checkpoint(status=blocked)
    + best-effort git commit/push of whatever progress existed + systemctl --user
    disable + explicit kill/wait of the background checkpoint loop + exit 0 -- no
    retry, since a retry would very likely spend another full $10 hitting the identical
    wall.'
  fix_3_recovery_script:
    path: /opt/veridian/scripts/recover-failed-workers.py
    scope: 'Converts veridian-worker@ units stuck in systemd''s permanent failed state
      (pre-dating the fixes above) into an accurate blocked state via the now-fixed
      preflight guard. Safety: reads each unit''s REAL result.json before touching
      it -- only resets+starts units confirmed to match the 402-balance pattern (string
      match on api_error_status:402), explicitly does NOT touch veridian-docworker@
      units (different template, different entrypoint, --no-proxy mode) or any unit
      whose result.json doesn''t match, printing those separately for manual review
      rather than assuming one cause explains everything.'
  deployed_and_verified: 'Both worker-entrypoint.sh fixes deployed live (2 backups
    taken: .bak-2026-07-20-rca before fix_2a/b/c, a second implicit backup via the
    same pattern before fix_2d). Fix 1+2a/b/c verified via one real live systemd unit
    reset+restarted, reaching a clean blocked state instead of retry-storming. Fix
    2d verified via both previously-excluded max-budget-usd units, reset+restarted,
    both confirmed status:blocked, service disabled cleanly, zero retry-storm. recover-failed-workers.py
    dry-run confirmed 44/46 as 402-pattern (2 correctly excluded, matching root_cause_2)
    before running for real: all 44 recovered. Final state 2026-07-20T11:2x: 0 failed
    veridian-worker@ units remain (down from 47); OpenRouter balance itself still
    exhausted ($-0.07 remaining as of this check) so the 44+2=46 recovered units now
    correctly sit in blocked state with an accurate diagnostic, not a dead unexplained
    failure.'
  correction_2026_07_20_audit_round_2: 'This entry originally claimed here (and in
    audit_log pass 11) that recovered units "will resume automatically once credits
    are added, no further code change needed." VERIFIED FALSE on audit: queue-dispatcher.py''s
    retry logic (TERMINAL_BAD handling in sync_dispatched_statuses()) only re-touches
    gap_queue.yaml items still in ''dispatched'' status -- 21 of the 46 recovered
    tasks were already marked stuck_needs_human (a terminal state it never revisits)
    BEFORE this pass''s recovery, and the other 25 were never tracked in gap_queue.yaml
    at all (dispatched via a different, one-off mechanism). Neither group would have
    resumed on its own. Corrected by building registries.system_sync_mechanism.checks.resume_balance_blocked_check,
    which operates directly on CONTROLLER.yaml/systemd instead of gap_queue.yaml''s
    narrower tracking, so it covers both groups uniformly. That check now makes the
    original claim actually true going forward (verified via a monkeypatched-balance
    dry-run: correctly identified all 47 balance-blocked tasks as resumable, took
    no action in dry-run mode as designed).'
  known_gap_not_fixed_this_pass: doc-worker-entrypoint.sh (separate script, veridian-docworker@
