    - veridian-brain (1-file stub SDK package, not a real product)
    - global-revenue-engine (empty repo, .git only)
    - sumeet-spec (single spec .md file, no code)
self_use_task_checklist:
  purpose: 'The one prompt this session (or superboss) reads before and after every
    task, regardless of size. Generated by ai-os/scripts/generate_task_checklist.py
    -- re-run after any registries: edit that changes one of the paths cited in the
    evidence fields below, do not hand-edit this block.'
  structure_note: 'Restructured 2026-07-23 (per the "EXECUTION_RULES_AUDIT_2026-07-23"
    analysis''s roadmap_next_phases.pre_execution_checklist_automation -- that analysis
    was never persisted as a real file on disk, corrected 2026-07-24 task-20260724-033446)
    to mirror VERIDIAN_EXECUTION_RULES_2026-07-23.md Part 39''s A-J, 77-item structure
    one-for-one. Every item carries a status: REAL (a real mechanism backs it today,
    cited in evidence), NOT_YET_AVAILABLE (a real, honestly-documented gap), or NOT_MECHANICALLY_TESTABLE
    (an inherent judgment/discipline item, same honest category ai-os/scripts/veridian_self_check.py
    already uses for its own rule_5). Nothing is silently dropped.'
