  cross_links:
    variable_dictionary: 'ai-os/VARIABLE_DICTIONARY_2026-07-24.yaml -- this schema''s Variables column
      REUSES that dictionary''s `<Entity.Attribute>` placeholder convention verbatim (e.g.
