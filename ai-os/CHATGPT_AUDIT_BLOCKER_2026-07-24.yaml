  There is no OPENAI_API_KEY to fabricate or silently substitute, and the
  Owner asked specifically for ChatGPT; routing this through Claude, GROQ, or
  OpenRouter instead without saying so would be exactly the kind of silent
  model substitution this session's "no lying" rule forbids. The Owner's real
  decision (this task) is to use ChatGPT's free web session manually instead
  of supplying a paid API key -- this is the resolution, not a workaround.

