what: >
  All ChatGPT Audit Workspace infrastructure is built and verified live:
  /opt/veridian/chatgpt-audit/ (23 domain subfolders), scripts/chatgpt_audit_guard.py
  (mechanical write-scope enforcement -- --test-path/write both verified live
  against real production and lookalike-prefix paths), scripts/chatgpt_audit_versioning.py
  (real incrementing audit_id + never-overwrite filename allocation),
  ai-os/CHATGPT_AUDIT_RECORD_SCHEMA_2026-07-24.yaml (the audit record schema), and
  scripts/generate_chatgpt_audit_index.py (machine-generated
  ai-os/CHATGPT_AUDIT_MASTER_CATALOGUE_2026-07-24.yaml + local searchable index). Full
  detail: registries.chatgpt_audit_workspace in ai-os/MASTER_INDEX.yaml.

  RESOLUTION (2026-07-24, task-20260724-214215-chatgpt-manual-bridge-workflow): the
  Owner made a real, final decision on this blocker -- no OPENAI_API_KEY will be
  supplied. Instead, a manual-bridge workflow is now live: the Owner copies a
  script-generated request into a free ChatGPT web session by hand, then saves
  the pasted-back response for a script to parse, validate, and write
  version-safe through the existing guard/versioning infrastructure. See
  how_to_run_it below for the exact commands. This replaces the
  awaiting_owner_decision state below (kept for history) -- the API-key path is
  not being pursued for this workspace.

how_to_run_it:
  step_1_generate_request: >
    python3 scripts/generate_chatgpt_audit_request.py --domain <Domain>
    (one of the 23 domain subfolders, e.g. Security) -- discovers real,
    git-tracked files for that domain in the target repo (default
    compliance-tracker, override with --repo), embeds their real content plus
    the real commit hash/branch, and writes a ready-to-copy request .txt to
    /opt/veridian/chatgpt-audit/_pending_requests/<Domain>-request-<ts>.txt via
    scripts/chatgpt_audit_guard.py's guarded_write.
  step_2_owner_manual_action: >
    The Owner copies everything below the "COPY BELOW THIS LINE" marker in
    that .txt file into a new, free ChatGPT web session, and saves ChatGPT's
    full YAML reply to a file.
  step_3_ingest_response: >
    python3 scripts/ingest_chatgpt_audit_response.py --domain <Domain> --file
    <saved-response-file> (or pipe the response via stdin) -- validates every
    required ai-os/CHATGPT_AUDIT_RECORD_SCHEMA_2026-07-24.yaml field, allocates
    a real audit_id + never-overwritten path via
    scripts/chatgpt_audit_versioning.py (audit_id/timestamp are always
    allocated fresh here, never trusted from ChatGPT's own output), writes the
    record through scripts/chatgpt_audit_guard.py's guarded_write, and
    refreshes ai-os/CHATGPT_AUDIT_MASTER_CATALOGUE_2026-07-24.yaml +
    the local index automatically.
  verified_live_this_task: >
    Full round trip run for real: `--domain Security` produced a real request
    naming 6 real compliance-tracker files at commit
    c4d74e8766cec27c7a349aea627f574650dde241; a hand-crafted synthetic YAML
    fixture (standing in for a real ChatGPT reply) was ingested and landed at
    /opt/veridian/chatgpt-audit/Security/AUDIT-000008-20260724T215204Z.yaml,
    with the master catalogue correctly showing total_audit_records: 1,
    Security: 1 afterwards.

