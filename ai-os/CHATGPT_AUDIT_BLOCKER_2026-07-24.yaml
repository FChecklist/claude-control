exact_call_shape_once_key_exists:
  model: 'OWNER_TO_CONFIRM -- do not assume a specific OpenAI model name without the Owner naming it (CONSTRAINTS: "must use the model the Owner actually named when it runs")'
  api: 'OpenAI Chat Completions or Responses API -- POST https://api.openai.com/v1/chat/completions (or /v1/responses, whichever the confirmed model requires)'
  auth: 'Authorization: Bearer $OPENAI_API_KEY, sourced from /opt/veridian/shared/.env'
  read_scope: >
    Only the files/modules explicitly listed in a given audit request's
    files_analysed (ai-os/CHATGPT_AUDIT_RECORD_SCHEMA_2026-07-24.yaml) -- those
    file contents are read and included in the prompt (or supplied via a
    retrieval step); ChatGPT is never given broader repository access than
    that explicit list.
  prompt_template: |
    SYSTEM: You are auditing VERIDIAN AI OS source code for gaps,
    duplication, and incompleteness against the standards listed below. You
    have READ-ONLY access to the files listed in READ_SCOPE. You do not have
    write access to any production source -- your output is a single YAML
    document, nothing else. Output must match
    ai-os/CHATGPT_AUDIT_RECORD_SCHEMA_2026-07-24.yaml exactly: every required
    field populated, no fabricated file paths, no fabricated linkage ids
    (capability/workflow/metadata/business_rule/database/api/ui/report/document
    -- omit a linkage field rather than invent one).

    STANDARDS_USED: {{standards_used}}
    READ_SCOPE (files_analysed): {{files_analysed}}
    MODULES_ANALYSED: {{modules_analysed}}
    REPOSITORY_VERSION: {{repository_version}}
    COMMIT_HASH: {{commit_hash}}

    USER: <the real file contents for each path in READ_SCOPE, concatenated
    with a path header per file>
  output_write_path: >
    The ONLY way the resulting YAML may reach disk: allocate the target path
    via `python3 scripts/chatgpt_audit_versioning.py allocate --subfolder
    <Domain>`, then write the model's output through `python3
    scripts/chatgpt_audit_guard.py write --path <allocated path> --stdin`.
    The calling code must never call open()/write() directly on a
    ChatGPT-authored path -- routing every write through the guard script is
    the mechanical guarantee, not a comment in the prompt.
  post_write: >
    `python3 scripts/generate_chatgpt_audit_index.py` to refresh the local
    searchable index and ai-os/CHATGPT_AUDIT_MASTER_CATALOGUE_2026-07-24.yaml.

