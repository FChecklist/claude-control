meta:
  title: VERIDIAN AI-Governance Bias/Transparency/Appropriate-Use AI Review (Phase 5)
  created: '2026-07-24'
  produced_by_task: task-20260724-144915-phase5-remaining-ai-review-lane-read-onl
  precedent: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phase-5 scope: 'ai-governance domain -- bias/
    transparency/appropriate-use judgment (promptfoo covers only the deterministic slice, see Phase 6)'.
    Same structure as ai-os/ENTERPRISE_ARCHITECTURE_DRIFT_REVIEW_2026-07-24.yaml (Phase 4's own AI Review
    pass) -- real judgment content produced by this task, not generated by a tool. 0 pre-existing
    audit_findings rows in domain=ai-governance (confirmed via live query) -- Phase 6 (not yet built) will
    add promptfoo deterministic test suites against real production prompts (the deterministic-testable
    slice, e.g. does output contain PII / match a format); this review deliberately does NOT re-do that --
    it judges bias risk, disclosure-to-affected-party, and human-in-the-loop adequacy for VERIDIAN's real
    AI features, none of which a deterministic test suite can evaluate."
  method: "Grep + direct read of every real LLM-calling code path in compliance-tracker (the primary AI
    surface owner) and projexa (confirmed a thin proxy client), tracing each feature's actual prompt text,
    what decision/output it produces, and how that output is consumed downstream (shown to a human for
    review vs. driving an automated action directly). veda-advisors was grepped repo-wide for LLM-API
    identifiers and confirmed to have zero AI/LLM integration -- recorded as a real result, not assumed."

repos:
  compliance-tracker:
    ai_governance_findings:
      - id: GOV-AI-001
        severity: medium
        title: "CRM lead/opportunity AI scoring: real people/orgs scored 0-100 by an LLM, with no disclosure to the party being scored"
        finding: "scoreLead() (crm-service.ts, ~lines 301-423) sends an LLM the prompt '\"score\" is 0-100
          (higher = more likely to convert)... \"recommendedAction\" is one concrete next step' and writes
          the result directly onto the persistent lead record (aiScore, aiScoreReasoning,
          aiRecommendedAction) with no approval/pending state -- the AI's number is the stored record the
          moment the call succeeds. Transparency to the internal sales rep is real and reasonably good: the
          CRM page renders the AI score and recommended action, and migration 0238 added confidence/
          assumptions/rejectedAlternatives specifically for an 'Explain AI Decisions' panel
          (AiDecisionExplanationCard.tsx). But the lead/opportunity itself -- the actual person or
          organization being scored -- is never informed anywhere in this code path that they have been
          AI-scored, and the input signal (lead.source) is a channel/acquisition-path proxy that can
          correlate with the lead's socioeconomic profile, with no fairness/bias review visible in the code
          or prompt."
        recommendation: "Document (even briefly, in the prompt template metadata or a code comment) that
          source was reviewed as a proxy-bias risk, and decide/record whether scored leads/orgs need any
          disclosure given applicable consumer-protection or fair-lending-adjacent rules for this vertical."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/services/crm-service.ts (~lines 301-423), drizzle/0065_wave75_crm_intelligence.sql, drizzle/0238_ai_explainability_gap_closure.sql, src/app/(app)/crm/page.tsx"
      - id: GOV-AI-002
        severity: low
        title: "GST AI Review prompt explicitly instructs the model to suppress AI self-disclosure in its output"
        finding: "The system prompt for gst.ai_review_report (drizzle/0100_gst_reconciliation_engine.sql,
          ~line 340) literally instructs: 'Keep the whole report under 400 words. No preamble, no
          disclaimers about being an AI.' The prompt's own description field says this report is meant 'for
          a CA to review before filing', and the frontend does implement a genuine human-in-the-loop
          pattern -- the button is explicitly labeled 'AI Review' and is a discretionary, on-demand click
          (not auto-run, not gating filing). However, once rendered, the reportText/topIssues content
          itself carries zero self-identifying language by design, and the on-screen risk badge just reads
          'Risk: {verdict}' with no 'AI-estimated' qualifier -- so if this text is copied into an external
          audit workpaper or emailed to a client, its AI provenance is lost at the point the instruction was
          designed to suppress it."
        recommendation: "Keep the 'no rambling AI disclaimers' intent (reasonable for conciseness) but have
          the surrounding app inject a fixed, non-model-generated provenance line (e.g. 'AI-generated
          review, not a substitute for professional judgment') wherever reportText is displayed, exported,
          or copied, rather than relying on the prompt/UI-button context alone."
        remediation_type: ai_escalation_required
        artifact_path: "drizzle/0100_gst_reconciliation_engine.sql (~line 340), src/lib/gst/ai-review-report.ts, src/app/(app)/gst-reconciliation/page.tsx (~lines 305-331)"
      - id: GOV-AI-003
        severity: info
        title: "Construction 'risk detection' and 'photo progress estimate' AI features are implemented end-to-end but have zero verified UI consumer in either repo"
        finding: "detectBudgetScheduleRisk() classifies a live project into low/medium/high risk with a
          recommendedAction, and estimateProgressFromPhoto() writes an AI percent-complete estimate
          directly onto a document row (db.update(documents).set({ metadata: { aiProgressEstimate:
          estimate } })). Grep of both compliance-tracker/src and projexa/src for risk-detection,
          estimate-progress, diff-drawings, progress-summary, and aiProgressEstimate found no matches in
          any frontend file in either repo -- aiProgressEstimate is written but never read back anywhere.
          PROJEXA's own governance doc (PROJEXA_TASK_GOVERNANCE.md) confirms it currently proxies only
          /assistant and /discuss to VERIDIAN, not these four construction endpoints. These AI outputs
          currently have no confirmed disclosure-to-user or human-review UI at all -- unlike the GST AI
          Review and CRM scoring surfaces, which do have one."
        recommendation: "Before either endpoint is wired into a real page, require it to follow the same
          explicit 'AI-labeled, on-demand, human-reviewed' UI pattern already established by the GST
          ai-review button and the CRM 'AI suggests' treatment."
        remediation_type: ai_escalation_required
        artifact_path: "src/app/api/construction/ai/risk-detection/route.ts, src/app/api/construction/ai/estimate-progress/route.ts, src/lib/services/construction-ai-service.ts (lines 44-140), projexa/PROJEXA_TASK_GOVERNANCE.md"
      - id: GOV-AI-004
        severity: low
        title: "CRM AI recommendation chains directly into a second, unattended AI planning call within one synchronous user click"
        finding: "A human does click a real button (createFollowUpTask -> POST
          /api/crm/{kind}/{id}/follow-up-task) before anything happens, a genuine human-in-the-loop gate on
          initiating the action. But createChainedTask() (crm-service.ts, lines 425-460) then, in the same
          call, both inserts the new task row and immediately awaits executeTask(...) -- a second,
          independent LLM planning pass -- with no intermediate review step between 'AI recommended X' and
          'a second AI now plans and dispatches work based on X'. The code comment frames this as 'still
          human-gated by the explicit call here', but the human only approved creation of a follow-up task,
          not the content of the second AI's plan."
        recommendation: "Consider surfacing the second AI's plan for a confirm/edit step before executeTask
          dispatches it, or explicitly document why a single click is judged sufficient human authorization
          for the full two-hop AI chain."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/services/crm-service.ts (lines 425-460), src/app/(app)/crm/page.tsx (lines 225-240)"

  projexa:
    ai_governance_findings: []
    note: "Confirmed a thin proxy client only (PROJEXA_TASK_GOVERNANCE.md; proxies /assistant and /discuss
      to VERIDIAN) -- no independent AI decision-making of its own to review. Referenced as corroborating
      evidence for GOV-AI-003 above, not an independent finding."

  veda-advisors:
    ai_governance_findings:
      - id: GOV-AI-005
        severity: info
        title: "veda-advisors confirmed to have no AI/LLM integration"
        finding: "Repo-wide grep across veda-advisors (excluding node_modules/.git) for
          anthropic|openai|claude-|generateText|chat\\.completions|llm|gpt- returned only matches in
          governance/doc files (AGENTS.md, CLAUDE.md, bun.lock) and unrelated image filenames. No source
          file in this repo calls an LLM API."
        recommendation: "No ai-governance action needed for veda-advisors at this time; re-scan if AI
          features are added."
        remediation_type: ai_escalation_required
        artifact_path: "repo-wide grep, /opt/veridian/repos/veda-advisors"

cross_repo_summary:
  real_findings_count: 5
  severity_breakdown: {medium: 1, low: 2, info: 2}
  headline: "compliance-tracker is VERIDIAN's sole real AI-governance surface (projexa proxies only 2
    non-consequential endpoints; veda-advisors has none). Of its 4 real AI features reviewed, the CRM lead-
    scoring surface (GOV-AI-001) is the one genuine medium-severity finding: internal-facing transparency
    is good, but the scored party is never informed and the scoring signal carries unreviewed proxy-bias
    risk. The GST AI Review (GOV-AI-002) and CRM task-chaining (GOV-AI-004) both have a real human-in-the-
    loop gate but a real, narrower gap just past it (disclosure persistence; second-hop AI autonomy). Two
    construction AI endpoints (GOV-AI-003) are fully built with no UI consumer yet -- a real, actionable
    finding to require the disclosure pattern already proven elsewhere in this codebase before they ship."
