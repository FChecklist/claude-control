        read of superboss-register.py's every write path + veridian-task.py's
        _auto_log_task_event) found 3 real, code-evidenced defects, all fixed: (1)
        veridian-task.py wrapped every superboss-register.py subprocess write call -- fired
        every 5 min by EVERY active worker's background checkpoint loop, plus ad-hoc
        log-work/log-action calls -- in subprocess.run(timeout=10), SHORTER than
        superboss-register.py's own sqlite3.connect(DB_PATH, timeout=30) busy_timeout, so a
        writer still legitimately inside its declared 30s busy-wait could be SIGKILLed by its
        own caller at 10s (failure silently swallowed by a bare except: pass) -- fixed by
        raising all 3 call sites to timeout=35. (2) No serialization existed across concurrent
        superboss-register.py writer processes -- fixed by adding _write_lock(), an
        fcntl.flock-based OS lock wrapping every write subcommand, the SAME proven pattern
        already used for the 2026-07-18 CONTROLLER.yaml corruption fix (veridian-task.py's own
        controller_lock()) -- a losing writer now blocks entirely outside any sqlite
        transaction, so killing it while it waits can never corrupt the file, and flock
        auto-releases if its holder is killed, so this cannot deadlock either. (3) Separately, a
        genuine FTS5 desync bug in scope for this phase's FTS5-trigger check: system_index's
