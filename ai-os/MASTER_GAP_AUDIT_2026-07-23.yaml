        synthetic test, so full certainty on the exact causal mechanism was NOT reached. Defects
        (1)/(2)/(3) are real and directly consistent with phase 1's own observation (an ordinary
        write coincided with the ok->corrupt flip), and (1)/(2) mirror an already-proven fix
        pattern in this exact codebase; applied as the most defensible mitigation available, not
