    diagnosis_summary: "Full read of superboss-register.py's every write path plus
      veridian-task.py's _auto_log_task_event found 3 real, code-evidenced defects: (1)
      veridian-task.py wrapped every superboss-register.py subprocess write call (fired every
      5 min by EVERY active worker's background checkpoint loop, plus ad-hoc log-work/log-action
      calls) in subprocess.run(timeout=10) -- shorter than superboss-register.py's own
      sqlite3.connect(DB_PATH, timeout=30) busy_timeout, so a writer still legitimately inside
      its declared 30s busy-wait could be SIGKILLed by its own caller at 10s (failure silently
      swallowed by a bare except: pass). (2) No serialization existed across concurrent
      superboss-register.py writer processes -- they relied solely on sqlite3's internal
      busy_timeout to arbitrate. (3) system_index's index_add() upserts via
      ON CONFLICT(path) DO UPDATE but system_index_fts (external-content FTS5) only had an
      AFTER INSERT sync trigger, no AFTER UPDATE, silently desyncing the FTS shadow table on
      every re-verification of an already-indexed path. HONESTY NOTE (unchanged from the
      in-file fix note, restated here for the log): a blind concurrent-SIGKILL stress test (up
      to 150 concurrent log-action processes, sustained random kills) did NOT reproduce actual
      corruption on either pre-fix or post-fix code within the available test budget, so full
      certainty on the exact causal mechanism was not reached -- defects (1)/(2)/(3) are real
      and consistent with phase 1's own observation (an ordinary write coincided with the
      ok->corrupt flip), and (1)/(2) mirror the already-proven controller_lock() fix pattern
      from the 2026-07-18 CONTROLLER.yaml incident; applied as the most defensible mitigation
      available, not a guaranteed-proven root cause."
    fix_implemented:
      - "/opt/veridian/scripts/superboss-register.py: added _write_lock() (fcntl.flock-based OS
        lock on a sidecar .writelock file), wraps every write subcommand (init/log-instruction/
        log-work/log-action/index-add/log-execution/index-transcript) at CLI dispatch -- a
        losing writer now blocks entirely outside any sqlite transaction, so killing it while
        it waits can never corrupt the file, and flock auto-releases if its holder is killed."
      - "/opt/veridian/scripts/veridian-task.py: raised _auto_log_task_event's subprocess
        timeout from 10s to 35s (>30s busy_timeout + margin) at all 3 call sites (create/
        checkpoint/record_usage)."
      - "/opt/veridian/scripts/superboss-register.py: added the missing system_index_au
