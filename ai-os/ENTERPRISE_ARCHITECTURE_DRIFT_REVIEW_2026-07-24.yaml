meta:
  title: VERIDIAN Enterprise-Architecture AI Review -- Drift-Check (Phase 4)
  created: '2026-07-24'
  produced_by_task: task-20260724-135839-phase4-architecture-judgment-domains-dep
  standard_cited: "The Open Group TOGAF 10 Standard"
  precedent: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml enterprise-architecture row: 'AI Review pass,
    dependency-cruiser layer rules as a supporting deterministic signal' -- this IS that AI Review pass.
    Real judgment content produced by this task, not generated by a tool. Reads the 6 real
    ea-technology-no-import-application / ea-application-no-import-interface findings
    ai-os-scripts/audit_pipeline_architecture.py wrote into audit_findings (domain=enterprise-architecture)
    as its deterministic input signal, per this plan's own PART5 rule (AI Review adds judgment on top of
    what software already found, never re-does software's job)."
  method: "Direct read of each real repo's src/app + src/lib tree (find/ls, same live-repo-read method the
    bounded-context map used), cross-referenced against ai-os/ARCHITECTURE_BOUNDED_CONTEXT_MAP_2026-07-24.yaml
    and the 3 dependency-cruiser rule files' actual findings. This review's own top-line finding is itself
    honest and load-bearing: per the phase plan's own enterprise-architecture tool_mapping note, VERIDIAN has
    ZERO C4-model-as-code or TOGAF ADM Phase A-D artifacts today (Structurizr Lite was evaluated and
    correctly deferred, per that same note) -- this document and ARCHITECTURE_BOUNDED_CONTEXT_MAP itself are
    the first real, if partial, substitute artifacts, not a comparison against some pre-existing diagram."

repos:
  compliance-tracker:
    drift_findings:
      - id: EA-AI-001
        severity: medium
        title: "Application layer has no internal sub-domain decomposition despite 45+ real capabilities"
        finding: "src/lib/services/ (50+ files) and src/lib/engines/ (30+ files, one flat namespace plus a
          single 'in/' subfolder for India-specific engines) are both flat, undifferentiated collections --
          confirmed via live directory listing, zero subfolders grouping files by the business capabilities
          named in this task's own business_capability_map (e.g. no services/governance/, services/hr/,
          services/risk/ grouping). The dependency-cruiser ddd-bounded-context rule can only check the
          ROUTE layer (src/app/(app)/<context>/, src/app/api/<context>/) because that is the only layer
          with real folder-per-context structure to anchor a mechanical rule on -- it structurally cannot
          see this gap, because there is no folder boundary in src/lib for it to check against. This is a
          real TOGAF Application Architecture concern (component boundaries within the application layer
          itself) that only a judgment pass, not a lint rule, could surface."
        recommendation: "Not a blocking defect -- 50+ flat service files is a real but common intermediate
          state for a fast-growing product. Flagged as the concrete next real architecture investment
          (grouping services/engines into capability-named subfolders) rather than left implicit."
        remediation_type: ai_escalation_required
      - id: EA-AI-002
        severity: low
        title: "src/app/api/v1/ nests 11 real sub-areas (brain, compliance, connectors, construction,
          documents, erp, notices, platform, pms, projexa, tasks) inside ONE 'v1' bounded context"
        finding: "Confirmed via live directory read (AUDITOR_ENGINE_PHASE_PLAN's own custom_work_required
          note anticipated exactly this kind of gap: 'none of the 3 repos currently define layers explicitly
          enough for a rule file to reference'). The ddd-bounded-context.config.cjs rule (this same phase's
          own deliverable) treats all of src/app/api/v1/** as one context by construction (documented as a
          known simplification in its own header and in the bounded-context map) -- it is architecturally
          real that 'v1' is actually ~11 separate concerns wearing one folder name, an API-versioning
          convention masquerading as a bounded context. A mechanical rule cannot tell the difference between
          a real context and a version-prefix folder; this judgment pass can."
        recommendation: "Real follow-up work for whichever future phase extends the ddd rule: decompose the
          v1/ nesting into its own per-subfolder contexts rather than treating v1 as one unit."
        remediation_type: ai_escalation_required
      - id: EA-AI-003
        severity: info
        title: "The 6 live ea-technology-no-import-application findings are a narrow, real, low-blast-radius pattern -- not a systemic inversion"
        finding: "All 6 real findings from this phase's own pipeline run trace to a single file,
          src/lib/supabase/auth-guard.ts, importing 6 different src/lib/services/*.ts modules (confirmed via
          direct query against audit_findings this task's own pipeline populated). Read auth-guard.ts's real
          content context: it is a request-time authorization gate that legitimately needs to consult
          business-rule services (e.g. session-limit-service, org-provisioning-service) to decide whether a
          request is allowed -- this is a real, deliberate 'infrastructure calls into a policy service'
          pattern, not an accidental layering violation from careless imports scattered across many files.
          Judgment call: this is architecturally defensible as-is (auth decisions legitimately need business
          context) but is still real coupling worth naming, which is why the deterministic rule correctly
          still flags it (severity=warn, not silently excluded) -- the AI Review's job is exactly to add
          this 'is it actually bad' judgment on top of the mechanical finding, per PART5."
        recommendation: "No remediation required. If this pattern spreads beyond auth-guard.ts to more
          technology-layer files, escalate to medium -- tracked as a real, specific threshold rather than a
          vague 'watch this' note."
        remediation_type: ai_escalation_required
    togaf_adm_coverage: "Phase A (Architecture Vision): not authored. Phase B (Business Architecture): this
      task's business_capability_map is a real first-pass substitute. Phase C (Information Systems --
      Data + Application Architecture): this task's layer_boundary_map is a real first-pass substitute for
      the Application half; no Data Architecture artifact (ER diagrams, data-flow) exists yet -- distinct
      from and not satisfied by the data-model domain's sqlfluff/RLS work (Phase 3), which lints existing
      schemas rather than modeling target-state data architecture. Phase D (Technology Architecture): not
      authored -- the layer_boundary_map's 'technology' row names real folders but is not a technology
      architecture artifact (no deployment topology, no infra inventory)."

  projexa:
    drift_findings:
      - id: EA-AI-004
        severity: info
        title: "Application layer is genuinely thin (2-3 real service files) -- current flat structure is appropriate, not a gap"
        finding: "Unlike compliance-tracker, projexa's src/lib/services/ has only contact-service.ts,
          notification-service.ts, search-service.ts (confirmed live) against 30+ real route-group business
          capabilities. Judgment call: most of projexa's real business logic likely lives directly in
          route.ts handlers rather than a service layer -- the 0 real dependency-cruiser findings across all
          3 rule sets (ddd/clean-architecture/enterprise-architecture, confirmed via this phase's own
          pipeline run) is consistent with, not contradicted by, a thin/route-heavy architecture: there is
          simply less src/lib code to violate a boundary with."
        recommendation: "Not a defect. Worth re-checking once/if projexa's service layer grows -- the 0
          finding count today reflects genuine current simplicity, not proof the boundaries would hold up
          at compliance-tracker's scale."
        remediation_type: ai_escalation_required
    togaf_adm_coverage: "Same real gaps as compliance-tracker (Phase A/D not authored, Phase B/C only
      first-pass-substituted by this task's own artifacts) -- not re-derived per repo since the gap itself
      is identical and repo-independent (no VERIDIAN TOGAF program exists for ANY repo yet)."

  veda-advisors:
    drift_findings:
      - id: EA-AI-005
        severity: info
        title: "No architecture to drift from -- appropriately minimal for this repo's real scope"
        finding: "src/lib contains exactly 2 files (db.ts, utils.ts) against 4 page sections + 1 API context
          -- confirmed live. There is no meaningful application/technology layer for a layer-boundary rule
          to police, and 0 real dependency-cruiser findings across all 3 rule sets confirms this rather than
          hiding a gap (small totalCruised=65 module count, not a silent skip)."
        recommendation: "No remediation. Re-run this review if veda-advisors' real scope grows beyond its
          current marketing/advisory-site footprint."
        remediation_type: ai_escalation_required
    togaf_adm_coverage: "Same real gap as the other 2 repos -- no TOGAF ADM artifacts exist. Given
      veda-advisors' explicit exclusion from the PART6 7-repo observability layer (per this plan's own
      meta.named_7_repos_for_part6 note) and its real, small scope, a full TOGAF ADM program for this repo
      specifically is not recommended as near-term work."

