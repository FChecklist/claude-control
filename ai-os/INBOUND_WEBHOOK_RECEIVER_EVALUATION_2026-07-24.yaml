    `automation_rule_engine.py register-rule --rule-name capability-registry-dedup-webhook-log
    --capability-name capability_registry_dedup --trigger-type webhook.capability_proposed
    --action-type log_action ...` -> {\"registered\": true}."
  - "Started scripts/webhook_receiver.py on 127.0.0.1:8100 (loopback only, temporary, killed at the end of
    this test -- not left running) with VERIDIAN_WEBHOOK_SECRET set. Sent an UNSIGNED POST to
    /webhook/invoice_created -> 401 {\"error\": \"invalid or missing signature\"} (signature verification
    confirmed enforced, not just present in code)."
  - "Sent a correctly HMAC-SHA256-signed POST to /webhook/invoice_created with a matching automation rule
    active -> 200, body included a real evaluation result: rules_evaluated=2, rules_fired=2, each with a
    real automation_rule_runs row id and a real dispatched log-action action_id -- proving the full chain
    (inbound HTTP -> signature verify -> automation_rule_engine.py evaluate-rules -> real action dispatch)
    end to end, not simulated. GET /healthz -> 200 {\"ok\": true}."
  - "Test-only rules/runs used during this verification were deleted afterward; the one rule left live
    (capability-registry-dedup-webhook-log) is a real, meaningful example tied to a real capability, same
    'leave real evidence live' convention Phase 1's populate_capability_registry.py used for its 5 rows."

