meta:
  title: Live scripts/ vs repo (claude-control) scripts/ drift audit
  generated_by: task-20260725-092256-fix-live-repo-scripts-drift-and-system-i
  generated_ts: "2026-07-25T09:30:00Z"
  method: >
    diff -rq /opt/veridian/scripts/ /opt/veridian/repos/claude-control/scripts/
    (__pycache__ excluded), cross-checked against `git log --all -- scripts/<file>`
    and `git hash-object` blob matching to determine whether each "differ" file
    was a clean history match (safe to overwrite) or a genuinely independent edit.
  headline_finding: >
    CONFIRMED, SERIOUS, PREVIOUSLY UNDETECTED: no automatic mechanism ever copied
    claude-control's scripts/ into /opt/veridian/scripts/ (the path every cron job
    and every direct `python3 /opt/veridian/scripts/X.py` invocation actually runs).
    sync-repos.sh (the only related cron job, every 2h) only ran `git pull --ff-only`
    inside /opt/veridian/repos/<repo>/ checkouts -- it never touched live scripts/.
    Searched for alternatives before concluding this: user crontab (full list reviewed,
    only sync-repos.sh/cron entries shown below), root crontab (access denied --
    `sudo crontab -l` requires a password not available in this session; flagged as
    NOT independently verified, see note), /etc/cron.d (3 stock Ubuntu entries only,
    no veridian job), `systemctl list-timers --all` (16 stock/system timers, zero
    veridian units), and a repo-wide grep for rsync/cp/deploy-style patterns in
    scripts/*.sh and scripts/*.py (zero hits touching scripts/ deployment). This
    task built and deployed the fix: scripts/deploy-live-scripts.sh, called from
    the end of the now-repo-tracked scripts/sync-repos.sh.
  root_cause_confirmation_caveat: >
    Root/system crontab could not be read in this session (no sudo password
    available) -- this audit's "no other mechanism found" conclusion rests on
    every USER-level and filesystem-visible mechanism (systemd timers, /etc/cron.d,
    grep of the scripts themselves) having zero hits, not on a direct read of
    root's crontab. If a root cron job exists that this session cannot see, it is
    unaccounted for here. Flagged, not asserted away.
  counts_at_generation_time:
    live_only: 65
    repo_only: 24
    differ: 9
    note: >
      A fresh `diff -rq` re-run at task completion may show a slightly different
      count than this generation-time snapshot -- this is a live, actively-running
      production system (cron jobs fire every 10-30 minutes and can touch files in
      either tree mid-audit). The final checkpoint pastes a fresh diff -rq run
      as the authoritative completion-time count per this task's own success
      criteria.

classification_definitions:
  operational_only: correctly live-only (crontab backups, cost/credit accounting, .bak files, the OpenRouter proxy) -- leave alone, never deploy, never delete.
  undeployed_real_feature: exists correctly in repo, was never deployed live -- a real gap, now fixed by this task's deploy run.
  stale_live_copy: exists in both, live was older/missing a real merged fix -- actively wrong until this task's deploy run.
  needs_owner_decision: genuinely ambiguous two-sided divergence -- NOT auto-resolved by this task, listed for the Owner.

