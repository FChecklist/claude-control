    GITHUB: 11 rows (every repo under /opt/veridian/repos, live via gh api/gh pr list)
    LOCAL: 1 row (repos/claude-control/CONTROLLER.yaml, reachable via git mirror) + 1 explicit,
      documented gap (Owner laptop-side memory/*.md, unreachable -- see that row's metadata_json)
  new_cli_subcommands: 'scripts/superboss-register.py verify-knowledge / annotate-knowledge / add-relationship / add-tag
    (all UPDATE-in-place on the latest row for a path, never a duplicate INSERT)'
  item_4_drift_gaps:
    EXECUTION_RULES_AUDIT_2026-07-23.yaml: 'stays PATH_MISSING -- citing text corrected in ai-os/scripts/generate_task_checklist.py
      (regenerated into MASTER_INDEX.yaml) rather than authored, since its citations reference narrative
      audit content that would require AI-fabricated judgment (self_certification: forbidden)'
    GOVERNANCE_AUDIT_RESULT_2026-07-23.yaml: 'now VERIFIED_MATCH -- the file was genuinely created by
      intervening Phase 15 work; verify-knowledge caught the transition mechanically'
    MASTER_GAP_AUDIT_2026-07-23.yaml: 'stays PATH_MISSING -- citing text corrected in this file (see
      completeness_guarantees.hundred_pct_completion above) to point at the real, already-live
      ai-os/gap_queue.yaml instead of authoring a duplicate (zero_duplication_mandatory)'
  item_3_software_catalog:
    artifact: ai-os/SOFTWARE_CATALOG.yaml
    generator: ai-os/scripts/generate_software_catalog.py (re-run to refresh, do not hand-edit)
    source: 'crontab -l + directory listing of scripts/+ai-os/scripts/ + systemctl --user list-units -- machine-generated, not hand-typed'
  item_5_cron: '2 new run-logged.sh entries: knowledge-registry-multisource (every 6h) and software-catalog-gen (daily 04:15)'
  item_4_auto_verify: 'scripts/task-gateway.py close now calls reverify_touched_knowledge_engine_rows() --
    maps the closing task''s own git diff to live paths and calls verify-knowledge for every matching
    knowledge_engine row, output under the close JSON''s knowledge_engine_reverify key'
  known_gap_supabase_cron_credential: 'SUPABASE_ACCESS_TOKEN in shared/.env returns 401/403 from the real
    Supabase Management API as of 2026-07-24 -- recurring cron refresh of the SUPABASE source is degraded
    until the Owner issues a working token; see ai-os/KNOWLEDGE_ENGINE_PHASE3_CANDIDATES_2026-07-24.yaml'
v2_truthfulness_enforcement:
  no_fabrication: true
  no_incomplete_reported_as_complete: true
  evidence_required_per_claim:
  - file_path
  - command_output
  - commit_hash
v2_efficiency_mandate:
  token_usage: minimize
  priority: fast_completion_over_exhaustive_narrative
v2_task_lifecycle_pipeline:
  purpose: 'Numbered, sequential, closed-ended process every task must follow. Each phase: input, exact_command, output, next_phase_trigger. No phase may be skipped
    or assumed.'
  phase_0_intake:
    input: raw owner/system instruction text
    exact_command: python3 /opt/veridian/scripts/superboss-register.py log-instruction --text "<raw_text>" --source owner --medium <chat|cron|task> --session-id <id>
    output: instruction_id (e.g. INS-YYYYMMDD-HHMMSS-xxxx)
    next_phase_trigger: instruction_id exists
  phase_1_software_first_search:
    purpose: SOFTWARE (not AI) searches existing history/metadata BEFORE any AI judgment. This is how software tells AI what happened before.
    input: instruction_id, extracted keywords from raw_text
    exact_commands:
    - python3 /opt/veridian/scripts/superboss-register.py check-duplicate "<keywords>" --category <optional>
    - python3 /opt/veridian/scripts/superboss-register.py search "<keywords>" --limit 10
    output: 'JSON: {instructions: [...], work_items: [...], actions: [...], system_index: [...]} -- real rows, or empty arrays if genuinely nothing found'
    next_phase_trigger: search output received (even if empty)
    keyword_extraction_baseline_mechanical_first:
      step_1_mechanical: 'regex-extract: quoted strings, file paths (contains ''/'' or ''.py''/''.yaml''/''.md''), snake_case/kebab-case identifiers, numbers referencing
        item/rule IDs -- zero AI judgment, pure regex'
      step_2_ai_supplement: ONLY if step_1 yields zero usable terms, AI may supply up to 3 additional terms, each with a 1-clause reason logged in metadata_json
      rule: step_1 output is what gets searched FIRST; step_2 only runs if step_1 search returns zero results AND zero duplicate-check hits
  phase_2_ai_gap_analysis:
    purpose: AI reads phase_1's software output FIRST. AI only does own research/reasoning for what software's structured search could not resolve (ambiguous intent,
      missing evidence, judgment calls).
    input: phase_1 output + instruction raw_text
    output_file_naming_convention: ai-os/<TOPIC>_GAP_AUDIT_<YYYY-MM-DD>.yaml (e.g. ai-os/GOVERNANCE_AUDIT_RESULT_2026-07-23.yaml -- established precedent)
    output_required_fields_per_item:
    - item_number
    - 'status: DONE|PARTIAL|MISSING'
    - 'evidence: <file:line OR command output OR commit hash, never a guess>'
    next_phase_trigger: gap audit file committed with >=1 item classified
    single_source_of_truth_rule:
      before_creating_new_audit_file: python3 /opt/veridian/scripts/superboss-register.py search "<topic>" --limit 5 -- if an existing ai-os/*_GAP_AUDIT_*.yaml or
        ai-os/*_AUDIT_RESULT_*.yaml already covers this exact topic, UPDATE that file in place (new commit, same filename), do not create a second dated file for
        the same topic
      new_file_only_when: topic genuinely has zero prior audit file (confirmed via the search above, cite the empty result as evidence)
      canonical_location_rule: 'the MOST RECENT commit to a given audit filename, on whichever branch, IS the canonical version -- if found on a non-master branch,
        note the branch name explicitly when citing it (established precedent: 2026-07-23 audits lived on worker branches, this caused real confusion, now must be
        stated explicitly every time)'
  phase_3_automation_percentage_estimate:
    purpose: AI explicitly states, per gap/task, what fraction can be closed by software alone (mechanical) vs requires AI judgment. This step was MISSING before
      2026-07-23, now mandatory.
    input: phase_2 gap audit
    output_required_fields:
    - 'mechanical_pct: int(0-100)'
    - 'judgment_pct: int(0-100, mechanical_pct+judgment_pct=100)'
    - 'mechanical_reason: str'
    - 'judgment_reason: str'
    output_location: 'appended to the same gap audit file''s each item, key: automation_estimate'
    next_phase_trigger: every item in phase_2's audit has an automation_estimate
  phase_4_planning:
    purpose: 'AI groups gaps into phases. Each phase becomes one closed-ended task spec, written using v2_task_specification_requirements.literal_template (line ref:
      this document, key v2_task_specification_requirements).'
    input: phase_2 + phase_3 outputs
    exact_command_to_register_planned_phase: python3 /opt/veridian/scripts/superboss-register.py index-add --path <planned_task_title> --category task_register --layer
      documentation --status designed_not_built --purpose "<one line>" --tags phase:<n>,parent_audit:<gap_audit_filename>
    output: one prompt.txt-ready spec per phase, following literal_template exactly
    next_phase_trigger: spec file written locally, ready for phase_5
    phase_sizing_rule:
      min_items_per_phase: 3
      max_items_per_phase: 8
      exception: a single item requiring a genuinely large build (e.g. a new subsystem) may be its own 1-item phase -- state explicitly why grouping was not possible
      rule_source: codified 2026-07-23 from prior informal practice, now mandatory not optional
    collision_prevention_rule:
      before_dispatch: python3 /opt/veridian/scripts/superboss-register.py search "<target gap item numbers or file paths>" --limit 10 -- check no OTHER active task
        (systemctl --user list-units veridian-worker@* --state=active) already targets the same gap item(s) or file(s)
      if_collision_found: do not dispatch a duplicate -- either wait for the active task to finish, or explicitly scope this phase to a genuinely different item/file
  phase_5_dispatch:
    input: phase_4 spec
    exact_commands:
    - python3 /opt/veridian/scripts/veridian-task.py create --title <kebab-title> --repo <repo> --prompt "$(cat <specfile>)"
    - systemctl --user start veridian-worker@<returned-task-id>.service
    output: task_id, systemd unit active
    next_phase_trigger: systemctl --user is-active returns 'active'
    on_preflight_reject: read task.yaml checkpoints[-1].note, fix the specific prompt.txt line (see v2_task_specification_requirements known false-positive patterns),
      systemctl --user reset-failed if StartLimitBurst, restart -- do not abandon
    retry_limit_rule:
      max_self_fix_attempts_same_phase: 5
      on_exceeding_limit: STOP self-fixing, checkpoint status=blocked with full attempt history, send notify-owner.py email describing the stuck state plainly --
        do not attempt a 6th silent fix
      counts_toward: the task's own MAX_LIFETIME_INVOCATIONS=20 cap (worker-entrypoint.sh) -- retry limit here is stricter and should trigger first
    verification_command_predefinition_rule:
      purpose: Prevents self-certification. The agent that performs the work must NOT invent its own passing criteria after the fact.
      rule: SUCCESS_CRITERIA in the phase_5 task spec (written at planning/phase_4 time, BEFORE execution) must already contain the exact, real, runnable verification
        command(s) -- phase_7's postflight_audit_gate.py --audit-cmd argument is copied VERBATIM from this pre-defined SUCCESS_CRITERIA, never authored fresh at phase_7
        time by the same agent that did phase_6's work
      if_execution_reveals_the_predefined_test_was_wrong: the executing agent may PROPOSE a corrected test, but must flag this explicitly in the checkpoint note as
        'predefined test amended, needs independent review' -- this case gets routed to Owner or a separate audit pass, not self-approved
  phase_6_execution:
    input: dispatched task runs autonomously on server
    monitored_by: veridian-task-watchdog.py (see v2_watchdog_service), poll_interval_seconds=60
    output: real commits, real file changes, checkpoint entries in task.yaml
    next_phase_trigger: task.yaml status = pending_review or completed
  phase_7_quality_audit:
    purpose: Software-driven verification of the completed work, not AI self-certification.
    exact_command: python3 /opt/veridian/ai-os/scripts/postflight_audit_gate.py --task-id <id> --audit-cmd "<real verification command specific to what was built>"
    output: 'row in task_audits table: audit_id, verdict (DONE|FAIL|PARTIAL), stdout_tail, stderr_tail'
    next_phase_trigger: task_audits row exists with a verdict
    on_verdict_fail: route back to phase_5 with a corrective spec, do not mark the original task complete
  phase_8_tagging_and_indexing:
    purpose: Every new reusable artifact (script, function, table, doc) gets registered so phase_1 of every FUTURE task can find it -- this is how zero-duplication
      is actually enforced, not just claimed.
    exact_command: python3 /opt/veridian/scripts/superboss-register.py index-add --path <file_path> --category <cache|validation|guardrail|router|monitor|task_register|other>
      --layer <shell|typescript|database|documentation> --status live --purpose "<one line, what it does>" --tags <comma_separated>
    mandatory: true
    next_phase_trigger: index-add returns success for every new artifact from phase_6
  phase_9_history_registration:
    purpose: Distinct from tagging -- this is recording WHAT WORKED so failure-recovery (phase_10) and future planning (phase_4) can reuse it without re-deriving.
    exact_command_success_case: python3 /opt/veridian/scripts/superboss-register.py log-work --instruction-id <id> --software-task-id <task_id> --status closed
    exact_command_reusable_fix_case: python3 /opt/veridian/scripts/superboss-register.py log-fix --signature <error_signature> --fix-action <what_fixed_it> (known_fixes
      table, built by watchdog task 2026-07-23)
    next_phase_trigger: row exists in work_items and/or known_fixes
  phase_10_failure_handling:
    purpose: What happens when phase_6/7 fails, stalls, or loops.
    detected_by: veridian-task-watchdog.py, exact logic in v2_watchdog_service.checks
    exact_sequence:
    - 1. query known_fixes + ATTENTION.md + task_audits for matching error signature
    - '2. if match found: apply recorded fix_action, re-verify, log outcome to watchdog.jsonl'
    - '3. if no match or re-verify still fails: escalate -- create + start an RCA task (same phase_5 mechanism, title prefix ''rca-'')'
    - 4. RCA task MUST end by calling log-fix so this exact signature auto-resolves next time (closes the loop back to step 1)
    next_phase_trigger: watchdog.jsonl shows action_taken != null for the stalled task_id
  phase_11_completion_and_report:
    input: phase_7 verdict=DONE + phase_8 + phase_9 complete
    exact_command: 'python3 /opt/veridian/scripts/veridian-task.py checkpoint <task_id> --status completed --note "<real evidence: files, commit hash, audit_id>"'
    owner_notification: python3 /opt/veridian/scripts/notify-owner.py --subject <str> --body <simple_english_3_sentences_max> --dedupe-key <str> -- only if genuinely
      significant, not every phase
    owner_chat_update_format: 'one line: %complete|%incomplete|phase_x_of_y|status (per v2_communication_protocol.ai_to_owner_chat_default)'
  completeness_guarantees:
    zero_duplication: enforced structurally by phase_1 (mandatory search before any build) + phase_8 (mandatory registration after any build) -- a task cannot reach
      phase_5 without phase_1's search output on record, cannot reach phase_9 without phase_8's index-add on record
    hundred_pct_gap_analysis: enforced by phase_2's requirement that every item in the target audit have an explicit status, no silent omissions -- an audit file
      missing this for any item is itself a phase_7 audit-gate FAIL
    hundred_pct_completion: NOT claimed as achievable on a fixed timeline -- phase_11 only fires per-task on real verified evidence; the OVERALL gap list (187+ items
      as of 2026-07-23) closes incrementally, phase by phase, chain by chain, tracked in ai-os/gap_queue.yaml (live queue) and ai-os/GOVERNANCE_AUDIT_RESULT_2026-07-23.yaml
      (the real 60-item governance audit) -- 100% is a direction, not a promised date, per v2_truthfulness_enforcement. (Corrected 2026-07-24, task-20260724-033446,
      Knowledge Engine Phase 2 candidate fill_the_3_real_drift_gaps -- this line previously cited ai-os/MASTER_GAP_AUDIT_2026-07-23.yaml, a file that was never actually
      written to disk -- its intended function is already served live by the two real files named above, so the file was not authored, per zero_duplication_mandatory.)
  phase_minus1_trigger_rule:
    purpose: Defines WHEN the pipeline fires at all -- missing before 2026-07-23, causes ambiguity.
    enter_full_pipeline_if_any:
    - instruction requests new software/automation to be built or modified
    - instruction requests a gap/audit/status check
    - instruction requests server-side execution of any kind
    skip_to_log_only_if_all:
    - pure clarifying question with no build/audit/execution request
    - answerable from already-loaded context with zero new file/command access
    log_only_command: python3 /opt/veridian/scripts/superboss-register.py log-instruction --text <str> --source owner --medium chat --session-id <id> --response-summary
      <one_line> (phase_1 onward skipped, this alone satisfies phase_0)
    when_uncertain: default to full pipeline -- false positive (unnecessary rigor) is safe, false negative (skipped audit trail) is not
  phase_12_mandatory_self_reaudit:
    purpose: 'Owner directive: ''after completing this task you will audit it again, see if any gap, you will fill it.'' This must be a standing rule, not a one-off
      that happened once.'
    trigger: immediately after phase_11_completion_and_report, for ANY task that produced or modified a process/policy document (not required for simple content-fix
      tasks)
    exact_procedure:
    - '1. re-read the just-completed output adversarially: for each stated rule/field, ask ''does this specify WHO does it, WHEN it fires, WHAT the exact command/file
      is, and WHAT the pass/fail test is'' -- if any answer is missing, that is a gap'
    - 2. cross-check the output against the original instruction line-by-line, confirm every explicit line item has a corresponding field, not just a paraphrase
    - '3. if gaps found: fix them in the same document (new version bump), do not silently note and skip'
    - '4. if zero gaps found: state explicitly what was checked and why nothing was found, do not skip this step even when the answer is ''none'''
    real_precedent: STANDING_DIRECTIVE.yaml itself went through this exact cycle 3 times same-day (v2.1 tightened schemas, v2.2 built the missing lifecycle pipeline,
      v2.3 found 8 more gaps via this exact procedure, v2.4 found 5 more) -- proof this step catches real things, not theoretical
