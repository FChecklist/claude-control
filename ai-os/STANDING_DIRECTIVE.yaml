v2_task_specification_requirements:
  format: closed_ended
  required_fields:
  - OBJECTIVE_with_exact_judgment_justification
  - SCOPE_with_exact_input_output_per_deliverable
  - KNOWN_CONTEXT_with_cited_evidence
  - SUCCESS_CRITERIA_with_testable_commands
  - EXPECTED_OUTPUT_with_exact_file_commit_checkpoint_spec
  - CONSTRAINTS
  - COMPLEXITY_TIER
  forbidden_language:
  - continue the chain
  - do more
  - keep going
  - vague next steps
  - open-ended continuation
  self_dispatch_requirement:
    when: chain_continuation_intended
    mandatory_calls:
    - python3 scripts/veridian-task.py create --title <t> --repo <r> --prompt <closed_ended_spec>
    - systemctl --user start veridian-worker@<new-task-id>.service
    both_required: true
  literal_template: '## OBJECTIVE\nTASK REQUIRING AI JUDGMENT: <state exactly what needs interpretation/cross-referencing, not a file-read>\n\n## SCOPE\n<exact input
    files/paths>. <exact output: function name, file, signature, or new-file path>.\n\n## KNOWN_CONTEXT\nzero_duplication_check_performed: true/false + evidence.
    <cite prior real findings, do not re-derive>\n\n## SUCCESS_CRITERIA\n<exact test command per deliverable, real output expected>\n\n## EXPECTED_OUTPUT\nCOMMIT:
    <exact files>. CHECKPOINT: status=pending_review, note=<real evidence>. NEXT_PHASE (if any): create AND start commands, both mandatory.\n\n## CONSTRAINTS\n<positive
    phrasing only, avoid ''do not X'' where X shares words with a positive statement elsewhere in this document>\n\n## COMPLEXITY_TIER\nmechanical | integrative |
    judgment'
  dispatch_exact_commands:
    create: python3 /opt/veridian/scripts/veridian-task.py create --title <kebab-case-title> --repo <repo_name> --prompt "$(cat <promptfile>)"
    start: systemctl --user start veridian-worker@<task-id>.service
    reset_if_rate_limited: systemctl --user reset-failed veridian-worker@<task-id>.service
    check_status: python3 /opt/veridian/scripts/check_latest_task.py
  close_ended_scope_explicit:
    applies_to_all_of:
    - analysis
    - gap_identification
    - planning
    - implementation
    - audit
    - prompts_to_ai_or_software
    rule: each of these 6 activity types must produce output with a defined end-state (specific fields filled, specific file written, specific status set) -- open-ended
      output ('see what we find', 'continue exploring', 'keep improving') is non-compliant regardless of which of the 6 categories it falls under
