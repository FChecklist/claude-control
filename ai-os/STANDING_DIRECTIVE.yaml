v2_task_gateway_software:
  file: scripts/task-gateway.py
  status: LIVE
  purpose: Single unified CLI implementing v2_task_lifecycle_pipeline phases 0/1/4/5/7/8/9/11 as real, callable commands, so no AI
    agent or router needs to remember/sequence superboss-register.py, veridian-task.py, and postflight_audit_gate.py in the right
    order manually. Wraps those already-built scripts (delegates all real work to them); does not reimplement their logic. Any AI
    router/agent on this server may invoke these subcommands identically -- takes no assumptions about who calls it.
  subcommands:
  - submit: 'phases 0+1. --text --source(owner|ai_agent) --session-id. Mechanical keyword extraction (regex: quoted strings, file
      paths, snake/kebab-case identifiers, item/rule-number references) -> superboss-register.py log-instruction -> check-duplicate
      + search with the extracted keywords -> collision_prevention_rule check (systemctl --user list-units veridian-worker@*
      --state=active, cross-referenced against the extracted keywords). Output: {instruction_id, duplicate_found, duplicate_evidence,
      prior_search_results, active_collision_task_ids, keywords_extracted, keyword_extraction_fallback_used}.'
  - start: 'phases 4+5. --instruction-id --title --repo --prompt-file. Validates the prompt-file has all 7 literal_template sections
      (## OBJECTIVE/SCOPE/KNOWN_CONTEXT/SUCCESS_CRITERIA/EXPECTED_OUTPUT/CONSTRAINTS/COMPLEXITY_TIER), rejecting with the exact
      missing-section list if not -> veridian-task.py create -> systemctl --user start (verification/idempotent, create already
      enables+starts) -> superboss-register.py log-work linking instruction_id to the new task via --ai-task-id. Output: {task_id,
      systemd_active, work_item_id}.'
  - log: 'mandatory call site for any AI agent doing real work under a task, so every step is logged without needing to know
      log-action''s raw syntax. --task-id --event. Resolves work_item_id from task_id via a read-only lookup in work_items
      (ai_task_id/software_task_id), then calls superboss-register.py log-action. Output: {action_id, work_item_id, work_item_resolved}.'
  - close: 'phases 7+9+11. --task-id --audit-cmd --evidence. verification_command_predefinition_rule enforcement: reads the task''s
      own prompt.txt, extracts its SUCCESS_CRITERIA section, and REJECTS if --audit-cmd is not found verbatim inside it (proven live,
      see real_test_evidence below) -- the audit command must have been pre-defined at plan/dispatch time, never authored fresh at
      close time. If it matches: runs postflight_audit_gate.py (the real audit, exit code decides DONE/FAILED). If verdict=DONE:
      superboss-register.py log-work --status closed, then veridian-task.py checkpoint --status completed. If verdict != DONE: does
      NOT close, task stays open, returns {audit_verdict, reason}.'
  - register-automation: 'phase 8. --path --category --layer --purpose --tags. Thin wrapper over superboss-register.py index-add
      (--status fixed to live), so registering a new artifact is discoverable under task-gateway.py --help alongside the other 5
      commands instead of being a separate mental model.'
  - status: '--task-id. Reads task.yaml, its latest checkpoint, live systemd active state, and the latest ai-os/logs/watchdog.jsonl
      entry for this task-id -- one command, one JSON answer for "is this task actually done". Output: {status, last_checkpoint_note,
      systemd_active, watchdog_last_action}.'
  real_test_evidence: 'TEST_1 (submit): `python3 scripts/task-gateway.py submit --text "test gateway build" --source ai_agent
    --session-id test-gw` returned real instruction_id INS-20260723-150851-e127 with real duplicate/search/collision data.
    TEST_2 (status): `python3 scripts/task-gateway.py status --task-id task-20260723-142643-build-veridian-task-watchdog-service`
    returned status=completed, last_checkpoint_note="worker finished, no changes to commit", systemd_active=false -- verified
    identical to that task''s real task.yaml (yaml.safe_load) and `systemctl --user is-active` (exit 3, inactive) at test time.
    TEST_3 (close, verification_command_predefinition_rule): `python3 scripts/task-gateway.py close --task-id
    task-20260723-142643-build-veridian-task-watchdog-service --audit-cmd "echo this-is-a-deliberately-wrong-command-not-in-success-criteria"
    --evidence "test rejection"` exited 1 with real rejection JSON: {"error": "verification_command_predefinition_rule violation:
    --audit-cmd was not found verbatim in task-20260723-142643-build-veridian-task-watchdog-service''s own pre-defined SUCCESS_CRITERIA
    (.../prompt.txt). postflight_audit_gate.py''s --audit-cmd must be copied VERBATIM from what was written at plan/dispatch time,
    never authored fresh at close time (self-certification is exactly what this rule prevents).", "provided_audit_cmd": "echo
    this-is-a-deliberately-wrong-command-not-in-success-criteria", "predefined_success_criteria": "TEST_1: `systemctl --user status
    veridian-task-watchdog.timer` shows active...(real SUCCESS_CRITERIA text, 3 TESTs)"} -- the real task was NOT closed, confirming
    the rule is enforced in software, not just documented.'
