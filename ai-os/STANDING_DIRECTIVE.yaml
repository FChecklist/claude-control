meta:
  id: STANDING-TASK-DIRECTIVE
  version: '2.6'
  effective_date: '2026-07-23'
  source: Owner directive, 2026-07-21 (chat)
  usage: Cite ai-os/STANDING_DIRECTIVE.yaml (or say 'check STANDING_DIRECTIVE.yaml') alongside any task to invoke the full protocol below.
precheck:
  items:
  - ai-os/MASTER_INDEX.yaml
  - system_index (superboss-register.py check-duplicate)
  rule: zero_duplication_mandatory
execution:
  location: ssh_only
  target: VERIDIAN-DEV
  ip: 167.233.220.35
  auth: claude_code_cli_subscription
  local_execution: forbidden
  mobile_execution: forbidden
  mobile_execution_note: 'Mobile devices (phone/tablet) are thin-client access only, same prohibition as RULE-067 (RULES_ARTICLES_198.json) already states for local
    machines: no development, execution, or AI processing shall occur on a mobile device, unless explicitly authorized. A mobile device may be used only to view or
    trigger work that still runs on VERIDIAN-DEV via SSH -- never as the machine doing the work.'
  owner_remote_access: laptop_or_mobile_thin_client_via_ssh
  owner_remote_access_note: 'Governance item 45 (allow_owner_connect_from_laptop_or_mobile). SSH (port 22) is a
    device-agnostic protocol -- the same auth/session mechanism this directive''s own laptop_role: ssh_client_only
    (below, line ~371) already documents applies identically to a mobile SSH client (e.g. Termius/Blink), no
    separate mobile-specific server-side mechanism exists or is needed. Re-verified live 2026-07-23 (phase 15):
    `ss -tlnp` shows sshd bound to 0.0.0.0:22 and [::]:22 (all interfaces, not restricted to a specific source);
    /etc/hosts.allow and /etc/hosts.deny both contain no active rules (comments only); fail2ban.service is active
    (running) -- an IP-based brute-force ban, orthogonal to device type, not a device-type gate. Honest caveat:
    this session has no root/sudo (same limitation as item 21''s auth.log gap), so /etc/ssh/sshd_config itself and
    any iptables/ufw rules could not be read directly to positively rule out an IP-allowlist; no evidence of one
    exists anywhere in this codebase or in crontab/systemd config, and the live network-level binding evidence
    above is the strongest signal available without root.'
guardrails:
  mandatory:
  - ai-os/RULES_ARTICLES_198.json
  - ai-os/AI_ENGINEERING_POLICY.yaml
  automation_scope_boundary: ai-os/AI_ENGINEERING_POLICY.yaml#automation_scope_boundary
  note: irreversible_actions_and_NEEDS_HUMAN_JUDGMENT_items_surface_to_owner_never_forced
logging:
  targets:
  - ai-os/boss/ACTIVE-CLAIMS.yaml
  - ai-os/boss/COMPLETED.yaml
  - system_index
  scope: all_work_plus_this_conversation
verification:
  mechanism: ai-os/audit198/run-audit.mjs
  method: re_run_evidence_based
  self_certification: forbidden
  targets:
    contradiction: 0
    duplication: 0
    gaps: 0
    implementation_pct: 100
  mechanism_correction_note: 'corrected 2026-07-22: prior value ''ai-os/scripts/audit198/run-audit.mjs'' does not exist on disk (confirmed via exhaustive search across
    the whole server, including every task worktree). Real script confirmed via git history (commit 1fde5a06) and live file presence.'
automation:
  level: 100
  manual_steps: 0
  exceptions_ref: guardrails.automation_scope_boundary
sync_scope:
  systems:
  - server
  - github
  - vercel
  - supabase
  requirement: complete_sync
on_complete: notify_owner
assistant_working_protocol:
  id: ASSISTANT-WORKING-PROTOCOL
  version: '10.0'
  effective_date: '2026-07-22'
  source: Owner directive, 2026-07-22 (chat) -- 11 named shortcomings observed across this session's work
  applies_to: claude_assistant_only
  rule_1_system_map_required:
    trigger: before_any_new_analysis
    requirement: consult_standing_system_map_before_starting
    map_location: ai-os/SYSTEM_MAP.yaml
    map_status: BUILT_PARTIAL_2026_07_22
    fixes:
    - fragmented_analysis
    - no_whole_system_view
    - no_dependency_map
    map_status_note: 26/28 subsystems, 30 real edges from sample files, not yet a full 913-route/5019-function call graph -- see ai-os/SYSTEM_MAP.yaml coverage_honesty
      field
  rule_2_no_forgetting:
    trigger: start_of_every_task
    mandatory_steps:
    - run ai-os/scripts/session_bootstrap.py (now includes an automatic file-inventory diff -- new/changed/missing files since the last prompt, not just register
      history)
    - read the NEW/CHANGED/MISSING file list it prints before assuming nothing changed since last time
    - state what is already known before starting new work
    fixes:
    - forgetting
  rule_3_completion_gate:
    trigger: before_marking_any_task_done
    mandatory_questions:
    - 'what_was_asked: exact scope in requester''s own words'
    - 'what_was_delivered: with an attached evidence artifact'
    - 'coverage_pct: exact number, never rounded up'
    - 'depth: live-verified this session, or assumed/inferred'
    status_chain: NOT_STARTED -> IN_PROGRESS -> CLAIMED -> VERIFIED -> REGRESSED
    rule: CLAIMED_is_not_DONE_anywhere_including_chat_responses
    fixes:
    - reporting_incomplete_as_complete
    - shallow_audit
  rule_4_self_review_pass:
    trigger: before_presenting_any_output_to_owner
    mandatory_checks:
    - 'unbacked_claims: flag and verify or remove before presenting'
    - 'contradictions: check against system map and register history'
    - 'scope_check: whole system vs the convenient slice that was easy to check'
    fixes:
    - no_self_audit
    - no_self_review
  rule_5_no_guessed_schemas:
    trigger: before_writing_any_verification_script
    requirement: read_one_real_sample_record_first_every_time
    rule: never_assume_field_or_column_names
    incident_ref: '2026-07-22: guessed field ''status'' (real: ''verdict'') in RULES_ARTICLES_198.json; guessed field ''name'' (real: ''table_name'') in DATABASE_CATALOG.json
      -- both produced a false ''does not exist'' result before being caught and corrected same session'
    fixes:
    - preventable_mistakes
    - shallow_work
  enforcement: self_applied_every_session_by_the_assistant
  violation_handling: disclose_immediately_when_caught_never_let_a_wrong_claim_stand_uncorrected
  automated_enforcement:
    session_bootstrap_script: ai-os/scripts/session_bootstrap.py
    session_bootstrap_usage: python3 ai-os/scripts/session_bootstrap.py [N] -- run as the FIRST command of every task, no exception. Reads real register history (SQLite,
      not keyword search) plus SYSTEM_MAP/MASTER_ARCHITECTURE/STANDING_DIRECTIVE state. Fixes rule_2_no_forgetting mechanically instead of relying on the assistant
      remembering to check.
    file_edit_guard_script: ai-os/scripts/file_edit_guard.py
    file_edit_guard_usage: python3 ai-os/scripts/file_edit_guard.py <before_path> <after_path> -- run after EVERY edit to any tracked YAML/JSON file (STANDING_DIRECTIVE.yaml,
      SYSTEM_MAP.yaml, MASTER_ARCHITECTURE_2026-07-22.yaml, or any future one). Exits non-zero if a header comment or a top-level key was silently lost. Fixes rule_4_self_review_pass
      mechanically -- retroactively proven against the real 2026-07-22 header-strip incident (FAIL correctly reproduced on a synthetic broken copy) before being trusted.
    principle: 'software checks, assistant does not self-certify -- per Owner directive 2026-07-22: minimum assistant judgment, maximum script enforcement'
  rule_6_mandatory_close_out:
    trigger: end_of_every_task_unconditionally
    mandatory_updates:
    - log-work in superboss-register.py (real, not skipped)
    - update SYSTEM_MAP.yaml if any architecture fact changed
    - update MASTER_ARCHITECTURE_2026-07-22.yaml if any subsystem/brand status changed
    - append one line to changelog (this file, below) describing what changed and why
    fixes:
    - files_not_updated_after_task
    - forgetting
  the_one_command:
    script: ai-os/scripts/veridian_self_check.py
    usage: python3 ai-os/scripts/veridian_self_check.py -- run this FIRST, every task, no exception. Mechanically tests every checkable item in this directive against
      real current state (file existence, script presence, self-test of file_edit_guard, SYSTEM_MAP completeness, recent work_item status hygiene) and logs the result
      to directive_compliance_runs in the register. Replaces separately running session_bootstrap.py + manually reasoning about compliance.
    note_2026_07_22: 'first real run caught 2 bugs in the checker itself before being trusted: a SQLite PRIMARY KEY collision (multiple checks sharing one run_id),
      and an open-ended find over ai-os/tasks/* that hung 40s+ due to hundreds of stale worktree copies -- fixed to a bounded, fast check, honestly labeled as bounded
      not exhaustive.'
  metadata_store:
    canonical_location: ai-os/memory/superboss-register.sqlite
    tables:
      work_items: status of every discrete task (DONE/PARTIAL/etc) -- query this, do not re-derive status from memory or prose
      system_index: status of every registered mechanism/registry/script
      directive_compliance_runs: history of every self-check run, new 2026-07-22, added by this session not a duplicate of the above
    rule: this SQLite DB is THE metadata store. No second parallel store is to be created -- extend these tables, never fork a new one, per the zero-duplication precheck
      rule already in this file.
  automation_vs_guardrail_precedence:
    rule: if 100pct-automation ever conflicts with a guardrail or an irreversible-action check, the guardrail always wins. Automation is the default; it is never
      the override.
    why: automation.level:100/manual_steps:0 could otherwise be read as license to auto-execute something guardrails.note says must surface to the Owner -- this makes
      the precedence explicit so that conflict is never resolved by assumption.
  rule_7_universal_task_registration:
    scope: applies to EVERY actor -- this assistant, any AI model, AI agent, AI router (incl. Mother Router), AI team, or software process -- not the assistant alone
    rule: every task, regardless of who/what performs it, must have an ai_task_id or software_task_id recorded in the register (ai-os/memory/superboss-register.sqlite).
      No unlogged task is permitted.
    fixes:
    - work happening outside the register, invisible to future audits
  rule_8_mandatory_audit_before_completion:
    scope: applies to EVERY actor, same as rule_7 -- universal, not assistant-only
    rule: no task may be recorded as DONE or FAILED except via ai-os/scripts/postflight_audit_gate.py, which runs a real audit command and records its actual exit
      code before writing status. Self-certified DONE/FAILED (a bare superboss-register.py log-work call claiming a terminal status without going through the gate)
      is DEPRECATED as of 2026-07-22.
    mechanism: ai-os/scripts/postflight_audit_gate.py -- takes --audit-cmd (a real shell command), runs it, writes the real exit code to a new task_audits table,
      and only then calls log-work with the status the exit code actually produced. There is no parameter to force DONE.
    proof_2026_07_22: 'tested both directions before being trusted: a genuinely-passing audit command produced DONE (WRK-20260722-051809-555d, audit AUD-20260722-051809-de23e1);
      a genuinely-failing one produced FAILED (WRK-20260722-051809-110f, audit AUD-20260722-051809-47f9ff), exit code 1, not silently overridden.'
    honest_limitation: the gate proves the audit command's real exit code, not that the audit command itself was well-chosen for the task -- a shallow audit-cmd (e.g.
      just checking a file exists) still passes the gate. Choosing a genuinely end-to-end audit command for each task remains a judgment call this gate cannot make;
      it only guarantees that whatever command IS specified was actually run and not faked.
  file_inventory:
    script: ai-os/scripts/file_inventory.py
    scope: ai-os/ and scripts/ only (canonical system-of-record) -- pruning ai-os/tasks/*/workspace (9.8 MILLION files confirmed there, correctly excluded), node_modules,
      .git, per MASTER_INDEX.yaml's own documented exclusion_rules
    mechanism: stores path+size+mtime+hash16 per file in a new file_inventory register table; every run diffs against the previous run and reports NEW/CHANGED/MISSING
      before overwriting the baseline
    wired_into: ai-os/scripts/session_bootstrap.py -- runs automatically as part of the one mandatory first command, not a separate thing to remember
    proof_2026_07_22: baseline run found 2338 real files; a deliberately-added test file was correctly caught as the only NEW file on the next run; after deleting
      it, correctly reported as MISSING; unrelated files (cron logs, the register DB) correctly reported as CHANGED, nothing silently missed
    root_cause_fixed: files were being discovered reactively, one grep at a time, whenever a specific question happened to surface one -- this replaces that with
      one exhaustive, diffable inventory that runs every prompt
  pipeline_a_owner_assistant:
    status: ACTIVE_MOST_STAGES_BUILT
    conversation_store: ai-os/memory/superboss-register.sqlite, verified placeholder at ai-os/RAJAT_PROMPT_STORE.md
    analysis_before_work: ai-os/scripts/session_bootstrap.py
    software_first_decision: principle established, not mechanically gated (judgment call each time)
    completion_audit: ai-os/scripts/postflight_audit_gate.py
    reject_then_rca: task_audits + rca_open tables; OPEN_NEEDS_RCA items auto-surface in session_bootstrap.py -- proven 2026-07-22 with a real triggered failure (AUD-20260722-053955-ac5f50)
    save_and_document: rule_6_mandatory_close_out
    unresolved: what 'a proper prompt made for internal use by ai for ai by snip' refers to -- not guessed, needs Owner clarification
  pipeline_b_end_user_veridian:
    status: DOCUMENTED_TARGET_NOT_BUILT
    reason_deferred: 'Owner directive 2026-07-22: build the system to run the assistant reliably BEFORE building the analogous system for VERIDIAN AI OS end users.
      This is product-level work (VERI Chat, live end-user conversation storage, a live completion-certificate gate on real user-facing tasks) -- structurally the
      same pattern as pipeline_a, not started.'
    structural_analogy: end_user -> browser/web app -> server -> software -> END_USER_store (VERI<->end-user conversation) -> prompt analysis -> software/AI dispatch
      decision -> completion -> software audit -> accept or RCA -> save+document -> verified placeholder pointer to the END_USER store
    do_not_start_until: pipeline_a is confirmed stable across a real multi-session test, and the still-open items (task 1-15 list, SYSTEM_MAP completeness) are resolved
  certificate_of_completion_terminology:
    note: Owner's phrase 'AI needs a certificate of completion by the software after software does the audit' is exactly what ai-os/scripts/postflight_audit_gate.py
      already produces (an audit_id + verdict, backed by a real exit code) -- renaming the concept here for clarity, no new mechanism needed.
  system_is_the_memory:
    principle: 'Owner directive 2026-07-22: no AI agent''s own conversational memory is the source of truth for anything. The SYSTEM (server-side software, scripts,
      databases) is the memory. Every actor below must persist its own state in software, not rely on being remembered.'
    per_actor_memory_audit_2026_07_22:
      superboss_this_assistant:
        status: ACTIVE
        store: ai-os/memory/superboss-register.sqlite
        detail: instructions/work_items/actions/system_index/file_inventory/task_audits/rca_open tables, all confirmed live this session
      per_task:
        status: ACTIVE
        store: ai-os/tasks/<id>/task.yaml
        detail: 291 real task.yaml checkpoint files confirmed to exist on disk 2026-07-22 -- this mechanism is real and in use, not aspirational
      mother_router:
        status: CONFIRMED_GAP_NOT_FIXED
        detail: grep of mother-router.ts found ZERO persistence references (no pgTable, no sqlite, no memory/persist keyword) -- it is fully stateless per call today.
          This is real VERIDIAN AI OS product code (compliance-tracker repo), not assistant-ops tooling -- deferred to pipeline_b per the Owner's own established
          sequencing (fix the assistant's own system first). NOT built tonight, honestly, not silently skipped.
      ai_router_hierarchy_roster:
        status: CONFIRMED_GAP_NOT_FIXED
        detail: src/lib/ai-team/roster.ts (195 roles) is a static in-code array, zero persistent per-role memory table found. Same deferral reasoning as mother_router.
    execution_model_change:
      rule: 'Owner directive 2026-07-22, standing until otherwise instructed: substantive multi-step work between Owner and Assistant should run via a server-side
        Claude Code CLI process (or another AI model on the server), NOT as a long chain of individual SSH commands issued one at a time from the laptop-side conversation.'
      mechanism_reused_not_reinvented: /opt/veridian/scripts/veridian-task.py (create/checkpoint/resume-context/record-usage/status) + /opt/veridian/scripts/worker-entrypoint.sh
        -- this infrastructure already exists (systemd --user services, auto-checkpointing, survives disconnection) and is the correct existing mechanism to dispatch
        through, not a new one.
      honest_status: adopted as the standing rule 2026-07-22; NOT yet proven end-to-end in this exact session (no new worker was spawned via veridian-task.py this
        turn, given time already spent) -- next concrete step, not claimed done.
  cron_scheduled_automation_2026_07_22:
    principle: 'Owner directive 2026-07-22: everything built before this point in the session (session_bootstrap.py, veridian_self_check.py, file_inventory.py) still
      depended on an AI choosing to run it -- one layer removed from the exact forgetfulness problem this whole session exists to fix. The only mechanism that runs
      independent of any AI''s memory, presence, or discipline is the OS scheduler itself.'
    what_changed: veridian_self_check.py and file_inventory.py are now REAL crontab entries, wrapped through the existing /opt/veridian/scripts/run-logged.sh (the
      same universal execution wrapper every other cron job on this server already uses -- not a new mechanism, the proven existing one). They now run every 15/20
      minutes respectively, whether or not any AI session, Claude Code instance, or human is active.
    schedule:
      veridian-self-check: '*/15 * * * *, logs to ai-os/logs/veridian-self-check-cron.log'
      file-inventory: '*/20 * * * *, logs to ai-os/logs/file-inventory-cron.log'
    failure_escalation: veridian_self_check.py now writes directly to ai-os/logs/ATTENTION.md (the same live alert surface already used by health-check-15min.py etc.)
      whenever any check FAILs or ERRORs -- proven with a real triggered write during this session (RUN-20260722-061117, the genuine SYSTEM_MAP 26/28 gap), not a
      synthetic test.
    installation_proof: crontab backed up before editing, new file installed, then diffed against the backup -- confirmed the ONLY change was the 2 new lines appended,
      all 10 pre-existing cron jobs byte-identical, nothing disturbed.
    honest_remaining_dependency: this closes the loop for THIS server's own compliance/inventory checks. It does NOT yet mean every OTHER AI actor (Mother Router,
      other AI agents/routers) is covered -- those still have no persistent memory at all (see cross_system_memory_map_2026_07_22 in MASTER_INDEX.yaml), so there
      is nothing yet for a cron job to audit there. Automating the audit of a system that itself has no memory is the next problem, not solved by this change.
  registry_completeness_2026_07_22:
    root_cause: 'Owner caught a precise, damning fact: run-logged.sh was already registered in MASTER_INDEX.yaml since 2026-07-20, with a detailed, correct entry
      -- and this session still had to rediscover it by accident via crontab -l while building tonight''s cron automation. This was not a missing-data problem for
      that one case, it was a not-checking-the-tool-that-already-existed problem.'
    second_real_finding: separately, a mechanical cross-reference of all real .py/.sh files in /opt/veridian/scripts and /opt/veridian/ai-os/scripts against MASTER_INDEX.yaml
      found 32 of 41 real scripts (78 percent) had NO registry entry at all -- a genuine data-completeness gap, distinct from the process failure above.
    fixes_applied:
      data_gap: 'all 32 missing scripts registered in MASTER_INDEX.yaml (registries: 54 -> 86), each with a purpose string taken from the script''s own header comment,
        not assistant-authored, guard-checked before being logged done'
      process_gap: 'session_bootstrap.py now prints the FULL 86-entry registry (not just recent history) as part of its mandatory output, and explicitly instructs
        running superboss-register.py check-duplicate before writing any new script -- proven working: check-duplicate "cron wrapper logging" returned a STOP verdict
        with 11 real matches including the exact mechanism that was almost rebuilt from scratch'
    principle: the memory layers described across this whole session (Superboss register, per-task memory, MASTER_INDEX registry) are only useful if they are actually
      queried before new work starts, not just written to after. check-duplicate and the full registry printout are now the mechanical enforcement of that -- available
      in every bootstrap run, not dependent on the assistant remembering they exist.
  auto_propagation_2026_07_22:
    mechanism: 'postflight_audit_gate.py now automatically, on EVERY call (not optionally): (1) re-runs file_inventory.py so the file diff reflects the just-completed
      task immediately, (2) scans the task''s own --content for a file path under ai-os/ or scripts/ not yet in MASTER_INDEX.yaml and writes it to a new unregistered_mentions
      table if found'
    proof_2026_07_22: tested with a deliberately fake unregistered path in --content -- correctly auto-flagged into unregistered_mentions with zero further AI action;
      then confirmed session_bootstrap.py automatically surfaces it on the next run
    principle: this is memory updating other memory automatically, inside the one shared gate every actor's terminal status already goes through -- not a separate
      step an AI could forget to run
    scope_honesty: this covers layer_2 (Superboss) <-> layer_7 (script registry) propagation. It does NOT create any memory for Mother Router or the AI roster, because
      those layers have no memory to propagate to or from -- see system_memory_architecture layers 3/4/5
changelog:
- date: '2026-07-23'
  change: 'Found ai-os/memory/superboss-register.sqlite silently corrupted (truncated write, disk image malformed) since 2026-07-22T12:20 -- ~17.5 hours during which
    session_bootstrap.py, check-duplicate, log-work, veridian_self_check.py (15-min cron) and file_inventory.py (20-min cron) were all failing with no ATTENTION.md
    escalation, because the failure occurred before any of those scripts reached their own alerting code (which itself wrote to the same broken DB). Root cause: file
    was exactly one 4096-byte page short of its own header-declared size (a truncated write). Recovery attempted 3 independent ways (page padding, real sqlite3 CLI
    .recover/.dump -- lacks dbpage vtab in this Ubuntu build, apsw build from source) before concluding data recovery was not feasible with available tools; corrupt
    original quarantined at ai-os/memory/superboss-register.sqlite.CORRUPTED-2026-07-22-quarantined plus 2 backups under /opt/veridian/backups/sqlite-recovery-2026-07-23/,
    then reinitialized via superboss-register.py init (real schema, not guessed). Fixed the escalation gap itself, not just this one incident: added check_db_integrity_and_backup()
    to scripts/health-check-15min.py (runs every 15min via the existing cron, reuses the existing anomalies -> ATTENTION.md -> notify-owner.py path, adds the first-ever
    daily backup of both sqlite DBs to /opt/veridian/backups/sqlite-daily/, 14-day retention). Verified end-to-end via postflight_audit_gate.py (AUD-20260723-055909-480161,
    DONE) from task-20260723-052857-execution-rules-phase0-analysis-and-buil.'
- date: '2026-07-22'
  change: added automated_enforcement (session_bootstrap.py, file_edit_guard.py) and rule_6_mandatory_close_out to assistant_working_protocol, per Owner directive
    that rules must be software-enforced, not self-promised
- date: '2026-07-22'
  change: 'added the_one_command (veridian_self_check.py), metadata_store (declares superboss-register.sqlite as canonical, no second store), automation_vs_guardrail_precedence.
    Per Owner directive: build the system to run the assistant reliably before continuing VERIDIAN AI OS work.'
- date: '2026-07-22'
  change: 'added rule_7_universal_task_registration and rule_8_mandatory_audit_before_completion, backed by new ai-os/scripts/postflight_audit_gate.py and task_audits
    table. Per Owner directive: applies to every AI agent/router/model/software, not just this assistant.'
- date: '2026-07-22'
  change: added file_inventory.py, wired into session_bootstrap.py so every prompt automatically gets a NEW/CHANGED/MISSING file diff against the canonical ai-os/+scripts/
    tree, using MASTER_INDEX.yaml's own prune-based exclusion rule. Fixes the repeated 'finding new files reactively' pattern named explicitly by the Owner.
- date: '2026-07-22'
  change: formalized pipeline_a (Owner<->Assistant, active) and pipeline_b (end-user<->VERIDIAN, documented target, explicitly deferred) per Owner's dual-pipeline
    description. Added rca_open auto-surfacing to session_bootstrap.py (proven with a real triggered failure). Added verified RAJAT_PROMPT_STORE.md placeholder (checked
    live counts before writing, then proven by following its own instructions).
- date: '2026-07-22'
  change: 'formalized system_is_the_memory: per-actor memory audit (Superboss+task memory ACTIVE and real; Mother Router+AI Router roster CONFIRMED stateless, honestly
    flagged as deferred VERIDIAN-product work, not fixed tonight) and execution_model_change (dispatch via existing veridian-task.py/worker-entrypoint.sh server-side
    CLI infra going forward, adopted but not yet proven this session).'
- date: '2026-07-22'
  change: 'Moved veridian_self_check.py and file_inventory.py from AI-invoked scripts to real crontab entries via the existing run-logged.sh wrapper -- runs every
    15/20 min independent of any AI session. Added automatic ATTENTION.md escalation on FAIL, proven with a real triggered write. This is the definitive answer to
    the Owner''s repeated ''accept-apologize-forget-repeat'' complaint: the check no longer depends on any AI remembering to run it.'
- date: '2026-07-22'
  change: 'Closed a real 32-of-41 script registry gap in MASTER_INDEX.yaml (54->86 entries). Fixed the deeper process failure: session_bootstrap.py now prints the
    complete registry and mandates superboss-register.py check-duplicate before any new script is written -- proven to actually surface run-logged.sh via a real query,
    not asserted.'
- date: '2026-07-22'
  change: 'Implemented auto-propagation in postflight_audit_gate.py: every terminal-status write now automatically re-scans file_inventory and flags unregistered
    file mentions, surfaced automatically in session_bootstrap.py. Proven end-to-end with a real test before being logged done.'
- date: '2026-07-23'
