phase_dependency_table:
  - from: phase-0
    to: phase-1
    mechanism: "File/binary dependency -- Phase 1 scripts invoke the literal binaries Phase 0 installed at
      ~/.local/bin/{gitleaks,trivy,checkov,dependency-check} and emit into the schema Phase 0 designed."
  - from: phase-0
    to: phase-4
    mechanism: "Content dependency -- Phase 4's bounded-context/layer maps require Phase 0's domain table
      (this file) as the starting taxonomy of what 'architecture' even means for VERIDIAN."
  - from: phase-0
    to: phase-6
    mechanism: "Content dependency -- Phase 6 scripts are scoped directly from Phase 0's workflow/ai-governance
      domain rows above; no other phase's output is read."
  - from: phase-1
    to: phase-2
    mechanism: "Infra reuse -- Phase 2's schemathesis + axe-core-adjacent work reuses the running-app
      infrastructure Phase 1's ux/axe-core step stands up, rather than duplicating it."
  - from: phase-1
    to: phase-3
    mechanism: "Convention reuse only (same finding-record emission pattern) -- no literal artifact dependency,
      can run in parallel with Phase 2 in real multi-task dispatch."
  - from: phase-2 (api-contract)
    to: phase-2 (integration)
    mechanism: "Hard literal file dependency within the same phase -- schemathesis's CLI invocation takes the
      OpenAPI document path as a required argument; zero docs authored means zero schemathesis executions
      possible, confirmed by this tool's own CLI contract, not assumed."
  - from: phase-4
    to: phase-5
    mechanism: "Query dependency -- Phase 5's AI Review passes query knowledge_engine/finding-record rows with
      remediation_type=ai_escalation_required that Phase 4's dependency-cruiser runs (and Phases 1-3) wrote;
      Phase 5 cannot run meaningfully before at least one upstream phase has written rows to read."
  - from: phase-1..phase-6
    to: phase-7
    mechanism: "Interface-then-traffic dependency -- Phase 7's event-schema interface is designed in Phase 0
      and imported by Phases 1-6 as they're built, but Phase 7's OWN emitter-library build + OTel/pgAudit
      wiring is sequenced last so there is real event traffic to validate the wiring against."
  - from: phase-7
    to: phase-8
    mechanism: "Data dependency -- the master report software's queries are written against Phase 7's actual
      event-stream + finding-record tables; cannot be authored against tables that don't exist yet."

