# ============================================================================
# PHASES
# ============================================================================
phases:
  - id: phase_1_prompt_registry_lifecycle_foundation
    name: "Prompt Registry, Version, Lifecycle, Validation Engines + Metadata Schema (data-model foundation)"
    objective: "Build the foundational prompt data model every other phase depends on: a real,
      queryable prompt registry (unique IDs, indexing, discovery), semantic versioning with diff/
      rollback, a Draft->Review->Staging->Production->Deprecated lifecycle state machine with
      approval-gate hooks (gates themselves wired in phase_3), schema validation, and the 200+
      field/18-category metadata schema (2.6) every registered prompt must carry. This phase is
      config/schema design + a real live table, not application UI -- can proceed in
      claude-control (extending scripts/superboss-register.py the same way capability_registry
      and knowledge_engine tables were added) regardless of the owner_decision_dependency above."
    scope:
      - "Gap items closed: engine-prompt-registry, engine-prompt-version, engine-prompt-lifecycle,
        engine-prompt-validation, metadata-schema-200-fields, governance-lifecycle-state-machine
        (bare state machine only -- the approval-gate ENFORCEMENT itself is phase_3 scope, not
        this phase's, per that item's own note distinguishing the state machine from its governance gates)."
      - "Add a prompt_registry table (+ prompt_versions, prompt_metadata) to
        scripts/superboss-register.py's existing SQLite DB, mirroring knowledge_engine/
        capability_registry's own init_db()/register/lookup/list CLI pattern (per this session's
        own zero-duplication precedent -- do not build a 4th, differently-shaped datastore)."
      - "Define the metadata schema as a real JSON Schema file (ai-os/PROMPT_METADATA_SCHEMA_2026-07-25.schema.json
        or similar), covering the 18 categories the document names (2.6) at minimum-viable field
        depth, not literally all 200+ fields verbatim -- match this session's own precedent of
        building the minimum real schema a validator can enforce (AUDITOR_ENGINE's
        metadata domain used the same approach)."
      - "Register the new table + schema in MASTER_INDEX.yaml and via superboss-register.py
        register-knowledge, citing this gap analysis + phase plan as evidence."
    depends_on: []
    external_depends_on: []
    status: not_started
    success_criteria:
      - "python3 scripts/superboss-register.py list-entities --table prompt_registry  # exits 0 once the table exists (empty list is fine)"
      - "test -f ai-os/PROMPT_METADATA_SCHEMA_2026-07-25.schema.json  # exits 0"
      - "python3 scripts/superboss-register.py query-knowledge \"veridian_v2_prompt_registry\" --tag domain:veridian_architecture_v2  # found=1"

  - id: phase_2_compiler_pipeline_intelligence_engines
    name: "Prompt Compiler Pipeline core (non-browser stages 1-25) + Intelligence/Matching Engines"
    objective: "Extend scripts/prompt_gateway/'s real but narrow prompt_engine.py/classifier.py/
      context_engine.py (gap analysis: engine-prompt-compiler, engine-intent, engine-context all
      partially_implemented) into the document's own Layer 2-5 pipeline (Lightweight Analysis
      through Verification, pipeline-lightweight-analysis through pipeline-verification) and the
      remaining Intelligence & Matching engines with no prior art (Entity, Variable, Ranking,
      Recommendation, Similarity, Workflow, Capability, Confidence -- multi-signal). Depends on
      phase_1 because compiled/versioned output needs somewhere real to be stored and versioned."
    scope:
      - "Gap items closed: engine-prompt-compiler (deepen), engine-prompt-optimizer,
        engine-prompt-expansion, engine-prompt-testing, engine-prompt-benchmark,
        engine-prompt-portability, engine-prompt-ab, engine-prompt-ranking,
        engine-prompt-recommendation, engine-prompt-similarity, engine-intent (deepen to
        multi-level), engine-entity, engine-variable, engine-context (deepen), engine-confidence
        (deepen to multi-signal), pipeline-lightweight-analysis (deepen), pipeline-context-assembly
        (deepen), pipeline-prompt-construction (deepen), pipeline-verification."
      - "OWNER DECISION CHECK: confirm ai-os/OWNER_DECISIONS_NEEDED_2026-07-23.yaml id
        veridian-architecture-v2-target-repo-anchor is resolved before writing any application
        code -- this is the first phase in this plan that does. If unresolved, this phase's own
        task must re-raise it rather than default silently."
      - "Dispatch as a compliance-tracker-scoped task (per meta.cross_repo_dispatch_note) extending
        prompt_engine.py/classifier.py/context_engine.py's real algorithms into the target repo's
        own application code, backed by phase_1's prompt_registry table for versioned storage."
    depends_on: [phase_1_prompt_registry_lifecycle_foundation]
    external_depends_on:
      - "repos/compliance-tracker (repo: compliance-tracker, not claude-control) -- this phase
        writes application code outside this session's own repo boundary once the target-repo
        decision resolves; must be dispatched as (or coordinate with) a compliance-tracker-scoped task."
    status: not_started
    success_criteria:
      - "python3 scripts/superboss-register.py query-knowledge \"veridian_v2_compiler_pipeline\" --tag domain:veridian_architecture_v2  # found=1"
      - "A compliance-tracker-side smoke test the dispatched task must define and paste real output
        for (e.g. a CLI/route that classifies+compiles+versions one real sample prompt end to end,
        exit 0) -- cannot be pre-specified here since the target module doesn't exist yet; the
        dispatched task's own SUCCESS_CRITERIA must include one, per this plan's own concrete-command convention."

