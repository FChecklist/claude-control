  method: "Same discipline as every prior phase in the parent plan: real investigation (grep + live file
    reads across all 3 product repos -- compliance-tracker, projexa, veda-advisors -- plus the
    veridian-ui-kit shared package) before any conclusion, not assumption. This phase's own objective
