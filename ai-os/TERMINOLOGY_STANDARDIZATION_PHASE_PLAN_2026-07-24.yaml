dependency_table:
  - from: phase_0_dictionary_guardrail_design_phase_plan
    to: phase_1_dictionary_coverage_expansion
    mechanism: "File dependency -- Phase 1 re-runs generate_variable_dictionary.py's exact
      combined_reference_score ranking with a larger TOP_N; it needs that ranking function proven correct
      against the real top-20 first (this task's own 320-entry output)."
    status: done
  - from: phase_0_dictionary_guardrail_design_phase_plan
    to: phase_2_directory_scoped_rollout
    mechanism: "Direct mechanism dependency -- Phase 2 runs the same ai-os/TERMINOLOGY_GUARDRAIL_2026-07-24.py
      script this task built and smoke-tested against 3 files, widened to full directories."
    status: done
  - from: phase_2_directory_scoped_rollout
    to: phase_3_ci_enforcement_wiring
    mechanism: "Content dependency -- the CI job's exemption file needs Phase 2's real per-directory findings
      baseline as its initial content; wiring CI before that baseline exists means either blocking every build
      on unexempted legacy findings or shipping an exemption file with no real basis."
    status: done
  - from: phase_1_dictionary_coverage_expansion
    to: phase_3_ci_enforcement_wiring
    mechanism: "Soft accuracy dependency (not a hard block) -- CI enforcement is meaningful with only the
      top-20 dictionary (this task's real output), but false negatives (findings with no dictionary match)
      drop as Phase 1's coverage tiers land."
    status: done
  - from: "compliance-tracker/.github/workflows/ci.yml (external repo)"
    to: phase_3_ci_enforcement_wiring
    mechanism: "Hard external file dependency -- this phase edits a file that lives in the compliance-tracker
      repo, not claude-control (this task's own repo). Must be dispatched as, or coordinated with, a
      compliance-tracker-scoped task."
    status: done
  - from: phase_3_ci_enforcement_wiring
    to: phase_4_existing_hardcoded_example_migration
    mechanism: "Content dependency -- Phase 4's migration_completion_pct metric is defined relative to Phase
      3's exemption file; there is nothing to 'pay down' until that file exists as the ledger."
    status: planned
  - from: phase_4_existing_hardcoded_example_migration
    to: phase_5_full_enforcement_and_dictionary_completion
    mechanism: "Content dependency -- exemption-file retirement and full-repo-scan widening are only correct
      once Phase 4's real migration_completion_pct metric reads 100% for every Phase-2-enumerated directory."
