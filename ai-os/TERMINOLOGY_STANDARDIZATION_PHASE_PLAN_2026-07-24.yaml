# ============================================================================
# PHASES -- Phase 0 is this task. Phases 1-5 map to this task's own SCOPE
# item 3 (phased rollout: dictionary coverage growth, directory-scoped
# guardrail rollout, CI enforcement wiring, migration of existing hardcoded
# examples, full repo-wide enforcement).
# ============================================================================
phases:
  - id: phase_0_dictionary_guardrail_design_phase_plan
    name: Variable Dictionary, guardrail design + smoke test, this phase plan (this task)
    status: this_task
    scope:
      - "Build ai-os-scripts/generate_variable_dictionary.py and run it against the real
         ai-os/DATABASE_CATALOG.json (444 tables) to produce ai-os/VARIABLE_DICTIONARY_2026-07-24.yaml --
         320 real <Entity.Attribute> placeholder entries across the top 20 most-referenced tables, 182 example
         values sourced from real dev-seed rows (fetched live via Supabase MCP against the verdian-ai project
         that backs compliance-tracker/src/lib/db/schema.ts), 138 clearly-marked synthetic."
      - "Design ai-os/TERMINOLOGY_GUARDRAIL_2026-07-24.py: flags hardcoded human-example literals (placeholder
         company/person names, fake email domains, bare ISO dates, PAN/GSTIN-shaped literals) not expressed as
         a registered placeholder, plus unregistered-placeholder-token drift. Smoke-tested (not rolled out)
         against 3 real files -- 36 real findings, saved to
         ai-os/TERMINOLOGY_GUARDRAIL_SMOKE_TEST_FINDINGS_2026-07-24.json."
      - "Write this phase plan."
      - "Register all 3 files in knowledge_engine and MASTER_INDEX.yaml registries.terminology_standardization."
    depends_on: []
    dependency_mechanism: "n/a -- entry phase. Reads (does not modify) /opt/veridian/ai-os/DATABASE_CATALOG.json
      and ai-os/CAPABILITY_REGISTRY_SCHEMA_2026-07-24.yaml (read for cross-link/registration purposes only,
      per this task's own KNOWN_CONTEXT scoping note)."

  - id: phase_1_dictionary_coverage_expansion
