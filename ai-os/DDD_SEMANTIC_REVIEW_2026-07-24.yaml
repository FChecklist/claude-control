meta:
  title: VERIDIAN DDD Semantic-Correctness AI Review (Phase 5)
  created: '2026-07-24'
  produced_by_task: task-20260724-144915-phase5-remaining-ai-review-lane-read-onl
  precedent: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phase-5 scope: 'ddd domain -- aggregate/entity/
    value-object semantic correctness (dependency-cruiser cannot check this; business-capability's map
    itself is co-scheduled into Phase 4, see above)'. Same structure as
    ai-os/ENTERPRISE_ARCHITECTURE_DRIFT_REVIEW_2026-07-24.yaml (Phase 4's own AI Review pass) -- real
    judgment content produced by this task, not generated by a tool. Reads the 4 real
    ddd-no-cross-context-api findings ai-os-scripts/audit_pipeline_architecture.py wrote into
    audit_findings (domain=ddd, all software_fixable) as its deterministic input signal, per this plan's
    own PART5 rule (AI Review adds judgment on top of what software already found, never re-does
    software's job)."
  method: "Direct read of the real route handler files behind all 4 flagged findings, the real Drizzle
    schema files in compliance-tracker/projexa/veda-advisors, and cross-repo grep for aggregate-identity
    and money-value-object patterns. Every finding below cites the exact file(s) read as evidence -- no
    finding is asserted from filename/directory-name inference alone."

repos:
  compliance-tracker:
    ddd_findings:
      - id: DDD-AI-001
        severity: low
        title: "The 4 flagged 'cross-context' imports are literal re-exports within one documented bounded context, not aggregate leakage"
        finding: "All 4 files dependency-cruiser flagged (src/app/api/v1/projexa/ai/{diff-drawings,
          estimate-progress,progress-summary,risk-detection}/route.ts) are one-line re-exports, e.g.
          `export { GET } from \"@/app/api/construction/ai/risk-detection/route\"` -- confirmed by reading
          all 4 files plus their 4 construction-side counterparts. There is no duplicated business logic,
          only a URL alias; the construction domain logic lives in exactly one place. schema.ts (lines
          9243-9249) explicitly documents the intent: 'Boss decision (2026-07-08) to expose every
          construction module via /api/v1 rather than duplicate it inside the separate PROJEXA product --
          PROJEXA is a thin client consuming this data.' The dependency-cruiser rule is matching on
          directory naming (v1/projexa vs construction) rather than actual aggregate ownership."
        recommendation: "Treat this as a lint-rule false positive for this specific pattern (pure
          re-export aliasing), not a fix target -- duplicating the handler to satisfy the rule would
          create a real second source of truth and be a worse DDD outcome than the current re-export."
        remediation_type: ai_escalation_required
        artifact_path: "src/app/api/v1/projexa/ai/{diff-drawings,estimate-progress,progress-summary,risk-detection}/route.ts"
      - id: DDD-AI-002
        severity: medium
        title: "The 4 flagged routes break the /v1/projexa/* namespace's own established auth contract -- the real defect, opposite direction from what the lint rule implies"
        finding: "Every other route under v1/projexa/* (~40 sibling files checked, e.g. products/route.ts,
          punch-list/route.ts, knowledge-base/route.ts, payroll/**, wiki/route.ts, customers/route.ts)
          imports and calls requireAuthOrApiKey(request) -- confirming the namespace's actual contract is
          Bearer-API-key access. This is corroborated on the consumer side: projexa/src/lib/veridian-client.ts
          line 5 states VERIDIAN's /api/v1/projexa/* surface is accessed 'with a Bearer API key', and its
          callVeridian()/resolveApiKey() functions send Authorization: Bearer from
          veridianCredentials.veridianApiKey. But the diff-drawings re-export's own code comment says these
          4 AI endpoints are 'session-only... requireAuth(), not requireAuthOrApiKey()' -- structurally
          inside the public v1/projexa/* bounded-context surface but uncallable by PROJEXA's own server
          client. Grep of projexa's codebase confirms it does not currently call any of these 4 endpoints,
          so this is latent, not actively broken."
        recommendation: "Switch these 4 routes to requireAuthOrApiKey to match the rest of the v1/projexa/*
          contract, or move them out of the v1/projexa namespace entirely until API-key auth is implemented."
        remediation_type: ai_escalation_required
        artifact_path: "src/app/api/v1/projexa/ai/diff-drawings/route.ts, src/lib/veridian-client.ts (projexa)"
      - id: DDD-AI-003
        severity: info
        title: "The Organization aggregate has two incompatible identities across compliance-tracker/projexa, correctly bridged by an explicit identity-mapping table -- but with ubiquitous-language spelling drift"
        finding: "compliance-tracker's aggregate root is `organisations` (British spelling, schema.ts lines
          28-29) with a text/cuid primary key. projexa's aggregate root is `organizations` (American
          spelling, projexa schema.ts lines 7-51) with a uuid primary key -- a structurally different
          identity type for the same real-world tenant. projexa bridges this correctly via an explicit
          anti-corruption table, veridianCredentials, whose own comment reads: 'Deliberately separate from
          compliance-tracker's own organisations.country ... that column is keyed by a VERIDIAN org_id
          every real PROJEXA org currently shares (PROJEXA-IDENTITY-BRIDGE-01).' Good DDD practice (no
          shared mutable identity across contexts), but the spelling split for the same concept is a real
          ubiquitous-language inconsistency across the two repos' domain vocabularies."
        recommendation: "Keep the identity bridge as-is (it is correct); standardize the spelling of
          'organi[sz]ation' in cross-repo docs/comments to avoid confusing engineers working across both
          codebases."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/db/schema.ts (compliance-tracker, lines 28-29); src/lib/db/schema.ts (projexa, lines 7-51)"
      - id: DDD-AI-004
        severity: low
        title: "Construction module cost fields lack the Money precision/scale convention used elsewhere in the same schema -- no Money value object exists anywhere in the codebase"
        finding: "The schema has an established money convention: monthlyCostCapUsd numeric(precision:10,
          scale:2) (line 70), amount numeric(precision:14,scale:2) repeated across compliance-cost/notice/
          payment tables. The construction module (feeding the very estimate-progress and risk-detection AI
          routes under review) breaks this: constructionBoqLineItems.{quantity,rate,amount,materialCost,
          labourCost,equipmentCost} (lines 9279-9291) and constructionLabourRoster.dailyRate /
          constructionAttendance.dailyCost (lines 9394, 9407) are all bare numeric(...) with no precision/
          scale bound. A grep for 'class Money'/'ValueObject' across src returned zero results -- money is
          a raw, unconstrained primitive everywhere, and construction is the most permissive instance of
          that pattern in a schema that otherwise enforces {precision:14,scale:2} for currency."
        recommendation: "Apply {precision:14, scale:2} to the construction module's cost/rate columns to
          match the rest of the schema's money convention, reducing precision-drift risk in BOQ cost
          roll-ups consumed by the AI estimate/risk endpoints."
        remediation_type: ai_escalation_required
        artifact_path: "src/lib/db/schema.ts (lines 9272-9294, 9386-9409; convention reference lines 70, 309, 321, 337, 516-538, 2700, 2833, 2906)"

  projexa:
    ddd_findings: []
    note: "No projexa-specific DDD findings beyond the cross-repo identity-bridge note in DDD-AI-003 above
      -- projexa's own schema (organizations aggregate + veridianCredentials anti-corruption table) was
      read as evidence for that finding but did not surface an independent projexa-only defect."

  veda-advisors:
    ddd_findings:
      - id: DDD-AI-005
        severity: info
        title: "veda-advisors' only formally-declared entity model (Prisma User/Post) is dead code, disconnected from the real application"
        finding: "prisma/schema.prisma defines only User and Post (the default Next.js/Prisma starter
          template -- sqlite datasource, generic title/content/published fields). src/lib/db.ts
          instantiates and exports a PrismaClient, but a repo-wide grep for prisma. usage and for imports
          of @/lib/db in src/** returned zero matches -- nothing in the application reads or writes through
          this model. The real domain pages (src/app/founders, src/app/students, src/app/stage0) have no
          corresponding entity/aggregate definitions in code; src/app/api/veda/route.ts simply serves a
          static pre-generated index.html file from disk. There is effectively no verifiable aggregate/
          entity modeling in this repo -- the one artifact that looks like domain modeling is unused
          scaffolding."
        recommendation: "Either wire the Prisma schema to real domain entities (e.g. founder/student
          applications) or delete it, so future reviewers don't mistake it for the actual data model."
        remediation_type: ai_escalation_required
        artifact_path: "prisma/schema.prisma, src/lib/db.ts, src/app/api/veda/route.ts"

cross_repo_summary:
  real_findings_count: 5
  severity_breakdown: {medium: 1, low: 2, info: 2}
  headline: "The dependency-cruiser ddd-no-cross-context-api rule's 4 real findings are all one repo's
    (compliance-tracker) intentional API re-export aliasing, not aggregate leakage -- a lint-rule false
    positive for this pattern (DDD-AI-001), which itself surfaced a real, differently-shaped defect the
    rule cannot see: those same 4 routes silently break the v1/projexa/* namespace's own established
    Bearer-API-key auth contract (DDD-AI-002, the one medium-severity real finding this review adds). The
    Organization aggregate's cross-repo identity split is correctly bridged in code but named
    inconsistently (DDD-AI-003). Construction module money fields lack the schema's own established
    precision/scale convention (DDD-AI-004). veda-advisors has no real domain model to review -- its one
    Prisma artifact is unused scaffolding (DDD-AI-005)."
