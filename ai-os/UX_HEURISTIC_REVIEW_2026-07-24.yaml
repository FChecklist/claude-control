meta:
  title: VERIDIAN UX Nielsen-Heuristic + Content-Quality AI Review (Phase 5)
  created: '2026-07-24'
  produced_by_task: task-20260724-144915-phase5-remaining-ai-review-lane-read-onl
  precedent: "AUDITOR_ENGINE_PHASE_PLAN_2026-07-24.yaml phase-5 scope: 'ux domain -- Nielsen-heuristic and
    content-quality judgment (axe-core covers only the WCAG technical slice, done in Phase 1)'. Same
    structure as ai-os/ENTERPRISE_ARCHITECTURE_DRIFT_REVIEW_2026-07-24.yaml (Phase 4's own AI Review pass)
    -- real judgment content produced by this task, not generated by a tool. There are 0 pre-existing
    audit_findings rows in domain=ux (confirmed via live query) -- this is a genuine first-pass AI Review,
    not a re-check of prior tool output, consistent with this plan's own tool_mapping note that no software
    scanner covers Nielsen-heuristic/content-quality judgment."
  method: "Direct read of real page/form/settings components across compliance-tracker and projexa,
    focused on error handling, loading-state, and destructive-action confirmation patterns (the 3 Nielsen
    heuristics -- visibility of system status, error prevention, user control/freedom -- a WCAG scanner
    structurally cannot judge). veda-advisors was checked and found to have only one interactive flow
    (/stage0) with already-specific error copy and good loading-state handling -- no negative finding was
    fabricated there to hit a quota; its absence from the findings list below is a real result, not an
    omission."

repos:
  compliance-tracker:
    ux_findings:
      - id: UX-AI-001
        severity: medium
        title: "Destructive deletes are one-click in settings sections, with no confirmation -- despite the app already having a confirm-dialog pattern"
        finding: "In ChallanSection.tsx, WebhookSection.tsx, and ApiKeySection.tsx, the trash-icon Button's
          onClick calls handleDelete(id) directly (e.g. onClick={() => handleDelete(k.id)} in
          ApiKeySection.tsx), which immediately fires a DELETE request with no intervening dialog --
          clicking the icon permanently deletes a challan record, a webhook endpoint, or an API key. Yet
          the same codebase already ships a shadcn AlertDialog confirmation pattern
          (AlertDialog/AlertDialogAction/AlertDialogCancel), used in VeriComposer.tsx (lines 711-746) to
          confirm AI-agent-initiated actions. Human-initiated, permanent deletes of security-sensitive
          records get less protection than agent actions do."
        recommendation: "Reuse the existing AlertDialog component to gate all three handleDelete calls
          behind an explicit confirm step."
        remediation_type: ai_escalation_required
        artifact_path: "src/components/ChallanSection.tsx (lines 136-145, 280-289), src/components/WebhookSection.tsx (lines 189-200, 415-421), src/components/ApiKeySection.tsx (lines 150-158, 352-358)"
      - id: UX-AI-002
        severity: low
        title: "Inconsistent destructive-action pattern across the same repo: window.confirm() in some pages, nothing in others"
        finding: "src/app/(app)/compliance/[id]/page.tsx (line 257) and src/app/(app)/veri-meetings/[id]/page.tsx
          (line 111) use a raw browser window.confirm() (unstyled, blocks the JS thread, no branding) for
          destructive confirmation, while the settings-section components (UX-AI-001) use no confirmation
          at all, and the chat composer uses a fully styled AlertDialog. There is no single shared
          convention for 'are you sure?' across the app."
        recommendation: "Standardize on the existing AlertDialog component for every destructive action and
          remove the native confirm() calls."
        remediation_type: ai_escalation_required
        artifact_path: "src/app/(app)/compliance/[id]/page.tsx (line 257), src/app/(app)/veri-meetings/[id]/page.tsx (line 111)"
      - id: UX-AI-003
        severity: low
        title: "Generic fallback error text on public-facing lead-gen forms loses the specific server error"
        finding: "Both ContactUsForm.tsx (lines 59-80) and ForgeIntakeComposer.tsx (lines 190-211) do
          setError(data.error ?? \"Something went wrong. Please try again.\") on a non-OK response and the
          identical fallback string in their catch blocks. This is the public /contact, /join-us, and Forge
          intake forms -- exactly where a prospective client or partner is asked to trust the product; if
          data.error isn't populated by the API or a network exception occurs, the visitor is told nothing
          about whether it was their input, a captcha failure, or a server outage."
        recommendation: "Have the API always return a specific, user-actionable error string and reserve
          the generic fallback strictly for true network exceptions."
        remediation_type: ai_escalation_required
        artifact_path: "src/components/ContactUsForm.tsx (lines 59-80), src/components/ForgeIntakeComposer.tsx (lines 190-211)"
      - id: UX-AI-004
        severity: low
        title: "Loading state has no shared convention -- plain 'Loading...' text vs. shaped Skeleton placeholders for equivalent list views"
        finding: "src/app/(app)/training/page.tsx (line 144) replaces its entire list UI with
          <p>Loading...</p> during fetch, giving no sense of the eventual layout, while
          src/app/(app)/clients/page.tsx (lines 8, 85-86) renders content-shaped Skeleton blocks that
          preview the coming card/row structure. Repo-wide, 51 files under src/app/(app) use a
          Loader2 spinner-only pattern versus 21 that use Skeleton, with no apparent rule for which pattern
          a given list/detail page gets."
        recommendation: "Pick one loading-state convention (Skeleton is the richer one already built) and
          apply it uniformly to all list/detail views."
        remediation_type: ai_escalation_required
        artifact_path: "src/app/(app)/training/page.tsx (line 144), src/app/(app)/clients/page.tsx (lines 8, 85-86)"

  projexa:
    ux_findings:
      - id: UX-AI-005
        severity: medium
        title: "Specific server error messages are discarded before reaching the user -- toast always shows the same generic string regardless of cause"
        finding: "CreateProjectDialog.tsx's createProject() (lines 52-74) does `if (!res.ok) throw new
          Error();` -- an empty Error with no message -- then the catch always shows
          toast.error(\"Couldn't create project\"). But the API route at the same path
          (src/app/api/projects/route.ts lines 30-37) returns { error: err instanceof VeridianApiError ?
          err.message : \"Failed to create project\" }, i.e. a specific, meaningful message the client
          fetches but never reads before throwing. Whatever specific reason the project couldn't be created
          (bad product ID, name conflict, downstream API failure) is invisible to the user."
        recommendation: "Parse the response body (const data = await res.json()) and surface data.error in
          the toast instead of discarding it."
        remediation_type: ai_escalation_required
        artifact_path: "src/components/CreateProjectDialog.tsx (lines 52-74), src/app/api/projects/route.ts (lines 30-37)"
      - id: UX-AI-006
        severity: low
        title: "Floor-plan room/furniture deletion is a single click with no confirmation"
        finding: "FloorPlanEditorClient.tsx's removeRoom(roomId) and removeSelected() (lines 116-123,
          206-215, 305, 320) both call a DELETE fetch directly from the trash-icon button's onClick, with
          no AlertDialog/confirm() guard anywhere in the file -- deleting a drawn room (and everything
          placed in it) or a placed furniture item is irreversible and immediate. The same repeated-loading
          split noted in compliance-tracker also exists here: only ReportCatalogRunner.tsx and
          ReportCatalogSection.tsx use Skeleton, while Loader2 spinners appear in 51 other files."
        recommendation: "Add a lightweight confirm step (at minimum for removeRoom, since it can delete a
          populated room) before issuing the DELETE call."
        remediation_type: ai_escalation_required
        artifact_path: "src/components/FloorPlanEditorClient.tsx (lines 116-123, 206-215, 305, 320)"

  veda-advisors:
    ux_findings: []
    note: "The one interactive flow checked (/stage0 submission form) already has specific, actionable
      error copy ('Submission failed. Please try WhatsApp instead.' / 'Network error. Please try WhatsApp
      instead.') and adequate loading/progress-state handling -- confirmed by reading the flow's real code,
      not assumed. No negative UX finding was substantiated for this repo; recorded honestly as a real 0,
      not a silent skip."

cross_repo_summary:
  real_findings_count: 6
  severity_breakdown: {medium: 2, low: 4, info: 0}
  headline: "Both real product repos (compliance-tracker, projexa) share the same underlying pattern: a
    good confirmation/loading-state component already exists in each codebase (AlertDialog, Skeleton) but
    is applied inconsistently, leaving several destructive-delete paths one-click and several list views
    on the plainer fallback. Two independent instances of the same class of bug -- a real, specific server
    error message computed and returned by the API but discarded on the client before the user ever sees
    it -- were found in unrelated features (ApiKeySection-adjacent settings deletes are silent by omission;
    projexa's CreateProjectDialog silently drops a populated error.message). veda-advisors' one interactive
    flow was reviewed and found adequate, a genuine 0-finding result."
