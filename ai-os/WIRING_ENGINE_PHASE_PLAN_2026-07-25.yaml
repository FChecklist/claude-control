      10 stages (Intent/Context/Planning/Policy/Decision/Automation/Integration/Data/Notification/Audit/
      Observability) genuinely true for that one request today, with real trace/log evidence per stage, or
      (b) for any stage with no real call site, build the minimum real wiring so it becomes true, and update
