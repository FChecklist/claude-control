  instruction: INS-20260724-113032-8032
  scope_of_this_document: 'Closes phase_2_policy_rule_decision_unification in
    ai-os/20_ENGINES_10_GATEWAYS_PHASE_PLAN_2026-07-24.yaml (engines 5/6/7: Policy Engine, Rule Engine,
