  repo_boundary_honestly_stated: 'preflight-guard.py and risk-tier.py are real, live, verified-on-disk
    (per 20_ENGINES_10_GATEWAYS_PHASE_PLAN_2026-07-24.yaml''s own engine_inventory row 5/7) but were never
