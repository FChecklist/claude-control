id: prompt_gateway
type: chat_preprocessing_pipeline
created: 2026-07-25
task: task-20260725-053025-zai-prompt-gateway-integration

summary: >
  A real, working, stdlib-only Python pre-processing FILTER that takes raw owner
  chat text, classifies it, strips filler/noise, and compresses it into a concise
  machine_prompt BEFORE that text ever becomes a --text argument to the real,
  already-in-production task dispatcher at /opt/veridian/scripts/task-gateway.py
  (submit/start/log/close/register-automation/status). This module never calls
  task-gateway.py itself and never replaces it -- it is strictly upstream of it.
  Source: 9 Z.AI-authored files staged at
  /opt/veridian/workspace/zai-prompt-gateway-staging/, integrated here without
  duplication.

critical_collision_avoided:
  description: >
    The staged entrypoint (prompt-gateway-ENTRYPOINT.py) called itself
    "task-gateway.py" in its own header and was originally targeted at
    /opt/veridian/scripts/task-gateway.py -- the exact path of the real,
    live, in-production Superboss dispatch entrypoint every task this session
    (60+ tasks) has been dispatched through, including this one. Writing the
    staged file there would have destroyed the real dispatch pipeline.
  mitigation: >
    Deployed under its own namespace, /opt/veridian/scripts/prompt_gateway/,
    with the entrypoint renamed gateway.py. task-gateway.py was never opened
    for writing by this task.
  verification:
    baseline_sha256: 1e9421777219d7561511431219e04c09862d86b2761cf14c882af4599ca9a49b
    final_sha256: 1e9421777219d7561511431219e04c09862d86b2761cf14c882af4599ca9a49b
    baseline_wc_l: 642
    final_wc_l: 642
    match: true
    note: >
      The SUCCESS_CRITERIA grep pattern 'def submit_task\|argparse.*submit'
      actually returns 0 against the real file both before and after this
      task (the real function is named cmd_submit, not submit_task, and the
      add_parser("submit") line doesn't contain the literal string
      "argparse"). That pattern mismatch predates this task and is a detail
      of the success-criteria wording, not a sign of file corruption -- the
      sha256 and line-count identity above are the authoritative proof the
      file is byte-for-byte unchanged.

file_layout:
  deployed_to: /opt/veridian/scripts/prompt_gateway/
  files:
    - path: /opt/veridian/scripts/prompt_gateway/config.py
      from_staged: config.py
      changed: true
      change: >
        SCRIPTS_DIR now points at .../scripts/prompt_gateway (its own
        namespace) instead of the top-level .../scripts/ dir, so ENGINE_DIR
        resolves to .../prompt_gateway/engine. DATA_DIR now points at
        /opt/veridian/data/prompt_gateway (was /opt/veridian/data) and
        SNIPPETS_DIR now lives under it at
        /opt/veridian/data/prompt_gateway/snippets (was top-level
        /opt/veridian/snippets). This keeps every writable path this module
        touches inside its own namespace -- no collision with
        /opt/veridian/ai-os/, /opt/veridian/chatgpt-audit/, or any other
        top-level /opt/veridian/ directory, and no generic top-level
        /opt/veridian/data or /opt/veridian/snippets dirs left for other
        tools to accidentally collide with later.
    - path: /opt/veridian/scripts/prompt_gateway/gateway.py
      from_staged: prompt-gateway-ENTRYPOINT.py (renamed)
      changed: true
      change: >
        (1) Removed a dead/shadowed local VERIDIAN_BASE fallback
        (os.path.dirname(SCRIPT_DIR)) that would have silently resolved to
        the wrong directory (/opt/veridian/scripts instead of
        /opt/veridian) now that the entrypoint sits one level deeper -- it
        was already unused (immediately shadowed by `from config import
        VERIDIAN_BASE as BASE`) so this was a latent-bug removal, not a
        behavior change.
        (2) Fixed TaskGateway.__init__: it previously hardcoded
        self.base_dir/"data", self.base_dir/"data"/"tags",
        self.base_dir/"data"/"context", self.base_dir/"snippets" for the
        id generator/tagger/context manager/snip engine -- bypassing
        config.py's namespaced DATA_DIR/TAGS_DIR/CONTEXT_DIR/SNIPPETS_DIR
        entirely and writing to bare /opt/veridian/data and
        /opt/veridian/snippets. This was caught by actually running
        --mode init and inspecting what got created on disk (it created
        exactly the top-level collision the task was trying to avoid).
        Fixed to use the config constants by default, while still honoring
        an explicit --base-dir CLI override for ad hoc/test use.
        (3) Updated docstring/usage/epilog text that referred to itself as
        "task-gateway.py" and gave `python3 task-gateway.py ...` examples,
        to gateway.py and to explicitly state its relationship to the real
        task-gateway.py dispatcher (pre-processing filter, not a
        replacement, never calls it).
    - path: /opt/veridian/scripts/prompt_gateway/__init__.py
      from_staged: __init__.py
      changed: false
    - path: /opt/veridian/scripts/prompt_gateway/engine/id_generator.py
      from_staged: engine/id_generator.py
      changed: false
      verified: >
        sys.path.insert(0, dirname(dirname(abspath(__file__)))) is
        location-independent by construction (always resolves to the
        directory one level above engine/, wherever that is) -- confirmed
        correct at the new path both via `python3 gateway.py --mode init`
        and by running `python3 id_generator.py` standalone (exit 0).
    - path: /opt/veridian/scripts/prompt_gateway/engine/classifier.py
      from_staged: engine/classifier.py
      changed: false
      verified: standalone self-test exit 0 at new path.
    - path: /opt/veridian/scripts/prompt_gateway/engine/prompt_engine.py
      from_staged: engine/prompt_engine.py
      changed: false
      verified: standalone self-test exit 0 at new path.
    - path: /opt/veridian/scripts/prompt_gateway/engine/context_engine.py
      from_staged: engine/context_engine.py
      changed: false
      verified: standalone self-test exit 0 at new path.
    - path: /opt/veridian/scripts/prompt_gateway/engine/snip_engine.py
      from_staged: engine/snip_engine.py
      changed: false
      verified: standalone self-test exit 0 at new path.
    - path: /opt/veridian/scripts/prompt_gateway/engine/__init__.py
      from_staged: null
      changed: true
      change: >
        Added (was not in the staged set) as an empty file so engine/ is a
        proper importable package consistent with the top-level
        __init__.py Z.AI already wrote. Purely additive, zero behavior
        change (the engine/*.py files were already being imported
        successfully via sys.path manipulation, not package-relative
        imports).
  not_deployed:
    - path: veridian-gateway.service.TEMPLATE
      reason: see systemd_decision below -- corrected but intentionally not installed.

vd_id_namespace:
  format: "VD-YYYYMMDDHHMMSS-XXXX (UTC timestamp + zero-padded daily counter)"
  scope: >
    Chat/prompt pre-processing records ONLY, produced by
    /opt/veridian/scripts/prompt_gateway/engine/id_generator.py. Counter
    state lives at /opt/veridian/data/prompt_gateway/_id_counter.json and
    resets daily.
  explicit_distinction: >
    This is a 4th, wholly separate ID namespace from the 3 that already
    exist in this session: task IDs (from veridian-task.py, e.g.
    task-YYYYMMDD-HHMMSS-slug), Knowledge Engine IDs (KE-...), and
    Instruction IDs (INS-...). A VD- id identifies one raw-chat
    pre-processing record (classification + compression + context-prune
    result) inside this pipeline's own data store. It is NEVER a task id,
    a knowledge-engine row id, or an instruction id, and must not be
    confused for one when read out of a log or a --session-id flag. When a
    VD- id is passed to task-gateway.py as --session-id (see
    end_to_end_proof below), it is being reused purely as an opaque
    session-correlation string, the same as any other caller-supplied
    session id -- task-gateway.py has no special knowledge of the VD-
    format and does not validate or interpret it.

