systemd_decision:
  decision: not_installed
  staged_template_defects_found:
    - "User=veridian / Group=veridian -- that system user does not exist on this server; the real operating user for every other systemd --user unit here (veridian-worker@, veridian-supervisor@, veridian-docworker@, veridian-task-watchdog, veridian-glm-proxy) is rajat."
    - "ExecStart pointed at /opt/veridian/scripts/task-gateway.py -mode pipe -- the colliding production path, not this module's real path."
    - "StandardInput/StandardOutput were file:/var/run/veridian/input.pipe and output.pipe -- neither /var/run/veridian nor those named pipes exist, and creating/owning a /var/run path requires root or a tmpfiles.d rule this task was not asked to add."
    - "[Install] WantedBy=multi-user.target -- a system-unit target, inconsistent with every other veridian-*.service on this box, which are systemd --user units under default.target.wants/."
  reasoning: >
    This pipeline's real use case, per SCOPE, is CLI pre-processing that runs
    once per owner-initiated chat message immediately before a
    task-gateway.py submit call -- inherently on-demand, not a streaming
    workload. The staged .service.TEMPLATE assumes a `--mode pipe` daemon
    fed by a named pipe, but nothing in this system today (or in this task's
    scope) produces owner chat text as a live stream into a FIFO -- the
    owner types directly into an interactive Claude session, not into a
    /var/run pipe file. Installing and enabling a systemd --user unit for
    this would mean running a process 24/7 that reads from a pipe no writer
    ever opens: pure idle resource use with zero real trigger, which is
    exactly the "installing something unused" anti-pattern this task's own
    instructions warned against. If a genuinely streaming use case
    materializes later (e.g. a live chat-ingest integration), the fixes
    above (rajat, corrected ExecStart path, a real tmpfiles-managed pipe
    path or a --mode stdin-per-invocation design instead) should be applied
    at that time as their own scoped follow-on task -- not spec'd
    speculatively here.
  template_disposition: >
    The original veridian-gateway.service.TEMPLATE remains, unmodified, at
    /opt/veridian/workspace/zai-prompt-gateway-staging/ for reference. It
    was NOT copied into /opt/veridian/scripts/prompt_gateway/ and NOT
    installed under ~/.config/systemd/user/, precisely so nobody mistakes
    the un-fixed User=veridian/colliding-path version for something already
    wired in.

