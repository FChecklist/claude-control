  - id: HETZNER-03-INFRA-FIXES
    project: veridian
    type: infra-fix
    status: done
    summary: "Two infra bugs found + fixed while operating the gap-queue dispatcher, neither needed Owner input: (1) systemctl --user commands (invoked by queue-dispatcher.py -> veridian-task.py create) failed under cron with 'Failed to connect to bus: No medium found' -- cron doesn't inherit the XDG_RUNTIME_DIR/dbus session an interactive SSH login gets via pam_systemd. Fixed at the crontab level (covers every cron job, not just one script): added XDG_RUNTIME_DIR=/run/user/1000 as a crontab environment line (works because loginctl enable-linger rajat keeps that runtime dir alive persistently). Verified via a simulated minimal cron environment before trusting it, then confirmed a real subsequent cron tick dispatched cleanly. Cleaned up 3 orphaned worktrees/branches/task-dirs from the failed attempts (confirmed none had been pushed before deleting). (2) PROGRESS.md is committed to main by each merged task, so a fresh worktree for a NEW task inherited the PREVIOUS task's 'complete' content until the new worker overwrote it -- caused a false 'already complete' checkpoint report, and could have fed a resumed worker the wrong task's status if killed before its first real write. Fixed in veridian-task.py's cmd_create: overwrite PROGRESS.md with a fresh task-scoped stub immediately after worktree creation. Confirmed the actual claude -p processes for affected tasks were running the correct prompts regardless (checked via ps -ef) -- no work was actually misdirected, only the status reporting was wrong."
    where: "/opt/veridian/scripts/queue-dispatcher.py, veridian-task.py (cmd_create), crontab -l on VERIDIAN-DEV server."
    last_touched: "2026-07-18"

