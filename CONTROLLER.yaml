  - id: GLM-ROUTING-COST-PREVENTION-01
    project: veridian
    type: infra
    status: done
    summary: "Owner directive following COST-INCIDENT-11K-CALLS-RCA: stop using the real Anthropic API for worker/supervisor sessions entirely (we do not use it at all), route through GLM-5.2 via OpenRouter selecting the lowest-cost real provider at call time, cap budget at $10 (not $100), prevent infinite loops. Found an existing, complete, but never-deployed Anthropic-Messages-API-to-OpenRouter translation proxy (anthropic_openrouter_proxy.py, built 2026-07-18, 0 processes running -- confirmed via ps aux). Fixed 2 real bugs in it before trusting it: (1) it was forwarding whatever model name the CLI itself requested (its own default, e.g. claude-opus-4-8) straight to OpenRouter instead of forcing the configured GLM-5.2 -- root cause of a real 400 error on the first smoke test; now always forces PROXY_MODEL regardless of the request. (2) added OpenRouter's provider:{sort:price} so it re-selects the cheapest real backing provider on every call (empirically confirmed routing to 'Novita' in live tests). Separately discovered and fixed a deeper correctness issue: once proxied, Claude Code CLI's own self-reported total_cost_usd/--max-budget-usd is computed against whatever model it THINKS it called (Anthropic pricing), not the real GLM-5.2/OpenRouter cost -- a live smoke test measured this at ~93x inflated ($0.118 self-reported vs $0.0013 real). Added real-cost logging to the proxy itself (OpenRouter's usage:{include:true}) and rewrote worker-entrypoint.sh/supervisor-entrypoint.sh's budget-cap logic to sum the proxy's own logged real cost for each invocation's time window, not the CLI's self-report. Budget cap lowered 100->10 (env override VERIDIAN_WORKER_BUDGET_CAP_USD/VERIDIAN_SUPERVISOR_BUDGET_CAP_USD). NEW infinite-loop prevention: a persistent per-task lifetime-invocation counter (.invocation_count in the task dir) hard-stops at 20 total starts/restarts regardless of wall-clock time between them -- closes the real gap systemd's StartLimitBurst=3/1800s window doesn't cover (a task retrying once an hour, not once every 10 minutes, could previously loop forever; this is the exact shape of the 574-parallel-sessions-in-one-day incident). CLAUDE_CODE_OAUTH_TOKEN explicitly unset in both entrypoint scripts (fail-closed -- if the proxy is briefly unreachable, the invocation errors rather than silently falling back to real Anthropic auth)."
    where: "/opt/veridian/scripts/anthropic_openrouter_proxy.py (patched in place, 2 fixes), /opt/veridian/scripts/worker-entrypoint.sh + supervisor-entrypoint.sh (rewritten, .bak-2026-07-19 backups kept alongside), new systemd service veridian-glm-proxy.service (enabled, Restart=always, survives reboot, confirmed active). Real-cost log: /opt/veridian/ai-os/logs/glm-proxy-calls.jsonl. All server-only ops tooling, not in any git repo (same disclosure class as the RCA task's own worker-entrypoint.sh note)."
    last_touched: "2026-07-19"
    dispatch: "Built directly by Super Boss (this session) via SSH, not a dispatched worker task -- deliberately NOT delegated to an autonomous worker, since that worker would itself need to use the OLD (real-Anthropic) mechanism to build the NEW one. Live-verified end to end with 2 real test dispatches: a minimal isolated smoke test (confirmed the 93x cost-inflation finding) and a full real worker task through the actual systemd pipeline (task-20260719-140432-smoke-test, confirmed: new lifetime-invocation counter active, 8 real GLM-5.2 calls via OpenRouter's auto-selected cheapest provider Novita, real costs $0.002-0.008/call, the task's actual file edit succeeded). AIROUTER-01 Phase 2 (already running under the OLD script when this deploy happened) was confirmed unaffected -- it had already completed independently beforehand; the atomic mv-based file swap used for the entrypoint scripts is safe against any future case of swapping mid-flight (an already-open file descriptor keeps reading the old inode)."
    followup_2026_07_19_full_coverage: "Owner directive: ALL software development work on the server -- every tier (lower/middle/higher AI agent) -- must use GLM-5.2 via OpenRouter's cheapest provider, not just the 2 already-fixed scripts. Audited every real claude-CLI call site on the server (grepped every .py/.sh in /opt/veridian/scripts/ for 'claude -p'/ANTHROPIC_*/CLAUDE_CODE_OAUTH_TOKEN, every systemd unit, the full crontab) rather than assuming coverage. Found and fixed one genuine gap: master-decompose.py (the 'Master' role that decomposes objectives into module-queue tasks) also called claude directly, unrouted -- patched with the identical ANTHROPIC_BASE_URL/dummy-key/popped-OAuth-token pattern, syntax-verified. Confirmed both queue dispatchers (queue-dispatcher.py, module-queue-dispatcher.py) don't call any model directly -- they only create tasks via veridian-task.py, which funnels into the already-fixed worker-entrypoint.sh. Full coverage confirmed: every real AI-model call path on the server (workers, supervisors, Master) now routes through GLM-5.2/OpenRouter, cheapest provider, zero remaining gaps found."

