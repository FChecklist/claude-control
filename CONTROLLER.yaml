  - id: HETZNER-03-INFRA-FIXES-2
    project: veridian
    type: infra-fix
    status: done
    summary: >-
      Real bug found while verifying PR #416's "merged" claim (don't trust, verify --
      see [[feedback_no_assumptions_full_file_reads]] pattern): supervisor-entrypoint.sh's
      tier1+approve path called `gh pr merge` directly, with no structured AUDIT: PR comment
      ever posted first, and no check on the merge command's own exit code before writing
      "completed...merged autonomously" to the task checkpoint. Since mandatory-audit-check.yml
      requires that structured comment as a required status check, EVERY tier1 auto-merge
      attempt on compliance-tracker was silently failing at the merge step while being
      unconditionally reported as successful -- confirmed via git history that only 2 tasks
      ever reached this code path (an earlier claude-control-repo e2e test, unaffected since
      that repo has no audit-check gate; and PR #416, confirmed broken). The 3 other
      "completed" gap-queue tasks that day used a separate, legitimate "worker found no
      changes needed, no PR opened" path and were not affected. Fixed in
      supervisor-entrypoint.sh: post a real structured AUDIT: PASS/FAIL comment (all 8
      required fields, built from the actual review.json verdict/summary/issues) before
      attempting any tier1 merge, poll briefly for CI to clear BLOCKED/BEHIND before merging,
      and only checkpoint "completed" if the merge command itself actually succeeds --
      otherwise checkpoint "blocked" with an explicit "NOT actually merged" note so this
      class of false-positive can never silently recur.
    where: "/opt/veridian/scripts/supervisor-entrypoint.sh on VERIDIAN-DEV server."
