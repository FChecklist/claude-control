    summary: "Make VERI Chat the single 'second screen' for an office user's day -- MoM, To Do, Reminders, Status, Approvals, Discussions, and email should all form part of VERI Chat, not live on separate pages. Owner also asked for WhatsApp/copy-link sharing (already built) and framed the UX goal as 'chat with functionality + a second screen to keep working.'"
    where: "Research done, no build yet. Real finding: VeriChatPanel.tsx (src/components/veri-chat/VeriChatPanel.tsx) already IS the 'second screen' pattern the Owner is describing -- a tabbed right-panel (Overview/Tasks/Chats/To Do) unifying tasks+conversations+todos into one attention feed. WhatsApp/Telegram share links + copy link + guest access for external customers/vendors are already built (veri-chat-service.ts). Minutes of Meeting is fully built (veri-meeting-service.ts: create/minutes/AI meeting-intelligence/action-items/publish/audit-log/share-links) but lives on its own separate /veri-meetings page, not in the chat panel. Approvals has a real generic engine (approval-workflow-service.ts) + its own /approvals page, also not in the chat panel. Email has a real service (email-intelligence-service.ts, drafted-communications with approve/reject) but no dedicated page and no chat-panel presence at all. Real gap is fragmentation (4 of 7 asked-for things exist but live outside VERI Chat), not missing capability -- recommended approach is extending VeriChatPanel's tab bar (Meetings, Approvals tabs; fold Email in as an Overview signal; treat 'Discussions' as multi-person Chats rather than a new concept) rather than building anything from scratch."
    last_touched: "2026-07-15"
    raw_instruction: "Minutes of Meeting , To Do, Reminders, Status, Approvals, Discussions, email these are very important, they form part of VERI Chat also. With VERI Chat the user connects with team, individuals, customers, vendors who are using VERI Chat. The user can share the chat via whatsapp link or copy link. VERI Chat has to be user friendly, not complicated, while working user should be able to work on it. Think of it as a Chat with functionality + a second screen on the web page for user to continue working. How can you make existing VERI Chat better. Think as a human office user."
    tightened_prompt: "PRELIMINARY -- research done, scope proposed to Owner this session, not yet confirmed/dispatched. Proposal: (1) add a 'Meetings' tab to VeriChatPanel surfacing upcoming meetings + minutes pending review + action items assigned to the current user, reusing veri-meeting-service.ts as-is. (2) add an 'Approvals' tab surfacing everything waiting on the current user's decision across change-order/quotation/email-draft approval flows, reusing approval-workflow-service.ts + drafted-communications as-is -- one unified queue instead of 3 separate places to check. (3) fold email-intelligence-service.ts's flagged items into the Overview tab as an attention signal, not a full mail client. (4) treat 'Discussions' as multi-person Chats (real topic/name, >2 participants) rather than a new concept -- extend the existing Chats tab, don't build a parallel one. (5) make the Share action (WhatsApp/Telegram/copy-link, already built) consistently available everywhere a conversation/meeting can be shared, not just the 2 places it exists today. (6) Reminders/Status: largely already covered by existing task/todo status modeling -- confirm this covers the Owner's intent or clarify if a distinct reminder/notification mechanism is wanted. Done-when: not yet defined -- needs Owner confirmation on this proposed shape before scoping into waves."
    dispatch: "18a (panel-extension items 1-5 above) dispatched 2026-07-15, subagents:1, MERGED compliance-tracker#341 2026-07-15 -- independently audited: verified createConversation()'s real pre-existing group-chat support via direct grep (claim was accurate, not assumed), verified listChangeOrdersAwaitingApproval is a correctly tenant-scoped minimal addition, verified the new approvals aggregator uses Promise.allSettled so one gated source can't blank the other 4 and duplicates zero approval logic, verified the new /shared/meeting/[token] page mirrors the existing conversation-share pattern exactly. Real finding during the build: meeting sharing was only half-wired (backend existed, no public page rendered it) -- fixed as part of item 5. CI Build succeeded, independently resolving the PR author's own uncertain local-sandbox build result. 18b (chat-only access tier) explicitly deferred -- see standalone_module_suggestions below for why, now file-collision-unblocked (PLATFORM-01 Wave 1 merged) but not yet dispatched."
    standalone_module_raw_instruction: "in it add, VERI Chat can be a offered as a stand alone module to users. in organization, all user might not have the right to use the complete system. But organization admin can give access to everyone to use VERI Chat only, the customers etc might not have access to the system, but can use the VERI Chat only. so VERI Chat can become a tool by which others can join the platform. as our product is multi tenant, multi product, multi country, multi language, so VERI Chat should be complete Chat for office use. before doing changes in exiting VERI Chat evaluate. Add / edit / suggest"
    standalone_module_evaluation: "Evaluated before proposing changes, per Owner's explicit instruction. 3 real findings: (1) VERI Chat is ALREADY its own org-level product branch (veri_chat_v2, veri-chat-v2-enablement-service.ts) using the same product_branches/org_product_branch_enablements mechanism Priority 15/17 used for ERP/Sales -- 'can this org use VERI Chat at all' already works, nothing to build there. (2) userRoleEnum already has client_viewer and external_auditor roles (schema.ts line 8-10) -- clearly intended for restricted/external users -- but grepped auth-guard.ts and AppShell/layout: these roles ONLY affect action-level permission rank (requireRole checks), never which pages/nav a user can see. Every logged-in user today sees the identical full AppSidebar regardless of role -- there is no existing mechanism to restrict a real logged-in user to a single module. (3) src/app/client-portal exists but is a TOKEN-based guest-link pattern (same family as VERI Chat's own share/guest-access links), not a persistent login with a restricted role -- a different mechanism from what's being asked (a real org member/customer/vendor account that logs in normally but only ever sees Chat). CONCLUSION: this is a genuinely new capability (per-user module/nav visibility scoping) layered ON TOP OF the existing org-level entitlement system, not a rebuild of it -- and it is a DIFFERENT AXIS from PLATFORM-01 (the other session's active multi-tenant work): PLATFORM-01 answers 'does this org have Sales/ERP enabled at all' (org-level, per-tenant); this is 'within an org that has everything enabled, does THIS SPECIFIC user see only Chat' (user-level, per-seat). Complementary, not overlapping -- do not build this by touching PLATFORM-01's own workstreams, and re-verify PLATFORM-01's real state before starting since it's actively in flight on another session."
    standalone_module_suggestions: "(a) ADD: a per-membership 'chat only' access scope (e.g. a boolean or a dedicated enum value on the membership/user row, org-admin-settable) that, when set, makes every non-Chat route/nav item invisible to that user regardless of what product branches the org has purchased -- this is what actually turns VERI Chat into a platform on-ramp: an admin invites a customer/vendor/junior staffer with this scope, they get a real account and real identity (unlike a guest link), but see only Chat until upgraded. (b) SUGGEST, not decided: reuse client_viewer/external_auditor's existing rank semantics for the ACTION-level half (what a chat-only user can approve/edit within Chat itself) but add a NEW, separate flag for the NAV-level half (which modules render at all) -- conflating the two would overload roles that were designed for a different purpose. (c) SUGGEST: keep the existing guest-access token pattern for truly external people with zero account (a customer replying to one shared conversation) distinct from this new persistent chat-only seat (a vendor who regularly uses VERI Chat as their main touchpoint with the org) -- two real, different use cases, don't collapse them. (d) EDIT to existing Priority 18 scope: multi-country/multi-language for VERI Chat specifically has zero existing work (this codebase's compliance tooling is India-only by design elsewhere) and is correctly sequenced AFTER PLATFORM-01's own Wave 2 (offices/currency/language, per that session's own claim) -- do not attempt multi-country/language chat polish before that lands; the chat-only-access-tier work (a) above has no such dependency and can proceed independently. DECISION 2026-07-15: proceeding with (b) as stated (new dedicated nav-visibility flag, separate from role rank) -- no objection raised, matches the codebase's own established pattern of adding a purpose-specific mechanism rather than overloading an existing one. NOT dispatched yet regardless: (a)'s flag needs a schema.ts change + auth-guard.ts context resolution, and PLATFORM-01 (PR #339, other session) is actively rewriting both files for multi-tenant provisioning right now -- building this concurrently risks a real semantic conflict in the auth model, not just a textual merge conflict. Sequenced to start once PLATFORM-01 merges; re-verify its final shape first since it may already provide a hook worth building on rather than a from-scratch flag. UPDATE 2026-07-15: PLATFORM-01 Wave 1 has now actually merged (PR #339) -- confirmed via git log on origin/main, entry moved from ACTIVE-CLAIMS.yaml's active: to recently_completed:. Read its real merged shape: new platform_applications table (a platform-level service-credential concept, distinct per sibling-product), apiKeys.issuedForApplicationId, organisations.primaryProductBranchId, provisionOrganisation() factored out of auth-guard.ts (refactor, same external behavior) -- this is genuinely ORG-level tenant/API-key isolation, it does NOT introduce any per-USER nav-visibility concept, confirming (b)'s earlier axis analysis was correct, not stale. 18b (the chat-only-access flag) is now UNBLOCKED file-collision-wise (PLATFORM-01 Wave 1 is merged, not in-flight) but was NOT dispatched this session (turn was spent resuming the interrupted Priority 17/18a wave instead) -- ready to dispatch next session/turn. Note PLATFORM-01's own claim text says its Wave 2 covers 'offices, currency, language, per-country compliance' -- not per-user access scoping, so 18b still shouldn't collide with that either, but re-verify no new PLATFORM-01 wave has started before dispatching."
    stage0_raw_instruction_2026_07_15: "priority 18b, is that any one who is shared the VERI chat link , can register in the system as a user - stage 0 - which is unpaid user. no approval needed from any admin. If any organization and its user sends a message , to do etc to that stage 0 user, the stage 0 user can only see whats sent for him. As stage 0 user has already being validated by email ID / gmail / magic link etc, - its tracked what was sent by what user to which user. Objective - that VERI Chat will become the - tool for free advertisement as its usage grow - you can reevaluate and suggest."
    stage0_supersedes_note: "This REPLACES the earlier (a)/(b)/(c) 18b design's core mechanism, not just extends it -- the earlier design assumed an ORG ADMIN invites a restricted seat (admin-provisioned, approval-gated). This new instruction is self-serve and viral: anyone holding a shared VERI Chat link registers themselves, zero admin approval, identity proven only via passwordless email/Gmail magic-link verification. The nav-visibility-flag mechanism from the earlier design (a dedicated flag separate from role rank, not overloading client_viewer/external_auditor) is still the right ACTION-level primitive to reuse for 'what can a stage-0 user do,' but the PROVISIONING path (who creates the row, and how) is new and must be self-serve off a shared link, not admin-invite.
      Re-evaluation, per the Owner's explicit 'you can reevaluate and suggest': (1) Provisioning: a shared conversation/link already carries a token (existing guest-access pattern in veri-chat-service.ts) -- extend that same token flow so 'continue as guest' also offers 'sign up (stage 0)' via magic-link, creating a REAL persistent user + membership row (stage: 'stage_0', unpaid) tied to the org that shared the link, rather than a one-off guest session. (2) Visibility scope: a stage-0 user's inbox must be a strict allow-list of items explicitly addressed to them (direct messages, @-mentions, tasks/to-dos assigned to them) -- NOT the org's general channels/conversations list, even ones they're nominally a participant of by side-effect. This is a materially narrower scope than client_viewer/external_auditor and needs its own query predicate, not a reuse of an existing 'can view' rank. (3) Tracking: every message/task sent TO a stage-0 user must record which org-user sent it (sender_user_id, org_id, recipient_stage0_user_id, sent_at) -- likely a lightweight audit table or a query view over existing messages/tasks rather than a new parallel messaging system, since the underlying content already lives in veri_chat's own tables; only the WHO-SENT-TO-WHOM index for stage-0 visibility is new. (4) Growth-loop framing: because a stage-0 signup is always attributable to the org/link that shared it, this is structurally the same shape as the existing Sales Engine referral-link mechanism (sales-engine-service.ts's resolveReferralLinkAndRecordClick/recordReferralSignupAndOrgProvisioned) -- worth the dispatched session explicitly comparing the two and recommending whether stage-0 signups should also emit a referral/analytics event (org-level 'N people you invited via chat links have joined as stage-0 users' counter), which is what actually makes this 'free advertisement' visible/measurable to the Owner, not just a passive side-effect. (5) Upgrade path: what happens when a stage-0 user needs more (a real member of the paying org, or a second org invites them too, since one person could hold stage-0 seats across multiple orgs) is NOT specified by the Owner and should be flagged as an open question in the sub-agent's report, not silently decided."
    implementation_merged_2026_07_15: "compliance-tracker#358 merged -- real multi-org stage0Sources membership table, self-serve zero-approval signup off existing guest-access/share-link tokens, both auto-upgrade triggers (person invited by name at an org; org enables a new paid product branch), scoped inbox/outreach views, growth-loop counter, 13 unit tests on the safety-critical 'never reassign a real home org' decision functions. Audited directly by the supervising session (read every file, not just the sub-agent's summary): found and fixed one real CI gap the sub-agent missed (stage0_sources wasn't registered/exempted in ai-os/registry/asset-registry-coverage.yaml -- exempted, matching the sales_referral_links precedent). One minor non-blocking finding for a future pass: consumeStage0TokenAndProvisionUser's stage0Sources insert has no try/catch around its partial-unique-index constraint, so two genuinely simultaneous signups off the same token could surface an unhandled 500 on the second request instead of gracefully treating it as already-joined -- low real-world likelihood, no data-integrity impact.
