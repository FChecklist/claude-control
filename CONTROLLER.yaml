# ============================================================================
# CONTROLLER.yaml -- cross-project requirements & decision catalog
#
# Created 2026-07-14 (Owner directive: a single controller that classifies
# and catalogues requirements across every project, so a new session or
# sub-agent doesn't have to re-derive context from scratch). This spans
# EVERY project under C:\Users\Dell\Downloads\Claude Code\ -- it is
# deliberately NOT inside any one project's own repo (compliance-tracker,
# projexa, veda-advisors), because it has to sit one level above all of
# them, the same way this folder sits one level above all of them on disk.
#
# THIS FILE DOES NOT REPLACE A PROJECT'S OWN TRACKER. VERIDIAN already has
# ai-os/MASTER-TRACKER.yaml (open work) and ai-os/boss/ACTIVE-CLAIMS.yaml
# (parallel-session coordination) -- this file POINTS at those, it never
# duplicates their content. Same discipline that produced
# ai-os/CONSTITUTION.yaml v2.0 this same day: one source of truth per
# question, referenced, not restated in two places that can drift apart.
#
# PROTOCOL (every session, every sub-agent, every time):
#   1. Read this file FIRST, before any research, before any project-
#      specific tracker -- this is the outermost "read before starting
#      work" layer, one level above CLAUDE.md's own list inside VERIDIAN.
#   2. Starting new work: add a new entry under `entries` immediately
#      (status: idea/draft/in-progress), not retroactively once finished.
#   3. Finishing work: flip `status` to done/deferred/blocked and fill in
#      `where` with the real pointer (PR number, artifact URL, memory
#      filename) -- never restate the content itself here.
#   4. Edit per-entry. Never rewrite this file wholesale.
#   5. If an entry needs more than one line to explain, that explanation
#      belongs at the `where` target, not here -- this file stays a fast
#      index, not a second copy of the detail.
# ============================================================================

# ----------------------------------------------------------------------------
# INTAKE -> TIGHTEN -> DISPATCH -> SELF-AUDIT -> CLOSE LIFECYCLE
# (added 2026-07-14, Owner directive: "controller and my instructions, rest
# everything to be done by controller")
#
# Every new instruction the Owner gives, in ANY session, goes through this
# before code is touched. A YAML file cannot act by itself -- this lifecycle
# is carried out by whichever session (human-triggered or scheduled-wakeup,
# see control/README.md "Automation") reads this file next.
#
#   1. INTAKE -- log the instruction as a new entry immediately, status:
#      idea. `raw_instruction` holds the Owner's words verbatim, unedited.
#      Do this before any research or code changes, even exploratory ones.
#
#   2. TIGHTEN -- rewrite raw_instruction into a scoped brief and store it
#      in `tightened_prompt`: goal / files-or-paths / constraints /
#      done-when. Flip status -> draft once this exists. A vague Owner
#      instruction becomes a concrete, boundaried task here -- this is
#      where scope creep gets cut, not left for the implementing session
#      to guess at.
#
#   3. DISPATCH -- decide solo vs sub-agents and record it in `dispatch`:
#        - solo               -- single file/concern, small enough to just do
#        - subagents:N        -- N independent parallelizable pieces, or a
#                                 task spanning >1 project (use the Agent
#                                 tool, N scoped self-contained prompts)
#      Flip status -> in-progress.
#
#   4. SELF-AUDIT -- before flipping to done, the SAME session that did the
#      work re-checks its own diff/output against tightened_prompt's
#      done-when criteria (self-review, not an independent second agent --
#      Owner's explicit choice, 2026-07-14). Record `audit: pass` or
#      `audit: pass-with-notes:<...>`. If it fails, status goes to
#      `blocked`, not `done`.
#
#   5. CLOSE -- flip status -> done, fill `where` with the real pointer,
#      update last_touched.
#
# A scheduled wakeup periodically starts a session that scans for entries
# stuck at idea/draft/in-progress and drives them through this lifecycle
# even if the Owner hasn't opened a chat that day. It only ever acts on
# entries already logged here -- it does not invent new work.
# ----------------------------------------------------------------------------

