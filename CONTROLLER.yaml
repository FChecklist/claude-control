  - id: UIKIT-01
    project: veridian
    type: architecture-spec
    status: in-progress
    summary: "Owner directive 2026-07-18: colors/fonts/navigation must exactly match compliance-tracker/veridian-scope-selector-in-home.html across VERIDIAN AI OS, PROJEXA, and future products -- as one shared, reusable module, not per-product re-implementations that drift apart (PROJEXA's original independent px-* 'construction/blueprint' palette was exactly this problem). Built new repo FChecklist/veridian-ui-kit (public -- had to flip from private after confirming bun's github: dependency resolution can't authenticate to private repos even with git credentials configured; both Vercel builds would have needed their own deploy-key wiring too). Scoped deliberately to the reference mockup's shell behavior only (design tokens, AppShellFrame/VeriComposer/PanelShell primitives, createVeriChatContext factory) -- NOT VERIDIAN's more advanced real features (FDE fallback, high-impact-action confirmation, multi-thread AI conversations, Meetings/Approvals/Voice panel tabs), which stay product-side per the package's own README boundary."
    where: "New repo: github.com/FChecklist/veridian-ui-kit (tagged v0.1.0). compliance-tracker PR #436 (merged, commit 3d3f6aef): confirmed VERIDIAN's own tokens already matched the mockup exactly (no change needed); found and fixed the one real drift -- AppShell.tsx never actually hid VeriChatPanel on /home despite the mockup calling for the merge, live-verified via DOM inspection against the real demo_org. Full package-level component swap for VERIDIAN itself NOT done in this pass (real regression risk -- VERIDIAN's actual components have substantially more live functionality than the mockup covers) -- flagged as a separate, larger follow-on decision. projexa PR #38 (open, awaiting Owner review -- no CI/branch-protection in that repo to auto-merge against): full adoption -- px-* tokens now alias the shared ct-* values (zero className rewrite needed across 34+ pages), heading font swapped to shared DM Serif Display, merged-Home pattern added on /dashboard using PROJEXA's own real VeriComposer/VeriChatPanel data wiring (not the shared package's generic composer). All 3 changes live-verified in a real browser against working demo accounts, not just typechecked."
    last_touched: "2026-07-18"
    raw_instruction: "make sure that the colour, fonts, navigation, in VERIDIAN AI OS, PROJEXA and all the products and services is exactly same as [veridian-scope-selector-in-home.html] ... make this a universal ui / ux. Make a module where its kept and from where complete FChecklist / Veridian ai os / PROJEXA / products / projects / modules / functions can take it. exactly this"
    dispatch: "solo (Super Boss, direct execution, plan-mode-confirmed) -- 2 explicit decisions confirmed with Owner before building: (1) new repo + git-dependency distribution over private-npm-registry or full monorepo restructuring, (2) VERIDIAN itself adopts the shared module too, not just PROJEXA. A 3rd decision (make the new repo public, given bun's private-repo git-dependency limitation) confirmed mid-build."
    audit: "pass -- structured AUDIT: PASS posted on compliance-tracker PR #436 (tier1, self-merged after CI green). projexa PR #38 left for Owner's own review/merge -- that repo has no CI or branch protection to gate an autonomous merge against, unlike compliance-tracker's tiered trust model."

