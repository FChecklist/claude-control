eriChatPanel Approvals tab covers that same gap. Constraint (all agents): do not touch src/lib/supabase/auth-guard.ts or change the shape of any auth/membership table in schema.ts -- PLATFORM-01 (PR #339) owns those files this wave. Done-when: Wave 1's 4 workstreams shipped as real merged PRs, same audit rigor as Priority 15/16 (independent review, no self-certification)."
