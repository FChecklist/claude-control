# ============================================================================
# CONTROLLER.yaml -- cross-project requirements & decision catalog
#
# Created 2026-07-14 (Owner directive: a single controller that classifies
# and catalogues requirements across every project, so a new session or
# sub-agent doesn't have to re-derive context from scratch). This spans
# EVERY project under C:\Users\Dell\Downloads\Claude Code\ -- it is
# deliberately NOT inside any one project's own repo (compliance-tracker,
# projexa, veda-advisors), because it has to sit one level above all of
# them, the same way this folder sits one level above all of them on disk.
#
# THIS FILE DOES NOT REPLACE A PROJECT'S OWN TRACKER. VERIDIAN already has
# ai-os/MASTER-TRACKER.yaml (open work) and ai-os/boss/ACTIVE-CLAIMS.yaml
# (parallel-session coordination) -- this file POINTS at those, it never
# duplicates their content. Same discipline that produced
# ai-os/CONSTITUTION.yaml v2.0 this same day: one source of truth per
# question, referenced, not restated in two places that can drift apart.
#
# PROTOCOL (every session, every sub-agent, every time):
#   1. Read this file FIRST, before any research, before any project-
#      specific tracker -- this is the outermost "read before starting
#      work" layer, one level above CLAUDE.md's own list inside VERIDIAN.
#   2. Starting new work: add a new entry under `entries` immediately
#      (status: idea/draft/in-progress), not retroactively once finished.
#   3. Finishing work: flip `status` to done/deferred/blocked and fill in
#      `where` with the real pointer (PR number, artifact URL, memory
#      filename) -- never restate the content itself here.
#   4. Edit per-entry. Never rewrite this file wholesale.
#   5. If an entry needs more than one line to explain, that explanation
#      belongs at the `where` target, not here -- this file stays a fast
#      index, not a second copy of the detail.
# ============================================================================

meta:
  version: 1
  scope: "Everything raajat.agarwal@gmail.com has asked Claude across every project under C:\\Users\\Dell\\Downloads\\Claude Code\\"
  owner: raajat.agarwal@gmail.com
  org:
    id: FChecklist
    name: "FChecklist (GitHub org hosting compliance-tracker, projexa, veda-advisors)"
    real_cross_repo_scope_declaration: "compliance-tracker/ai-os/sentinel/SENTINEL.yaml's scope.repositories list -- the one real, existing file that names all 3 repos together as one governed scope. No single org-wide governance file exists beyond this; each repo has its own AGENTS.md, not shared."
  projects:
    - id: veridian
      name: "VERIDIAN AI OS (compliance-tracker)"
      local_path: "compliance-tracker"
      repo: "FChecklist/compliance-tracker"
      own_tracker: "ai-os/MASTER-TRACKER.yaml"
      own_claims_registry: "ai-os/boss/ACTIVE-CLAIMS.yaml"
      own_constitution: "ai-os/CONSTITUTION.yaml"
      own_x_files_index: "The Owner's ~24-file 'X-Files' metadata set, 2 layers -- Layer A is Claude's own memory (memory/INDEX.yaml, memory/rajat_claude_discussion_metadata_registry.md), Layer B is this repo's governance files (ai-os/OS.yaml is Layer B's own entry point, which already lists the rest: MASTER-TRACKER.yaml, CONSTITUTION.yaml, registry/knowledge-metadata-registry.yaml, registry/stale-doc-manifest.yaml, SELF-CHECK.md, docs/master/INDEX.md). See memory/x_files_registry_index.md for the full set and its honest coverage limits (not exhaustive, no full auto-update)."
    - id: projexa
      name: "PROJEXA Construction Intelligence OS"
      local_path: "projexa"
      repo: "FChecklist/projexa"
      own_governance: "No ai-os/ layer, no CLAUDE.md, no MASTER-TRACKER.yaml/CONSTITUTION.yaml equivalent -- confirmed by direct directory listing 2026-07-14, not assumed. Real governance files at repo root: AGENTS.md (authorized agents), PROJEXA_TASK_GOVERNANCE.md (task lifecycle), PROJEXA_GAP_ANALYSIS.md (gap tracker, closest thing to a MASTER-TRACKER here)."
    - id: veda-advisors
      name: "Veda Advisors"
      local_path: "veda-advisors/code-by-zai"
      local_path_note: "The real app code lives in the code-by-zai/ subfolder, NOT the veda-advisors/ repo root (which holds only prompt docs, marketing notes, and a separate website/ dir) -- a known gotcha, see memory/agent_access_and_tooling.md."
      repo: "FChecklist/veda-advisors"
      own_governance: "AGENTS.md, CLAUDE.md, SENTINEL.md, VEDA_ADVISORS_GOVERNANCE.md -- all at code-by-zai/ root, confirmed present 2026-07-14."
      own_tracker: "ai-os/boss/BOARD.yaml (open work) + ai-os/boss/COMPLETED.yaml (done work) -- no MASTER-TRACKER.yaml equivalent; BOARD.yaml is the real one here, unlike compliance-tracker where BOARD.yaml is stale. Do not assume the same staleness applies across repos."
      own_os_index: "ai-os/OS.yaml"
    - id: content-pipeline
      name: "Content Pipeline"
      local_path: "content-pipeline"

# ----------------------------------------------------------------------------
# ENTRY SCHEMA
#   id           -- stable, never reused, short prefix + number (e.g. CACHE-01)
#   project      -- one of the ids under meta.projects
#   type         -- feature | architecture-spec | governance | removal
#                   | research | decision | bugfix
#   status       -- idea | draft | in-progress | done | deferred | blocked
#   summary      -- ONE line, plain language
#   where        -- pointer only: PR number, artifact URL, memory filename
#   last_touched -- date this entry was last edited
# ----------------------------------------------------------------------------
